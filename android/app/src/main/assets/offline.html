<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS offline</title>
<style>
*{box-sizing:border-box} html,body{margin:0;height:100%;background:#07090d;color:#d3dbe6;font-family:sans-serif}
body{display:grid;place-items:center;padding:24px;text-align:center}
.orb{width:90px;height:90px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle,#999 0%,#555 40%,rgba(90,90,90,.2) 65%,transparent 72%)}
h1{letter-spacing:.2em;color:#ffd23f;font-size:18px;margin:0 0 10px}
p{color:#8a95a7;font-size:14px;line-height:1.55;max-width:340px;margin:0 auto 6px}
#why{color:#5d6878;font-size:11px;margin-top:8px}
button{display:block;width:240px;margin:12px auto 0;padding:13px;font-size:13px;font-weight:700;letter-spacing:.12em;border-radius:8px;border:1px solid #ffd23f}
.go{background:#ffd23f;color:#000}.alt{background:none;color:#ffd23f}
</style></head><body>
<div>
  <div class="orb"></div>
  <h1>JARVIS IS OFFLINE</h1>
  <p>I can't reach your laptop, Sir.</p>
  <p>Check that the laptop is on and JARVIS is running, and that Tailscale is switched on on this phone.</p>
  <div id="why"></div>
  <button class="go" onclick="JarvisNative.retry()">RETRY</button>
  <button class="alt" onclick="JarvisNative.changeAddress()">CHANGE ADDRESS</button>
</div>
<script>document.getElementById("why").textContent = new URLSearchParams(location.search).get("why") || "";</script>
</body></html>
