<!doctype html>
<!-- SOLO-JARVIS: the phone's own JARVIS. Runs inside the app when the laptop is off or far away. -->
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS Solo</title>
<meta name="theme-color" content="#03060a">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--c:#ffd23f;--c2:#5fd8ff;--bg:#03060a;--line:#16212d;--dim:#7d8899;--ink:#dce7f2;--panel:rgba(12,18,26,.78)}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"JetBrains Mono",ui-monospace,monospace;-webkit-tap-highlight-color:transparent}
body{padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:radial-gradient(520px 520px at 50% 24%,color-mix(in srgb,var(--c) 12%,transparent),transparent 70%),
             radial-gradient(420px 300px at 50% 100%,color-mix(in srgb,var(--c2) 8%,transparent),transparent 70%),var(--bg);
  max-width:640px;margin:0 auto;min-height:100vh}
html{background:var(--bg)}
button{font-family:inherit;cursor:pointer}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font:900 13px Orbitron,sans-serif;letter-spacing:.34em;color:var(--c);text-shadow:0 0 12px var(--c)}
.r{display:flex;align-items:center;gap:8px}
#clock{font:500 11px "JetBrains Mono",monospace;color:var(--dim)}
.badge{font:700 9px Orbitron,sans-serif;letter-spacing:.16em;padding:7px 10px;border-radius:999px;border:1px solid var(--c2);color:var(--c2);
  box-shadow:0 0 14px color-mix(in srgb,var(--c2) 30%,transparent);animation:pulse 2.6s ease-in-out infinite;white-space:nowrap}
@keyframes pulse{50%{box-shadow:0 0 22px color-mix(in srgb,var(--c2) 55%,transparent)}}
#back{display:none;margin:10px 0 0;width:100%;padding:11px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);
  color:var(--c);font:700 10px Orbitron,sans-serif;letter-spacing:.2em;border-radius:10px}
#back.on{display:block}
.core{position:relative;width:min(58vw,250px);aspect-ratio:1;margin:12px auto 2px;cursor:pointer}
.core canvas{width:100%;height:100%;display:block}
#state{text-align:center;font:700 10px Orbitron,sans-serif;letter-spacing:.3em;color:var(--dim);min-height:14px}
#said{text-align:center;font:600 15px/1.45 "JetBrains Mono",monospace;min-height:44px;margin:8px auto 0;max-width:520px;word-wrap:break-word}
#said small{display:block;font:700 9px Orbitron,sans-serif;letter-spacing:.3em;color:var(--c);margin-bottom:3px}
#heard{text-align:center;color:var(--c2);font-size:12px;min-height:16px;margin-top:4px;opacity:.85}
#note{display:none;margin:10px 0;padding:10px 12px;border:1px solid #6b4b14;background:rgba(60,40,8,.45);color:#ffdf8a;font-size:12px;line-height:1.5;border-radius:10px}
#note.on{display:block}
form{display:flex;gap:8px;margin:12px 0 10px}
#q{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:12px;font:500 14px "JetBrains Mono",monospace;border-radius:10px;outline:none}
#q:focus{border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 18px color-mix(in srgb,var(--c) 25%,transparent)}
form button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:0 14px;font-size:18px}
form button.on{border-color:var(--c);color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 35%,transparent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);font:600 10px Orbitron,sans-serif;letter-spacing:.1em;padding:9px 11px;border-radius:999px}
.chips button:active{border-color:var(--c);color:var(--c)}
h2{font:700 10px Orbitron,sans-serif;letter-spacing:.3em;color:var(--dim);margin:16px 0 8px;display:flex;justify-content:space-between}
h2 span{color:var(--c2);letter-spacing:.1em}
#log{display:grid;gap:8px}
.m{padding:9px 11px;border:1px solid var(--line);background:var(--panel);border-radius:10px;font-size:13px;line-height:1.45}
.m small{display:block;font:700 8px Orbitron,sans-serif;letter-spacing:.24em;color:var(--dim);margin-bottom:3px}
.m.you{border-color:#1f3343;margin-left:18%}
.m.you small{color:var(--c2)}
.m.j small{color:var(--c)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cards div{border:1px solid var(--line);background:var(--panel);padding:9px 6px;text-align:center;border-radius:10px;min-width:0}
.cards b{display:block;font:700 13px Orbitron,sans-serif;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cards small{font:600 8px Orbitron,sans-serif;letter-spacing:.2em;color:var(--dim)}
#mapbox{display:none;position:fixed;inset:0;z-index:20;background:var(--bg)}
#mapbox.on{display:block}
#map{position:absolute;inset:0;background:#05080c}
.leaflet-tile-pane{filter:invert(1) hue-rotate(195deg) brightness(.85) contrast(.95) saturate(.6)}
.leaflet-control-attribution{background:rgba(0,0,0,.5)!important;color:#567!important;font-size:9px!important}
.leaflet-control-attribution a{color:#789!important}
#mapcard{position:absolute;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));z-index:500;background:rgba(5,10,16,.9);
  border:1px solid var(--c);border-radius:14px;padding:12px 14px;box-shadow:0 0 26px color-mix(in srgb,var(--c) 25%,transparent);backdrop-filter:blur(6px)}
#mapcard b{font:700 12px Orbitron,sans-serif;letter-spacing:.14em;color:var(--c)}
#mapcard p{margin:6px 0 0;font-size:12px;line-height:1.5;color:var(--ink)}
#mapclose{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;z-index:500;border:1px solid var(--c);background:rgba(5,10,16,.85);
  color:var(--c);font:700 10px Orbitron,sans-serif;letter-spacing:.2em;padding:10px 14px;border-radius:999px}
#cam{display:none;position:fixed;inset:0;z-index:30;background:#000}
#cam.on{display:block}
#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cam .hud{position:absolute;inset:8%;border:1px solid transparent;pointer-events:none;
  background:linear-gradient(var(--c),var(--c)) 0 0/34px 2px no-repeat,linear-gradient(var(--c),var(--c)) 0 0/2px 34px no-repeat,
  linear-gradient(var(--c),var(--c)) 100% 0/34px 2px no-repeat,linear-gradient(var(--c),var(--c)) 100% 0/2px 34px no-repeat,
  linear-gradient(var(--c),var(--c)) 0 100%/34px 2px no-repeat,linear-gradient(var(--c),var(--c)) 0 100%/2px 34px no-repeat,
  linear-gradient(var(--c),var(--c)) 100% 100%/34px 2px no-repeat,linear-gradient(var(--c),var(--c)) 100% 100%/2px 34px no-repeat;filter:drop-shadow(0 0 6px var(--c))}
#cam .scan{position:absolute;left:8%;right:8%;height:2px;top:8%;background:linear-gradient(90deg,transparent,var(--c),transparent);box-shadow:0 0 14px var(--c);animation:scan 2.2s ease-in-out infinite alternate;opacity:.8}
#cam.busy .scan{animation-duration:.6s}
@keyframes scan{to{top:92%}}
#cam .bar{position:absolute;left:0;right:0;bottom:0;padding:12px 14px max(16px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.85) 40%);display:grid;gap:10px}
#cam .out{font:600 14px/1.5 "JetBrains Mono",monospace;color:#fff;text-shadow:0 2px 8px #000;max-height:32vh;overflow:auto}
#cam .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#cam .btns button{border:1px solid var(--c);background:rgba(5,10,16,.8);color:var(--c);font:700 10px Orbitron,sans-serif;letter-spacing:.16em;padding:12px 14px;border-radius:999px}
#cam .btns .go{background:var(--c);color:#02040a}
#cam .x{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;border:1px solid var(--c);background:rgba(5,10,16,.8);color:var(--c);font:700 10px Orbitron,sans-serif;letter-spacing:.2em;padding:10px 14px;border-radius:999px}
#cam .tag{position:absolute;top:max(18px,env(safe-area-inset-top));left:16px;font:700 10px Orbitron,sans-serif;letter-spacing:.3em;color:var(--c);text-shadow:0 0 10px var(--c)}
.chips button.on{border-color:var(--c);color:var(--c);box-shadow:0 0 12px color-mix(in srgb,var(--c) 35%,transparent)}
.foot{margin-top:16px;text-align:center;color:#4d5a6a;font-size:10px;line-height:1.6}
@media (min-width:700px){body{padding-top:28px}.core{width:240px}}
</style></head><body>
<header><b>JARVIS</b><div class="r"><span class="badge" id="badge">📱 SOLO</span><span id="clock">--:--</span></div></header>
<button id="back">💻 LAPTOP IS BACK · SWITCH</button>
<div class="core" id="core" role="button" aria-label="Tap to talk to JARVIS"><canvas id="rx"></canvas></div>
<div id="state">TAP TO TALK</div>
<div id="said" aria-live="polite"></div>
<div id="heard"></div>
<div id="note"></div>
<form id="f"><input id="q" placeholder="Ask JARVIS anything…" autocomplete="off" enterkeyhint="send"><button type="button" id="mic" aria-label="Talk">🎙</button><button type="button" id="hands" aria-label="Hands-free">👂</button></form>
<div class="chips" id="chips">
  <button data-q="What's next for me today?">📅 NEXT</button>
  <button data-q="Take me home">🏠 HOME</button>
  <button data-q="What's the weather like?">🌦 WEATHER</button>
  <button data-q="What are my tasks?">✅ TASKS</button>
  <button data-q="Where am I?">📍 WHERE AM I</button>
  <button data-q="Remind me in 30 minutes to ">⏰ REMIND</button>
  <button id="dayBtn">✨ MY DAY</button>
  <button id="camBtn">📷 EXPLAIN</button>
  <button id="labBtn">🌐 HOLO LAB</button>
  <button id="holoBtn">🧪 HOLO SIMS</button>
  <button id="guestBtn">🎭 GUEST</button>
  <button id="trailerBtn">🎬 SHOW OFF</button>
</div>
<div class="cards"><div><small>NEXT</small><b id="cNext">—</b></div><div><small>TASKS</small><b id="cTasks">—</b></div><div><small>TO SYNC</small><b id="cSync">0</b></div></div>
<h2>CONVERSATION <span id="synced"></span></h2>
<div id="log"></div>
<div class="foot">Solo mode: JARVIS runs on this phone by itself over Wi-Fi or mobile data.<br>Everything here syncs to your laptop the next time it's on.</div>
<div id="cam"><video playsinline muted autoplay></video><div class="hud"></div><div class="scan"></div><div class="tag">JARVIS · VISION</div>
  <button class="x" id="camX">✕ CLOSE</button>
  <div class="bar"><div class="out" id="camOut">Point at anything, Sir: a menu, a sign, your notes, a gadget.</div>
    <div class="btns"><button class="go" data-cam="explain">◉ EXPLAIN</button><button data-cam="translate">文 TRANSLATE</button><button data-cam="read">≡ READ IT</button><button data-cam="ask">? ASK</button></div></div></div>
<div id="mapbox"><div id="map"></div><button id="mapclose">✕ CLOSE</button><div id="mapcard"><b id="mapT">ROUTE</b><p id="mapP"></p></div></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const N = window.JarvisNative || null;
const LS = {get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
            set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }};

// ---------------------------------------------------------------- what JARVIS knows (pack from the laptop + what was added here)
let PACK = {};
try { PACK = JSON.parse(N?.soloPack?.() || "{}"); } catch { PACK = {}; }
if (!N && window.__TEST_PACK) PACK = window.__TEST_PACK;
const made = PACK.made ? new Date(PACK.made) : null;
let LOCAL = LS.get("solo:local", {memories: [], tasks: [], done: [], events: [], reminders: [], notes: []});
if (made) for (const k of Object.keys(LOCAL)) LOCAL[k] = (LOCAL[k] || []).filter(x => !x.at || new Date(x.at) > made);   // already on the laptop
const saveLocal = () => LS.set("solo:local", LOCAL);
saveLocal();
const OWNER = PACK.owner || "Sir";
const TEAM = PACK.team || [];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function queue(item){ item.uid = item.uid || uid(); item.at = item.at || new Date().toISOString(); try { N?.soloSave?.(JSON.stringify(item)); } catch {} bumpSync(); }
let toSync = PACK.queued || 0;
function bumpSync(){ toSync++; $("#cSync").textContent = toSync; }

const memories = () => [...(PACK.memories || []), ...LOCAL.memories.map(m => m.fact)];
const tasks = () => [...(PACK.tasks || []), ...LOCAL.tasks].filter(t => !LOCAL.done.some(d => d.title.toLowerCase() === t.title.toLowerCase()));
const events = () => [...(PACK.events || []), ...LOCAL.events].sort((a, b) => (a.start > b.start ? 1 : -1));
const pad = n => String(n).padStart(2, "0");
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const localISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${hm(d)}`;
function ago(d){ const m = Math.round((Date.now() - d) / 60000); return m < 2 ? "just now" : m < 60 ? `${m} min ago` : m < 2880 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} days ago`; }

// ---------------------------------------------------------------- internet (through the app, which adds the keys)
const pending = {};
window.__soloFetch = (id, status, text) => { const p = pending[id]; if (p){ delete pending[id]; p({status, text}); } };
async function net(url, {method = "GET", headers = {}, body = ""} = {}){
  if (N?.soloFetch){
    const id = uid();
    const r = await new Promise(res => { pending[id] = res; N.soloFetch(id, url, method, JSON.stringify(headers), body || ""); setTimeout(() => pending[id] && window.__soloFetch(id, 0, "timeout"), 60000); });
    return r;
  }
  try { const r = await fetch(url, {method, headers: method === "GET" ? headers : {"Content-Type": "application/json", ...headers}, body: method === "GET" ? undefined : body});
    return {status: r.status, text: await r.text()}; } catch (e) { return {status: 0, text: String(e)}; }
}
async function json(url, opts){ const r = await net(url, opts); if (r.status < 200 || r.status >= 300) throw new Error(`HTTP ${r.status}: ${r.text.slice(0, 160)}`); return JSON.parse(r.text); }

// ---------------------------------------------------------------- where the owner is
function here(){
  try { const l = JSON.parse(N?.soloLocation?.() || ""); if (l && l.lat) return l; } catch {}
  return LS.get("solo:lastloc", null);
}
async function hereFresh(){
  const viaGps = await new Promise(res => { if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(p => res({lat: p.coords.latitude, lon: p.coords.longitude, accuracy: p.coords.accuracy, age: 0}), () => res(null), {enableHighAccuracy: true, timeout: 7000, maximumAge: 60000}); });
  const l = viaGps || here(); if (l) LS.set("solo:lastloc", l); return l;
}
const inSG = l => l && l.lat > 1.15 && l.lat < 1.48 && l.lon > 103.6 && l.lon < 104.1;
const dist = (a, b) => { const R = 6371, t = x => x * Math.PI / 180, dl = t(b.lat - a.lat), dn = t(b.lon - a.lon);
  const h = Math.sin(dl / 2) ** 2 + Math.cos(t(a.lat)) * Math.cos(t(b.lat)) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };

async function geocode(q, near){
  const saved = PACK.places || {};
  const key = Object.keys(saved).find(k => k.toLowerCase() === q.toLowerCase().replace(/^(my |the )/, ""));
  if (key) return {name: key, lat: saved[key][0], lon: saved[key][1]};
  if (!near || inSG(near)){
    try { const d = await json(`https://www.onemap.gov.sg/api/common/elastic/search?searchVal=${encodeURIComponent(q)}&returnGeom=Y&getAddrDetails=Y&pageNum=1`);
      const r = (d.results || [])[0]; if (r) return {name: r.BUILDING && r.BUILDING !== "NIL" ? r.BUILDING : r.SEARCHVAL, lat: +r.LATITUDE, lon: +r.LONGITUDE}; } catch {}
  }
  const vb = near ? `&viewbox=${near.lon - 1},${near.lat + 1},${near.lon + 1},${near.lat - 1}` : "";
  const d = await json(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=${encodeURIComponent(q)}${vb}`);
  if (!d[0]) throw new Error(`I couldn't find ${q}`);
  return {name: d[0].name || d[0].display_name.split(",")[0], lat: +d[0].lat, lon: +d[0].lon};
}

// ---------------------------------------------------------------- bus stops (LTA), cached on the phone for a week
async function busStops(){
  const c = LS.get("solo:stops", null); if (c && Date.now() - c.at < 7 * 86400e3) return c.stops;
  if (!PACK.has?.lta) return [];
  const out = []; for (let skip = 0; skip < 6000; skip += 500){
    let d; try { d = await json(`https://datamall2.mytransport.sg/ltaodataservice/BusStops?$skip=${skip}`, {headers: {accept: "application/json"}}); } catch { break; }
    const v = d.value || []; v.forEach(s => out.push([s.BusStopCode, s.Description, +s.Latitude.toFixed(5), +s.Longitude.toFixed(5)])); if (v.length < 500) break; }
  if (out.length) LS.set("solo:stops", {at: Date.now(), stops: out}); return out;
}
async function nearestStop(l){ const stops = await busStops(); let best = null;
  for (const [code, name, lat, lon] of stops){ const d = dist(l, {lat, lon}); if (d < .06 && (!best || d < best.d)) best = {code, name, d}; } return best; }
async function stopArrivals(code){
  try { const d = await json(`https://datamall2.mytransport.sg/ltaodataservice/v3/BusArrival?BusStopCode=${code}`, {headers: {accept: "application/json"}});
    return (d.Services || []).map(s => ({bus: s.ServiceNo, mins: ["NextBus", "NextBus2"].map(k => s[k]?.EstimatedArrival).filter(Boolean).map(t => Math.max(0, Math.round((new Date(t) - Date.now()) / 60000)))}))
      .filter(x => x.mins.length).sort((a, b) => a.mins[0] - b.mins[0]); } catch { return []; }
}

// ---------------------------------------------------------------- tools JARVIS can use on the phone by itself
function decodePolyline(s){ const pts = []; let i = 0, lat = 0, lon = 0;
  while (i < s.length){ for (const w of [0, 1]){ let sh = 0, r = 0, b; do { b = s.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; } while (b >= 32);
    const d = r & 1 ? ~(r >> 1) : r >> 1; if (w) lon += d; else lat += d; } pts.push([lat / 1e5, lon / 1e5]); } return pts; }
function grabFare(km, min, when, rain){ let base = 3 + .75 * km + .22 * min + .9, surge = 1; const h = when.getHours();
  if ((h >= 7 && h < 10) || (h >= 17 && h < 20)) surge += .3; if (rain) surge += .35; if (h < 6) surge += .25;
  const lo = Math.max(6, base * surge * .9); return [Math.round(lo), Math.round(Math.max(lo + 2, base * surge * 1.2))]; }
async function osrm(a, b, mode){
  const prof = {walk: ["foot", "foot"], drive: ["car", "driving"]}[mode];
  try { const d = await json(`https://routing.openstreetmap.de/routed-${prof[0]}/route/v1/${prof[1]}/${a.lon},${a.lat};${b.lon},${b.lat}?overview=full&geometries=geojson`);
    const r = d.routes?.[0]; return r ? {min: Math.round(r.duration / 60), km: r.distance / 1000, line: r.geometry.coordinates.map(c => [c[1], c[0]])} : null; } catch { return null; }
}
async function busLive(stop, svc){
  if (!PACK.has?.lta || !stop) return [];
  try { const d = await json(`https://datamall2.mytransport.sg/ltaodataservice/v3/BusArrival?BusStopCode=${stop}`, {headers: {accept: "application/json"}});
    const s = (d.Services || []).find(x => x.ServiceNo === svc); if (!s) return [];
    return ["NextBus", "NextBus2", "NextBus3"].map(k => s[k]?.EstimatedArrival).filter(Boolean).map(t => Math.max(0, Math.round((new Date(t) - Date.now()) / 60000))); } catch { return []; }
}
async function transit(a, b, arrive){
  if (!PACK.has?.onemap || !inSG(a) || !inSG(b)) return null;
  const w = arrive || new Date();
  const q = new URLSearchParams({start: `${a.lat},${a.lon}`, end: `${b.lat},${b.lon}`, routeType: "pt", mode: "TRANSIT", maxWalkDistance: 1000, numItineraries: 3,
    date: `${pad(w.getMonth() + 1)}-${pad(w.getDate())}-${w.getFullYear()}`, time: `${hm(w)}:00`, arriveBy: arrive ? "true" : "false"});
  let plan; try { plan = (await json(`https://www.onemap.gov.sg/api/public/routingsvc/route?${q}`)).plan; } catch { return null; }
  const its = plan?.itineraries || []; if (!its.length) return null;
  const it = its.reduce((x, y) => (y.duration < x.duration ? y : x));
  const legs = [], line = []; let firstBus = null;
  for (const lg of it.legs || []){
    const leg = {mode: lg.mode, min: Math.round(lg.duration / 60), from: lg.from?.name || "", to: lg.to?.name || "", route: lg.route || lg.routeShortName || ""};
    if (lg.mode === "BUS"){ leg.live = await busLive(lg.from?.stopCode, leg.route); firstBus = firstBus || leg; }
    if (lg.legGeometry?.points) line.push(...decodePolyline(lg.legGeometry.points));
    legs.push(leg);
  }
  let leave = new Date(it.startTime);
  if (firstBus?.live?.length && !arrive){ const walk = legs.slice(0, legs.indexOf(firstBus)).filter(x => x.mode === "WALK").reduce((s, x) => s + x.min, 0);
    const nx = firstBus.live.find(m => m >= walk + 1); if (nx != null) leave = new Date(Date.now() + (nx - walk - 1) * 60000); }

const MODEL = () => /^gemini-(1\.|2\.0)/.test(PACK.model || "") ? "gemini-flash-latest" : PACK.model || "gemini-flash-latest";
// Each free model has its own daily allowance: if one is used up, the next one answers.
const SPARES = ["gemini-flash-latest", "gemini-2.5-flash", "gemini-flash-lite-latest", "gemini-2.5-flash-lite"];
async function gemini(body){
  const spent = LS.get("solo:spent", {}), now = Date.now(); let last;
  for (const m of [...new Set([MODEL(), ...SPARES])]){
    if ((spent[m] || 0) > now) continue;
    try { return await json(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`, {method: "POST", body: JSON.stringify(body)}); }
    catch (e) { last = e; if (/HTTP 429/.test(e.message)){ spent[m] = now + (/PerDay|per day/i.test(e.message) ? 3600e3 : 120e3); LS.set("solo:spent", spent); continue; }
      if (/HTTP 404/.test(e.message) || (/HTTP 400/.test(e.message) && /model/i.test(e.message))){ spent[m] = now + 7 * 864e5; LS.set("solo:spent", spent); continue; }
      throw e; }
  }
  throw last || new Error("HTTP 429: all free models used up");
}

async function think(text){

// Lines JARVIS has already said in his premium voice are kept on the phone (up to 300) and replayed for free.
const VCACHE = (() => { let db = null;
  const open = () => db || (db = new Promise(res => { try { const r = indexedDB.open("jarvis-voice", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("lines"); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch { res(null); } }));
  const tx = async (mode, fn) => { const d = await open(); if (!d) return null;
    return new Promise(res => { try { const t = d.transaction("lines", mode), q = fn(t.objectStore("lines")); q.onsuccess = () => res(q.result); q.onerror = () => res(null); } catch { res(null); } }); };
  return {get: k => tx("readonly", st => st.get(k)), put: (k, blob) => { if (blob.size < 700e3) tx("readwrite", st => st.put({blob, t: Date.now()}, k)).then(async () => {
      const keys = await tx("readonly", st => st.getAllKeys()); if (keys && keys.length > 300) tx("readwrite", st => st.delete(keys[0])); }); }};
})();
const vkey = (agent, text) => agent + "|" + text.toLowerCase().replace(/[^a-z0-9 ]/g, "").replace(/\s+/g, " ").trim();
async function premiumVoice(agent, text){
  try { const hit = await VCACHE.get(vkey(agent, text)); if (hit?.blob) return URL.createObjectURL(hit.blob); } catch {}
  if (!PACK.has?.gemini || !PACK.voices || Date.now() < voiceDown || LS.get("solo:robotvoice", false)) return null;
  const [name, who, mood] = (PACK.voices.cast || {})[agent] || (PACK.voices.cast || {}).JARVIS || ["Charon", "a refined British butler AI", "dry"];
  const h = new Date().getHours(), when = h >= 23 || h < 6 ? "It's late at night: keep it soft, close and unhurried." : h < 11 ? "It's morning: bright and awake, but not loud." : "";
  const note = (PACK.voices.acting || "You are voicing {who}. Your usual attitude is {mood}; let it colour the whole line. Perform it like a lead actor in a film, with your accent, real emotion and attitude. ")
    .replace("{who}", who).replace("{mood}", mood || "natural");
  const body = JSON.stringify({contents: [{parts: [{text: `${note}${when}\n\n${text}`}]}],
    generationConfig: {responseModalities: ["AUDIO"], speechConfig: {voiceConfig: {prebuiltVoiceConfig: {voiceName: name}}}}});
  for (const model of PACK.voices.models || []){
    const r = await Promise.race([net(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`, {method: "POST", body}), new Promise(res => setTimeout(() => res({status: -1}), 8000))]);
    if (r.status === 404) continue;
    if (r.status !== 200){ voiceDown = Date.now() + (r.status === 429 ? 900e3 : 120e3); return null; }
    try { const part = JSON.parse(r.text).candidates[0].content.parts.find(p => p.inlineData); const rate = +(part.inlineData.mimeType.match(/rate=(\d+)/) || [0, 24000])[1];
      const wav = pcmWav(part.inlineData.data, rate); if (text.length <= 160) VCACHE.put(vkey(agent, text), wav);
      return URL.createObjectURL(wav); } catch { return null; }
  }
  return null;
}

// ---------------------------------------------------------------- vision: point the camera, JARVIS explains
let camStream = null;
async function openCam(){
  $("#cam").classList.add("on");
  try { camStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment", width: {ideal: 1280}}}); $("#cam video").srcObject = camStream; }
  catch { $("#camOut").textContent = "I need the camera for this, Sir (allow it for JARVIS in Settings)."; }
}
function closeCam(){ $("#cam").classList.remove("on"); camStream?.getTracks().forEach(t => t.stop()); camStream = null; }
async function camAsk(kind){
  const v = $("#cam video"); if (!v.videoWidth){ $("#camOut").textContent = "Camera's still waking up, Sir…"; return; }
  if (!PACK.has?.gemini){ $("#camOut").textContent = "Vision needs the free Gemini key, Sir (/gemini once while the laptop's on)."; return; }
  let q = {explain: "Explain what this is and anything useful about it, like JARVIS talking to Tony: 2-3 short spoken sentences.",
           translate: "Translate any text in this picture into English and say what it means. Short and spoken.",
           read: "Read out the important text in this picture, summarised if long. Short and spoken."}[kind];
  if (kind === "ask"){ const t = prompt("Ask about what you're pointing at:"); if (!t) return; q = t + " (answer in 2-3 short spoken sentences)"; }
  const c = document.createElement("canvas"), k = Math.min(1, 1024 / Math.max(v.videoWidth, v.videoHeight)); c.width = v.videoWidth * k; c.height = v.videoHeight * k;
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  $("#cam").classList.add("busy"); $("#camOut").textContent = "Scanning…";
  try {
    const d = await gemini({contents: [{role: "user", parts: [{text: q + (GUEST ? "" : "")}, {inlineData: {mimeType: "image/jpeg", data: c.toDataURL("image/jpeg", .8).split(",")[1]}}]}]});
    const a = (d.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join(" ").trim() || "I can't make that out, Sir.";
    $("#camOut").textContent = a; logLine("JARVIS", "📷 " + a); speak("JARVIS", a);
  } catch (e) { $("#camOut").textContent = "That scan didn't go through, Sir."; }
  $("#cam").classList.remove("busy");
}
$("#camBtn").onclick = openCam; $("#camX").onclick = closeCam;
document.querySelectorAll("[data-cam]").forEach(b => b.onclick = () => camAsk(b.dataset.cam));

// ---------------------------------------------------------------- my day, glowing (works with the laptop off)
async function showDay(){
  let d = {}; try { d = JSON.parse(N?.soloDay?.() || "{}"); } catch {}
  const pts = (d.points || []).map(p => [p[1], p[2], p[0]]);
  const r = await TOOLS.my_day();
  const line = pts.length > 1 ? pts.map(p => [p[0], p[1]]) : (here() ? [[here().lat, here().lon], [here().lat + .0005, here().lon + .0005]] : null);
  if (!line){ show("JARVIS", "No trail yet today, Sir: location needs to be allowed all the time."); return; }
  await showRoute({name: "YOUR DAY"}, line, `${r.steps !== "unknown" ? Number(r.steps).toLocaleString() + " steps · " : ""}${r.km_moved} km` + (r.places_in_order.length ? ` · ${r.places_in_order.join(" → ")}` : ""), true);
}
$("#dayBtn").onclick = showDay;
$("#trailerBtn").onclick = () => { location.href = (N?.localPage?.("trailer.html") || "file:///android_asset/trailer.html") + "?autoplay=1"; };
$("#labBtn").onclick = () => { location.href = "file:///android_asset/holo.html"; };

// ---------------------------------------------------------------- reactor
const cv = $("#rx"), x = cv.getContext("2d");
function fit(){ const r = cv.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2); cv.width = r.width * d; cv.height = r.width * d; x.setTransform(d, 0, 0, d, 0, 0); cv._s = r.width; }
addEventListener("resize", fit); fit();
function draw(t){
  t /= 1000; const s = cv._s, m = s / 2, col = getComputedStyle(document.documentElement).getPropertyValue("--c").trim() || color; x.clearRect(0, 0, s, s);
  const target = speaking ? .55 + Math.random() * .45 : listening ? .35 + .25 * Math.sin(t * 6) : busy ? .3 + .15 * Math.sin(t * 9) : .12 + .08 * Math.sin(t * 2.2); amp += (target - amp) * .2;
  const g = x.createRadialGradient(m, m, 0, m, m, s * (.2 + amp * .1)); g.addColorStop(0, "#fff"); g.addColorStop(.35, col); g.addColorStop(1, "transparent");
  x.fillStyle = g; x.beginPath(); x.arc(m, m, s * .32, 0, Math.PI * 2); x.fill();
  x.lineCap = "round"; const sp = speaking ? 2.4 : busy ? 1.8 : 1;
  [[.25, 3, 1.3, 1.4, 1], [.31, 1.6, -.9, 1.8, .7], [.38, 4, .55, 1.1, .9], [.45, 1.2, -.35, .7, .5]].forEach(([r, w, v, len, a]) => {
    x.strokeStyle = col; x.globalAlpha = a; x.lineWidth = w; x.beginPath(); x.arc(m, m, s * r, t * v * sp, t * v * sp + Math.PI * len); x.stroke(); });
  x.globalAlpha = 1;
  for (let i = 0; i < 10; i++){ const a = i / 10 * Math.PI * 2 + t * .4 * sp; x.save(); x.translate(m + Math.cos(a) * s * .19, m + Math.sin(a) * s * .19); x.rotate(a); x.fillStyle = "#5fd8ff"; x.fillRect(-6, -2, 12, 4); x.restore(); }
  requestAnimationFrame(draw);
}
// the 3D particle core (#18), bundled in the app; the 2D reactor stays as the fallback
const core3d = window.JarvisCore?.mount($("#core"), {distance: 13.5, read: () => ({state: speaking ? "speak" : listening ? "listen" : busy ? "think" : "idle",
  color: getComputedStyle(document.documentElement).getPropertyValue("--c").trim() || color})});
if (core3d) cv.style.display = "none"; else requestAnimationFrame(draw);

  const now = new Date(), e = events().find(v => new Date(v.end || v.start) >= now);
  $("#cNext").textContent = e ? `${e.start.slice(11, 16)} ${e.title}` : "Free";
  $("#cTasks").textContent = tasks().length; $("#cSync").textContent = toSync;
}
setGuest(GUEST);
cards();
$("#synced").textContent = made ? `SYNCED ${ago(made).toUpperCase()}` : "NOT SYNCED YET";
if (!PACK.has?.gemini && N){ $("#note").classList.add("on");
  $("#note").textContent = made ? "Basic mode: reminders, directions, weather, calls, apps and tasks work. For full conversations, send /gemini to your JARVIS bot once while the laptop is on."
                                : "Open JARVIS once while your laptop is on so the phone can copy what it needs to work by itself."; }
LS.get("solo:log", []).slice(-8).forEach(([w, t]) => logLine(w, t, false));
setInterval(() => { $("#clock").textContent = hm(new Date()); }, 1000); $("#clock").textContent = hm(new Date());
setInterval(() => { if (N?.laptopUp?.()) $("#back").classList.add("on"); }, 8000);
$("#back").onclick = () => N?.openLaptop?.();
show("JARVIS", PACK.has?.gemini || !N ? "Laptop's out of reach, Sir, so I'm running on your phone. Everything still works." : "Laptop's out of reach, Sir. I'm on your phone in basic mode.");
if (!N?.headless) hereFresh();
if (new URLSearchParams(location.search).get("talk") === "1") setTimeout(listen, 600);
// The boardroom (#brief): the first time JARVIS opens each day, the team reports in (their last reports from the laptop,
// plus the weather here and now).
async function soloBrief(force){
  const d = new Date(Date.now() - 5 * 3600e3).toDateString();
  if (!window.JarvisBriefing || N?.headless || (!force && LS.get("solo:briefDay", "") === d)) return;
  LS.set("solo:briefDay", d);
  const h = new Date().getHours(), part = h >= 5 && h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
  let w = ""; try { const x = await TOOLS.weather({}); if (!x.error) w = ` It's ${x.temp}° and ${String(x.now).toLowerCase()} here${x.rain_in_hours != null && x.rain_in_hours <= 3 ? `, rain likely in about ${x.rain_in_hours} hours: umbrella` : ""}.`; } catch {}
  const lines = [{agent: "JARVIS", text: `${part}, ${OWNER}.${w}`}];
  const evs = events().filter(e => new Date(e.end || e.start) >= new Date() && e.start.slice(0, 10) === localISO(new Date()).slice(0, 10));
  if (evs.length) lines.push({agent: "JARVIS", text: `Today: ${evs.slice(0, 3).map(e => `${e.title} at ${e.start.slice(11, 16)}`).join(", ")}.`});
  (PACK.briefing || []).forEach(l => lines.push(l));
  lines.push({agent: "JARVIS", text: lines.length > 1 ? "That's the briefing. Where shall we start?" : "All quiet. The team awaits your orders."});
  await JarvisBriefing.play(lines, (a, t) => speak(a, t, false));
}
setTimeout(() => soloBrief(false), 1800);
// Came over from the laptop page mid-question: answer it here.
{ const pend = new URLSearchParams(location.search).get("ask"); if (pend) setTimeout(() => ask(pend), 900); }
