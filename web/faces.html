<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agent Faces</title>
<meta name="theme-color" content="#03060a"><link rel="icon" href="/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Preview: holographic agent faces. They blink, look at you, wear their mood, and talk (mouth follows the voice). */
*{box-sizing:border-box}html,body{margin:0;background:#03060a;color:#dce7f2;font-family:"JetBrains Mono",monospace}
body{min-height:100vh;background:radial-gradient(circle at 50% 0,#0c2030,#03060a 65%)}
.top{display:flex;align-items:center;gap:10px;padding:16px 18px}.top b{font:700 13px Orbitron,sans-serif;letter-spacing:.3em;color:#ffd23f;text-shadow:0 0 14px #ffd23f66}
.top a{margin-left:auto;color:#8a95a7;text-decoration:none;font-size:12px;border:1px solid #1b2735;padding:6px 10px;border-radius:16px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:0 18px 18px}
@media(max-width:820px){.stage{grid-template-columns:1fr}}
.hero{position:relative;border:1px solid #1b2735;background:radial-gradient(circle at 50% 45%,#0b1a28,#04080d 70%);min-height:440px;display:grid;place-items:center;overflow:hidden}
.hero canvas{width:min(420px,90%);aspect-ratio:1}
.hero .name{position:absolute;left:0;right:0;bottom:56px;text-align:center;font:700 22px Orbitron,sans-serif;letter-spacing:.3em}
.hero .line{position:absolute;left:8%;right:8%;bottom:18px;text-align:center;font-size:13px;color:#fff;min-height:20px}
.moods{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}
.moods button,.say{background:rgba(10,17,26,.8);color:#c9d3e0;border:1px solid #1f3346;font:600 9px Orbitron,sans-serif;letter-spacing:.14em;padding:7px 10px;border-radius:14px;cursor:pointer}
.moods button.on{color:#ffd23f;border-color:#ffd23f}.say{position:absolute;top:12px;right:12px;color:#03060a;background:#ffd23f;border-color:#ffd23f}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
.tile{border:1px solid #1b2735;background:#060c14;padding:6px;text-align:center;cursor:pointer;transition:.2s}
.tile.on{border-color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent)}
.tile canvas{width:100%;aspect-ratio:1}.tile small{display:block;font:700 8px Orbitron,sans-serif;letter-spacing:.14em;color:var(--c);margin-top:2px}
.note{grid-column:1/-1;color:#8a95a7;font-size:11px;line-height:1.6;padding:4px 2px}
</style></head><body>
<div class="top"><b>AGENT FACES · PREVIEW</b><a href="/command-centre.html">← JARVIS</a></div>
<div class="stage">
  <div class="hero"><canvas id="big" width="840" height="840"></canvas>
    <div class="moods" id="moods"></div><button class="say" id="say">▶ MAKE THEM TALK</button>
    <div class="name" id="name"></div><div class="line" id="line"></div></div>
  <div class="grid" id="grid"><div class="note">Tap a face. Move your mouse: they look at you. Pick a mood, or press “make them talk”.</div></div>
</div>
<script>
const $ = s => document.querySelector(s);
// colour, voice pitch, accessory, a line in character
const A = {
  JARVIS: ["#ffd23f", .9, "monocle", "Good evening, Sir. Shall I pretend I didn't see you skip the gym?"],
  FRIDAY: ["#3dff9a", 1.25, "sparkle", "Boss! You're back! I missed you. Okay, maybe a little."],
  ORACLE: ["#5fd8ff", 1, "thirdeye", "I've run the numbers. You'll want to sit down for this one."],
  ATHENA: ["#7aa2ff", 1.05, "laurel", "Twenty minutes of revision now saves two hours of panic later."],
  ZEUS: ["#ff9f1c", .75, "bolt", "Champion! Today we hunt. Tomorrow we feast!"],
  HERALD: ["#b06bff", .95, "hat", "Darling, the gossip today is absolutely delicious."],
  PEPPER: ["#ffb347", 1.15, "earring", "I sorted the Tan wedding. You're welcome. Now go rest."],
  STEVE: ["#ff6b35", .85, "band", "Soldier! Hydrate. Stretch. Then we talk."],
  VERONICA: ["#ff3d7f", 1.1, "lashes", "That third bubble tea this week? I saw it. I always see it."],
  BANNER: ["#2ee5b5", .8, "glasses", "Hey. Breathe with me for a second. You're doing fine."],
  EDITH: ["#c9d3df", 1.05, "visor", "Files sorted, screenshots filed. Efficiency is my love language."],
  SENTINEL: ["#ff4d5e", .7, "helm", "Three deadlines. Two days. Zero excuses."],
};
const MOODS = {happy: {smile: 1, brow: .2, eye: 1}, neutral: {smile: .2, brow: 0, eye: 1}, smug: {smile: .6, brow: -.4, eye: .6, tilt: .3},
  annoyed: {smile: -.6, brow: -1, eye: .7}, sad: {smile: -.8, brow: .9, eye: .8}, excited: {smile: 1.2, brow: .8, eye: 1.25}, sleepy: {smile: .1, brow: .3, eye: .25}};
let cur = "JARVIS", mood = "happy", mouseX = 0, mouseY = 0, talk = 0, talking = false;
const faces = {};
function face(cv, name, big){
  const g = cv.getContext("2d"), [col, , acc] = A[name], W = cv.width, R = W * .32;
  const st = {blink: 0, nextBlink: performance.now() + 1500 + Math.random() * 3000, lx: 0, ly: 0, m: {...MOODS.neutral}, amp: 0};
  function draw(t){
    const tm = MOODS[big ? mood : (name === cur ? mood : "neutral")];
    for(const k of ["smile", "brow", "eye"]) st.m[k] += ((tm[k] ?? 0) - st.m[k]) * .12;
    st.m.tilt = (st.m.tilt || 0) + (((tm.tilt) || 0) - (st.m.tilt || 0)) * .1;
    if(t > st.nextBlink){ st.blink = 1; st.nextBlink = t + 2200 + Math.random() * 3500; }
    st.blink = Math.max(0, st.blink - .12);
    const r = cv.getBoundingClientRect(), dx = (mouseX - (r.left + r.width / 2)) / innerWidth, dy = (mouseY - (r.top + r.height / 2)) / innerHeight;
    st.lx += (Math.max(-1, Math.min(1, dx * 2.5)) - st.lx) * .15; st.ly += (Math.max(-1, Math.min(1, dy * 2.5)) - st.ly) * .15;
    const speaking = (big || name === cur) && talking;
    st.amp += ((speaking ? talk : 0) - st.amp) * .35;
    g.clearRect(0, 0, W, W); g.save(); g.translate(W / 2 + st.lx * W * .02, W / 2 + st.ly * W * .015 + Math.sin(t / 900) * W * .006);
    g.rotate(st.m.tilt * .08 + st.lx * .04);
    g.lineCap = "round"; g.lineJoin = "round"; g.shadowColor = col; g.shadowBlur = W * .04; g.strokeStyle = col;
    // head: a holographic outline with scan lines
    g.lineWidth = W * .012; g.beginPath(); g.ellipse(0, 0, R * .86, R, 0, 0, Math.PI * 2); g.stroke();
    g.save(); g.clip(); g.globalAlpha = .08; g.fillStyle = col; g.fillRect(-R, -R, 2 * R, 2 * R);
    g.globalAlpha = .12; for(let y = -R; y < R; y += W * .018){ g.fillRect(-R, y + (t / 40) % (W * .018), 2 * R, W * .003); } g.restore();
    g.globalAlpha = .35; g.lineWidth = W * .004; g.beginPath(); g.ellipse(0, 0, R * .98, R * 1.12, 0, 0, Math.PI * 2); g.stroke(); g.globalAlpha = 1;
    // eyes
    const ex = R * .34, ey = -R * .12, open = Math.max(.08, st.m.eye * (1 - st.blink)), px = st.lx * R * .07, py = st.ly * R * .05;
    for(const s of [-1, 1]){
      g.lineWidth = W * .01; g.beginPath(); g.ellipse(s * ex, ey, R * .17, R * .12 * open, 0, 0, Math.PI * 2); g.stroke();
      if(open > .2){ g.fillStyle = "#fff"; g.beginPath(); g.arc(s * ex + px, ey + py, R * .055 * Math.min(1, open * 1.2), 0, Math.PI * 2); g.fill(); g.fillStyle = col; }
      // brows
      g.lineWidth = W * .012; g.beginPath(); const by = ey - R * .25 - st.m.brow * R * .06;
      g.moveTo(s * (ex - R * .17), by + s * st.m.brow * -R * 0 + (st.m.brow < 0 ? -st.m.brow * R * .05 * (s > 0 ? 1 : 1) : 0));
      g.lineTo(s * (ex + R * .17), by - (st.m.brow < 0 ? st.m.brow * -R * .06 : st.m.brow * R * .05)); g.stroke();
    }
    // mouth: a curve for the mood, opening with the voice
    const mw = R * .32, my = R * .42, sm = st.m.smile * R * .14, open2 = st.amp * R * .22;
    g.lineWidth = W * .012; g.beginPath(); g.moveTo(-mw, my - sm * .3); g.quadraticCurveTo(0, my + sm, mw, my - sm * .3);
    if(open2 > 1){ g.quadraticCurveTo(0, my + sm + open2 * 2, -mw, my - sm * .3); g.globalAlpha = .25; g.fillStyle = col; g.fill(); g.globalAlpha = 1; }
    g.stroke();
    // personality accessories
    g.lineWidth = W * .008;
    if(acc === "monocle"){ g.beginPath(); g.arc(ex, ey, R * .24, 0, Math.PI * 2); g.stroke(); g.beginPath(); g.moveTo(ex + R * .2, ey + R * .14); g.lineTo(ex + R * .32, ey + R * .6); g.stroke(); }
    if(acc === "sparkle"){ for(const [x, y, k] of [[-R * .9, -R * .7, 1], [R * .95, -R * .45, .7], [R * .8, R * .75, .5]]){ const sz = R * .1 * k * (1 + Math.sin(t / 200 + x) * .3);
      g.beginPath(); g.moveTo(x, y - sz); g.lineTo(x + sz * .3, y); g.lineTo(x, y + sz); g.lineTo(x - sz * .3, y); g.closePath(); g.stroke(); } }
    if(acc === "thirdeye"){ g.beginPath(); g.arc(0, -R * .52, R * .06 + Math.sin(t / 300) * R * .01, 0, Math.PI * 2); g.stroke(); }
    if(acc === "laurel"){ for(const s of [-1, 1]) for(let i = 0; i < 5; i++){ const a = -Math.PI / 2 + s * (.5 + i * .17); g.beginPath();
      g.ellipse(Math.cos(a) * R * .95, Math.sin(a) * R * 1.05, R * .09, R * .035, a + s * .6, 0, Math.PI * 2); g.stroke(); } }
    if(acc === "bolt"){ for(const s of [-1, 1]){ g.beginPath(); g.moveTo(s * R * .2, -R * .95); g.lineTo(s * R * .32, -R * .7); g.lineTo(s * R * .24, -R * .68); g.lineTo(s * R * .36, -R * .45); g.stroke(); } }
    if(acc === "hat"){ g.beginPath(); g.moveTo(-R * .7, -R * .86); g.lineTo(R * .7, -R * .86); g.moveTo(-R * .42, -R * .86); g.lineTo(-R * .42, -R * 1.3); g.lineTo(R * .42, -R * 1.3); g.lineTo(R * .42, -R * .86); g.stroke(); }
    if(acc === "earring"){ for(const s of [-1, 1]){ g.beginPath(); g.arc(s * R * .9, R * .18 + Math.sin(t / 400 + s) * R * .02, R * .05, 0, Math.PI * 2); g.stroke(); } }
    if(acc === "band"){ g.beginPath(); g.ellipse(0, -R * .55, R * .78, R * .12, 0, Math.PI, Math.PI * 2); g.stroke(); g.beginPath(); g.moveTo(R * .7, -R * .58); g.lineTo(R * 1.02, -R * .4 + Math.sin(t / 250) * R * .05); g.stroke(); }
    if(acc === "lashes"){ for(const s of [-1, 1]) for(let i = 0; i < 3; i++){ g.beginPath(); const x0 = s * (ex + R * (.08 + i * .05)); g.moveTo(x0, ey - R * .1 * open); g.lineTo(x0 + s * R * .05, ey - R * .19 * open); g.stroke(); } }
    if(acc === "glasses"){ for(const s of [-1, 1]){ g.strokeRect(s * ex - R * .22, ey - R * .16, R * .44, R * .32); } g.beginPath(); g.moveTo(-ex + R * .22, ey); g.lineTo(ex - R * .22, ey); g.stroke(); }
    if(acc === "visor"){ g.globalAlpha = .5; g.beginPath(); g.moveTo(-R * .8, ey - R * .2); g.lineTo(R * .8, ey - R * .2); g.lineTo(R * .72, ey + R * .18); g.lineTo(-R * .72, ey + R * .18); g.closePath(); g.stroke(); g.globalAlpha = 1; }
    if(acc === "helm"){ g.beginPath(); g.moveTo(-R * .86, -R * .1); g.lineTo(-R * .86, -R * .6); g.quadraticCurveTo(0, -R * 1.35, R * .86, -R * .6); g.lineTo(R * .86, -R * .1); g.stroke();
      g.beginPath(); g.moveTo(0, -R * 1.02); g.lineTo(0, -R * .7); g.stroke(); }
    g.restore();
  }
  return {draw};
}
function pick(name){
  cur = name; const [col] = A[name];
  $("#name").textContent = name; $("#name").style.color = col; $("#name").style.textShadow = `0 0 18px ${col}`;
  $("#line").textContent = ""; document.querySelectorAll(".tile").forEach(t => t.classList.toggle("on", t.dataset.a === name));
  faces.big = face($("#big"), name, true);
}
function speak(){
  const [, pitch, , line] = A[cur]; $("#line").textContent = "“" + line + "”";
  talking = true; const end = () => { talking = false; talk = 0; };
  const words = line.split(" ").length, t0 = performance.now();
  const wob = () => { if(!talking) return; const e = (performance.now() - t0) / 1000; talk = .35 + .65 * Math.abs(Math.sin(e * 11) * Math.sin(e * 3.7)); requestAnimationFrame(wob); };
  wob();
  if("speechSynthesis" in window){ const u = new SpeechSynthesisUtterance(line.replace(/[“”]/g, "")); u.pitch = pitch; u.rate = 1.02;
    u.onend = end; u.onerror = () => setTimeout(end, words * 330); speechSynthesis.cancel(); speechSynthesis.speak(u); setTimeout(() => talking && end(), words * 600 + 3000); }
  else setTimeout(end, words * 330);
}
Object.keys(A).forEach(n => {
  $("#grid").insertAdjacentHTML("beforeend", `<div class="tile" data-a="${n}" style="--c:${A[n][0]}"><canvas width="220" height="220"></canvas><small>${n}</small></div>`);
  const el = $("#grid").lastElementChild; faces[n] = face(el.querySelector("canvas"), n, false);
  el.onclick = () => { pick(n); speak(); };
});
Object.keys(MOODS).forEach(m => { $("#moods").insertAdjacentHTML("beforeend", `<button data-m="${m}" class="${m === mood ? "on" : ""}">${m.toUpperCase()}</button>`); });
$("#moods").onclick = e => { const b = e.target.closest("[data-m]"); if(!b) return; mood = b.dataset.m; document.querySelectorAll("#moods button").forEach(x => x.classList.toggle("on", x === b)); };
$("#say").onclick = speak;
addEventListener("pointermove", e => { mouseX = e.clientX; mouseY = e.clientY; });
mouseX = innerWidth / 2; mouseY = innerHeight / 2;
pick("JARVIS");
(function loop(t){ faces.big.draw(t); Object.keys(A).forEach(n => faces[n].draw(t)); requestAnimationFrame(loop); })(0);
</script>
</body></html>
