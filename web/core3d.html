<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS Core 3D</title>
<meta name="theme-color" content="#02040a">
<script src="vendor/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Preview of upgrade #18: the JARVIS core as a living 3D hologram of particles that reacts to his voice. */
:root{--c:#ffd23f;--bg:#02040a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#dce7f2;font-family:"JetBrains Mono",monospace;overflow:hidden;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 40%,rgba(0,0,0,.75) 100%),repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px)}
.top{position:fixed;top:0;left:0;right:0;padding:max(14px,env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;align-items:center}
.top b{font:900 13px Orbitron,sans-serif;letter-spacing:.34em;color:var(--c);text-shadow:0 0 14px var(--c);transition:color .6s,text-shadow .6s}
.top span{font:600 9px Orbitron,sans-serif;letter-spacing:.24em;color:#6d7a8c}
#state{position:fixed;left:0;right:0;top:calc(50% + min(36vw,210px));text-align:center;font:700 11px Orbitron,sans-serif;letter-spacing:.42em;color:var(--c);text-shadow:0 0 12px var(--c);transition:color .6s}
#line{position:fixed;left:50%;transform:translateX(-50%);top:calc(50% + min(36vw,210px) + 26px);width:min(560px,90vw);text-align:center;font:600 14px/1.5 "JetBrains Mono",monospace;color:#fff;min-height:42px;text-shadow:0 2px 10px #000}
.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 14px max(14px,env(safe-area-inset-bottom));display:grid;gap:8px;background:linear-gradient(transparent,rgba(2,4,10,.92) 35%)}
.row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dock button{background:rgba(10,16,24,.8);border:1px solid #1b2735;color:#dce7f2;font:700 9px Orbitron,sans-serif;letter-spacing:.16em;padding:10px 12px;border-radius:999px;cursor:pointer;transition:.25s}
.dock button.on{border-color:var(--c);color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 40%,transparent)}
.dock .ag button{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid transparent}
.dock .ag button.on{border-color:#fff;box-shadow:0 0 14px var(--cc)}
#demo{background:var(--c)!important;color:#02040a!important;border-color:var(--c)!important}
</style></head><body>
<canvas id="gl"></canvas><div id="vig"></div>
<div class="top"><b id="who">JARVIS</b><span>CORE · PREVIEW</span></div>
<div id="state">ONLINE</div><div id="line"></div>
<div class="dock">
  <div class="row" id="states"><button data-s="idle" class="on">IDLE</button><button data-s="listen">LISTENING</button><button data-s="think">THINKING</button><button data-s="speak">SPEAKING</button><button id="mic">🎙 MY VOICE</button></div>
  <div class="row ag" id="agents"></div>
  <div class="row"><button id="demo">▶ PLAY DEMO</button></div>
</div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const AG = {JARVIS: "#ffd23f", FRIDAY: "#ff5fa2", ZEUS: "#ff7a3c", ATHENA: "#b06bff", ORACLE: "#5fd8ff", STEVE: "#3dff9a", VERONICA: "#ff4d5e"};
const STATE = {idle: ["ONLINE", "#5fd8ff"], listen: ["LISTENING", "#5fd8ff"], think: ["THINKING", "#b06bff"], speak: ["SPEAKING", null]};

// ---------------------------------------------------------------- renderer
const R = new THREE.WebGLRenderer({canvas: $("#gl"), antialias: true});
R.setPixelRatio(Math.min(2, devicePixelRatio || 1)); R.setClearColor(0x02040a);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(45, 1, .1, 200);
function resize(){ R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();

// ---------------------------------------------------------------- the particle core (GPU: thousands of points, a few lines of maths each)
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;} vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);} vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-.85373472095314*r;}
float snoise(vec3 v){const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0.,.5,1.,2.);vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);
vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;
i=mod289(i);vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;vec4 j=p-49.*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);
vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.-abs(x)-abs(y);vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;vec4 sh=-step(h,vec4(0.));vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);m=m*m;return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));}`;
const U = {t: {value: 0}, amp: {value: 0}, low: {value: 0}, high: {value: 0}, swirl: {value: 0}, pull: {value: 0}, col: {value: new THREE.Color("#ffd23f")}, col2: {value: new THREE.Color("#5fd8ff")}, px: {value: 1}};
function shell(n, radius, size, layer){
  const pos = new Float32Array(n * 3), rnd = new Float32Array(n), ga = Math.PI * (3 - Math.sqrt(5));
  for(let i = 0; i < n; i++){ const y = 1 - (i / (n - 1)) * 2, r = Math.sqrt(1 - y * y), th = ga * i; pos.set([Math.cos(th) * r, y, Math.sin(th) * r], i * 3); rnd[i] = Math.random(); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3)); g.setAttribute("rnd", new THREE.BufferAttribute(rnd, 1));
  const m = new THREE.ShaderMaterial({uniforms: {...U, R: {value: radius}, S: {value: size}, L: {value: layer}}, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: NOISE + `
      uniform float t, amp, low, high, swirl, pull, R, S, L, px; attribute float rnd; varying float vA; varying float vH;
      void main(){
        vec3 p = position; float a = swirl * (1.2 + L) * t * .6 + swirl * p.y * 2.;
        p.xz = mat2(cos(a), -sin(a), sin(a), cos(a)) * p.xz;
        float n = snoise(p * (1.6 + L * .8) + vec3(0., t * (.25 + amp * .9), t * .1));
        float n2 = snoise(p * 4.5 + t * (.6 + high * 2.));
        float r = R * (1. + n * (.06 + amp * .32 + low * .22) + n2 * high * .1 - pull * .18 * (.5 + .5 * sin(t * 6. - length(p.xy) * 8.)));
        r += L * amp * rnd * .9;                       // outer layer: sparks thrown off when he speaks
        vec4 mv = modelViewMatrix * vec4(p * r, 1.);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = S * px * (1. + amp * 1.2 + rnd * .6) * (10. / -mv.z);
        vA = .35 + .65 * smoothstep(-.3, .8, n) ; vH = rnd;
      }`,
    fragmentShader: `
      uniform vec3 col, col2; uniform float L, amp; varying float vA; varying float vH;
      void main(){ vec2 d = gl_PointCoord - .5; float f = smoothstep(.5, 0., length(d)); f *= f;
        vec3 c = mix(col2, col, clamp(vA + amp * .5 - L * .35, 0., 1.)); c = mix(c, vec3(1.), pow(f, 6.) * .6);
        gl_FragColor = vec4(c, f * vA * (L > .5 ? .35 + amp * .5 : .9)); }`});
  const pts = new THREE.Points(g, m); scene.add(pts); return pts;
}
const core = shell(14000, 2.2, 2.2, 0), halo = shell(5000, 2.9, 1.6, 1);
// bright heart
const heartTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 128; const g = c.getContext("2d"), gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.25, "rgba(255,255,255,.55)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
const heart = new THREE.Sprite(new THREE.SpriteMaterial({map: heartTex, color: 0xffd23f, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false})); heart.scale.set(3.2, 3.2, 1); scene.add(heart);
// orbit rings with tick marks, like the reactor
const rings = [];
[[3.6, .012, [1.1, .3, 0], 1.4, .9], [4.1, .006, [-.5, .8, .2], -.9, .55], [4.6, .02, [.2, -.4, .9], .55, .8]].forEach(([r, w, rot, sp, op], k) => {
  const grp = new THREE.Group(); grp.rotation.set(...rot);
  const arc = new THREE.Mesh(new THREE.TorusGeometry(r, w * 3, 6, 200, Math.PI * (1.1 + k * .25)), new THREE.MeshBasicMaterial({color: 0xffd23f, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false}));
  grp.add(arc);
  const ticks = new THREE.Group(); for(let i = 0; i < 48; i++){ const a = i / 48 * Math.PI * 2, tl = i % 4 ? .08 : .22;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(.03, tl), new THREE.MeshBasicMaterial({color: 0x5fd8ff, transparent: true, opacity: .55, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false}));
    m.position.set(Math.cos(a) * (r + .25), Math.sin(a) * (r + .25), 0); m.rotation.z = a + Math.PI / 2; ticks.add(m); }
  grp.add(ticks); scene.add(grp); rings.push({grp, arc, ticks, sp});
});
// starfield
{ const n = 2500, p = new Float32Array(n * 3); for(let i = 0; i < n; i++){ const r = 30 + Math.random() * 80, a = Math.random() * 6.28, b = Math.acos(2 * Math.random() - 1); p.set([r * Math.sin(b) * Math.cos(a), r * Math.cos(b), r * Math.sin(b) * Math.sin(a)], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({color: 0x6fa8d8, size: .35, map: heartTex, transparent: true, opacity: .7, blending: THREE.AdditiveBlending, depthWrite: false}))); }

// ---------------------------------------------------------------- state, colour, voice
let state = "idle", agent = "JARVIS", target = new THREE.Color(AG.JARVIS), target2 = new THREE.Color("#5fd8ff"), amp = 0, ampT = 0, low = 0, high = 0, swirl = 0, pull = 0;
let speechEnv = null, analyser = null, buf = null;
function setState(s){
  state = s; document.querySelectorAll("#states [data-s]").forEach(b => b.classList.toggle("on", b.dataset.s === s));
  const [label, c] = STATE[s]; $("#state").textContent = s === "speak" ? `${agent} SPEAKING` : label;
  target2.set(s === "think" ? "#b06bff" : "#5fd8ff");
  const main = s === "listen" ? "#5fd8ff" : s === "think" ? "#b06bff" : AG[agent];
  target.set(main); document.documentElement.style.setProperty("--c", main);
}
function setAgent(a){ agent = a; $("#who").textContent = a; document.querySelectorAll("#agents button").forEach(b => b.classList.toggle("on", b.dataset.a === a)); setState(state); }
Object.entries(AG).forEach(([a, c]) => $("#agents").insertAdjacentHTML("beforeend", `<button data-a="${a}" title="${a}" style="background:${c};--cc:${c}"></button>`));
$("#agents").onclick = e => { const b = e.target.closest("[data-a]"); if(b){ stopDemo(); setAgent(b.dataset.a); } };
$("#states").onclick = e => { const b = e.target.closest("[data-s]"); if(!b) return; stopDemo(); setState(b.dataset.s); if(b.dataset.s === "speak") say(LINES[agent] || LINES.JARVIS); };

// a voice envelope: syllables, words and breaths, so the core moves like speech
function envelope(text){ const words = text.split(/\s+/), out = []; let t = 0;
  words.forEach((w, i) => { const syl = Math.max(1, Math.round(w.replace(/[^aeiouy]/gi, "").length * .8));
    for(let s = 0; s < syl; s++){ out.push([t, .55 + Math.random() * .45]); t += .11 + Math.random() * .07; out.push([t, .15]); t += .03; }
    t += /[,.!?]$/.test(w) ? .28 : .06; out.push([t, .05]); });
  return {pts: out, len: t, t0: performance.now() / 1000}; }
const LINES = {JARVIS: "Good evening, Sir. All systems are online, and might I say, you look unusually productive today.",
  FRIDAY: "Hey boss! Your three o'clock is wide open. Shall I fill it, or are we pretending to study?", ZEUS: "Champions don't rest on Sundays. Gym at seven. No excuses!",
  ATHENA: "Week six on hedging is your weakest topic. Ten minutes now saves an hour later.", ORACLE: "Rain from four. Leave at three forty and you'll stay dry.",
  STEVE: "Legs today, soldier. The stairs at Tampines won't climb themselves.", VERONICA: "Oh, a fourth coffee. Bold strategy. Let's see if it pays off."};
let voiceOn = true;
function say(text){
  $("#line").textContent = text; speechEnv = envelope(text); setState("speak");
  try { if(voiceOn && window.speechSynthesis){ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "en-GB"; u.rate = 1.02; u.pitch = agent === "FRIDAY" ? 1.25 : agent === "ZEUS" ? .8 : .92; speechSynthesis.speak(u); } } catch {}
}
function envAt(){ if(!speechEnv) return 0; const t = performance.now() / 1000 - speechEnv.t0, p = speechEnv.pts;
  if(t > speechEnv.len){ speechEnv = null; if(state === "speak" && !demo) setState("idle"); return 0; }
  for(let i = 1; i < p.length; i++) if(p[i][0] >= t){ const [t0, a0] = p[i - 1], [t1, a1] = p[i]; return a0 + (a1 - a0) * (t - t0) / Math.max(.001, t1 - t0); } return 0; }
$("#mic").onclick = async () => {
  if(analyser){ analyser = null; $("#mic").classList.remove("on"); setState("idle"); return; }
  try { const s = await navigator.mediaDevices.getUserMedia({audio: true}), ac = new AudioContext(), src = ac.createMediaStreamSource(s);
    analyser = ac.createAnalyser(); analyser.fftSize = 512; buf = new Uint8Array(analyser.frequencyBinCount); src.connect(analyser);
    stopDemo(); $("#mic").classList.add("on"); setState("listen"); $("#line").textContent = "Talk, Sir. The core follows your voice."; }
  catch { $("#line").textContent = "Microphone not allowed here."; }
};

// ---------------------------------------------------------------- demo reel
let demo = null;
const wait = ms => new Promise(r => { demo && (demo.timer = setTimeout(r, ms)); });
function stopDemo(){ if(demo){ clearTimeout(demo.timer); demo = null; $("#demo").textContent = "▶ PLAY DEMO"; } }
async function runDemo(){
  demo = {}; $("#demo").textContent = "■ STOP";
  const steps = [["idle", "JARVIS", "Idle: the core breathes.", 3500], ["listen", "JARVIS", "Listening: it ripples inward, waiting for you.", 3500],
    ["think", "JARVIS", "Thinking: a purple vortex while he works it out.", 3500], ["speak", "JARVIS", null, 0], ["speak", "FRIDAY", null, 0], ["speak", "ZEUS", null, 0], ["idle", "JARVIS", "Every agent has their own colour.", 3000]];
  for(const [s, a, line, ms] of steps){ if(!demo) return; setAgent(a);
    if(s === "speak"){ say(LINES[a]); await wait(speechEnv.len * 1000 + 700); }
    else { setState(s); $("#line").textContent = line; await wait(ms); } }
  stopDemo();
}
$("#demo").onclick = () => demo ? stopDemo() : runDemo();

// ---------------------------------------------------------------- spin, pinch, tilt
let yaw = 0, pitch = .15, dist = 13.5, drag = null, pinch = 0, tiltX = 0, tiltY = 0;
$("#gl").addEventListener("pointerdown", e => drag = {x: e.clientX, y: e.clientY});
addEventListener("pointermove", e => { if(!drag) return; yaw += (e.clientX - drag.x) * .006; pitch = Math.max(-1, Math.min(1, pitch + (e.clientY - drag.y) * .005)); drag = {x: e.clientX, y: e.clientY}; });
addEventListener("pointerup", () => drag = null);
$("#gl").addEventListener("wheel", e => { e.preventDefault(); dist = Math.max(7, Math.min(24, dist * (1 + Math.sign(e.deltaY) * .07))); }, {passive: false});
$("#gl").addEventListener("touchmove", e => { if(e.touches.length !== 2) return; const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  if(pinch) dist = Math.max(7, Math.min(24, dist * pinch / d)); pinch = d; }, {passive: true});
$("#gl").addEventListener("touchend", () => pinch = 0);
addEventListener("deviceorientation", e => { if(e.gamma == null) return; tiltX = Math.max(-1, Math.min(1, e.gamma / 35)); tiltY = Math.max(-1, Math.min(1, (e.beta - 45) / 35)); });   // tilt the phone to look around

// ---------------------------------------------------------------- frame loop
let last = performance.now();
function frame(now){
  const dt = Math.max(0, Math.min(.05, (now - last) / 1000)); last = now; const t = now / 1000;
  let a = 0, lo = 0, hi = 0;
  if(analyser){ analyser.getByteFrequencyData(buf); let s = 0, l = 0, h = 0; for(let i = 0; i < buf.length; i++){ s += buf[i]; if(i < 24) l += buf[i]; else if(i > 60) h += buf[i]; }
    a = Math.min(1, s / buf.length / 70); lo = Math.min(1, l / 24 / 150); hi = Math.min(1, h / (buf.length - 60) / 50); }
  else if(state === "speak"){ a = envAt(); lo = a * (.6 + .4 * Math.sin(t * 17)); hi = a * (.5 + .5 * Math.sin(t * 31 + 1)); }
  const want = state === "idle" ? .05 + .03 * Math.sin(t * 1.6) : state === "listen" ? .12 : state === "think" ? .18 : 0;
  ampT = Math.max(a, want); amp += (ampT - amp) * Math.min(1, dt * 14); low += (lo - low) * Math.min(1, dt * 10); high += (hi - high) * Math.min(1, dt * 12);
  swirl += ((state === "think" ? 1 : .08) - swirl) * dt * 2; pull += ((state === "listen" || analyser ? 1 : 0) - pull) * dt * 3;
  U.t.value = t; U.amp.value = amp; U.low.value = low; U.high.value = high; U.swirl.value = swirl; U.pull.value = pull; U.px.value = R.getPixelRatio();
  U.col.value.lerp(target, Math.min(1, dt * 3)); U.col2.value.lerp(target2, Math.min(1, dt * 3));
  [core, halo].forEach(o => { o.material.uniforms.col.value.copy(U.col.value); o.material.uniforms.col2.value.copy(U.col2.value); });
  core.rotation.y += dt * (.15 + swirl * .6); halo.rotation.y -= dt * (.08 + swirl * .3);
  heart.material.color.copy(U.col.value); heart.scale.setScalar(2.6 + amp * 3.2 + Math.sin(t * 2) * .15);
  rings.forEach((r, i) => { r.arc.rotation.z += dt * r.sp * (1 + amp * 3 + swirl * 2); r.ticks.rotation.z -= dt * r.sp * .3; r.arc.material.color.copy(U.col.value); });
  if(!drag) yaw += dt * .06;
  const fit = dist * Math.max(1, .8 / cam.aspect), y = pitch + tiltY * .5, x = yaw + tiltX * .7;
  cam.position.set(fit * Math.cos(y) * Math.sin(x), fit * Math.sin(y), fit * Math.cos(y) * Math.cos(x)); cam.lookAt(0, 0, 0);
  R.render(scene, cam); requestAnimationFrame(frame);
}
setAgent("JARVIS"); setState("idle"); requestAnimationFrame(frame);
if(new URLSearchParams(location.search).get("demo") === "1") setTimeout(runDemo, 600);
</script>
</body></html>
