<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holo Hands</title>
<meta name="theme-color" content="#02040a">
<script src="vendor/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Holo Hands (#44, #46, #47): control JARVIS with your hands in the air, through the laptop webcam or the phone's
   front camera. Neon ring menus float beside you; point and pinch to choose. Pinch the hologram to grab and spin it,
   pinch with both hands to resize, swipe to switch, flick it up to throw it to your other screen.
   Hand tracking runs in the browser (MediaPipe): the camera picture never leaves your device. */
:root{--c:#5fd8ff;--g:#ffd23f}
html,body{margin:0;height:100%;background:#02040a;overflow:hidden;color:#dce7f2;font-family:"JetBrains Mono",monospace;touch-action:none;-webkit-tap-highlight-color:transparent}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:saturate(.7) brightness(.55) contrast(1.1)}
#gl,#hud{position:fixed;inset:0;width:100%;height:100%;display:block}
#grid{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(95,216,255,.05) 0 1px,transparent 1px 4px),radial-gradient(circle at 50% 50%,transparent 40%,rgba(0,0,0,.7) 100%)}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:max(12px,env(safe-area-inset-top)) 14px 0;z-index:3}
.top b{font:900 12px Orbitron,sans-serif;letter-spacing:.34em;color:var(--c);text-shadow:0 0 12px var(--c)}
.top a,.top button{font:700 10px Orbitron,sans-serif;letter-spacing:.18em;color:var(--c);border:1px solid var(--c);background:rgba(2,8,14,.6);padding:8px 12px;border-radius:999px;text-decoration:none;cursor:pointer}
#tip{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));text-align:center;font:600 11px "JetBrains Mono",monospace;color:#9fb0c3;z-index:3;padding:0 14px;text-shadow:0 1px 6px #000}
#status{position:fixed;left:0;right:0;top:46%;text-align:center;font:700 11px Orbitron,sans-serif;letter-spacing:.3em;color:var(--c);z-index:3}
</style></head><body>
<video playsinline muted autoplay></video>
<canvas id="gl"></canvas><div id="grid"></div><canvas id="hud"></canvas>
<div class="top"><b>HOLO HANDS</b><div><button id="camBtn">📷 CAMERA</button> <a href="javascript:history.length>1?history.back():location.href='home.html'">✕</a></div></div>
<div id="status">WAKING THE CAMERA…</div>
<div id="tip">✋ spread = bigger · squeeze = smaller · ✊ grab to carry, let go fast to toss · 🔄 twist to spin · 👋 swipe across = spin · ✌ next · 👍 reset · 🤏 pinch to choose · flick up = throw</div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
const PHONE = /Android|iPhone|iPad/i.test(navigator.userAgent) || !!window.JarvisNative;
const VER = "0.10.14";

// ---------------------------------------------------------------- the hologram (three.js)
const R = new THREE.WebGLRenderer({canvas: $("#gl"), antialias: !PHONE, alpha: true, powerPreference: "high-performance"}); R.setClearColor(0, 0);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(45, 1, .1, 100); cam.position.set(0, 0, 13);
let W = 0, H = 0, DPR = 1;
const HUD = $("#hud"), X = HUD.getContext("2d");
function resize(){ DPR = Math.min(PHONE ? 1.5 : 2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; R.setPixelRatio(DPR); R.setSize(W, H, false);
  cam.aspect = W / H; cam.position.z = H > W ? 21 : 13; /* a tall phone screen: step back so the menus stay clear */ cam.updateProjectionMatrix(); HUD.width = W * DPR; HUD.height = H * DPR; X.setTransform(DPR, 0, 0, DPR, 0, 0); layout(); }
const holder = new THREE.Group(); scene.add(holder);
const dot = (() => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d"), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.3, "rgba(255,255,255,.5)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const add = (c, op = .9) => ({color: new THREE.Color(c), transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false});
// real-looking metal: lit, polished (the glow effects stay additive on top)
const solid = (c, shine = 80) => new THREE.MeshPhongMaterial({color: new THREE.Color(c).multiplyScalar(.55), specular: 0x8d949b, shininess: shine,
  emissive: new THREE.Color(c).multiplyScalar(.05)});
function rig(g, rimC = 0x5fd8ff){ g.add(new THREE.AmbientLight(0x2a3038, .55)); const k = new THREE.DirectionalLight(0xffffff, .85); k.position.set(3, 5, 6); g.add(k);
  const f = new THREE.DirectionalLight(0x8fa3b8, .3); f.position.set(-4, 1, 3); g.add(f); const r = new THREE.PointLight(rimC, 1.4, 14); r.position.set(-1.5, 3, -4); g.add(r); }
const MODELS = {

  // ---- original hero tech (my own designs, in the spirit of the films)

  reactor(){   // the arc reactor: a ring of spinning coils around a blazing heart
    const g = new THREE.Group(), CY = "#5fd8ff", W1 = "#e8fbff", CU = "#ffb347";
    const ring = (r, t, c, op = .9, seg = 96) => { const m = new THREE.Mesh(new THREE.TorusGeometry(r, t, 8, seg), new THREE.MeshBasicMaterial(add(c, op))); g.add(m); return m; };
    ring(2.35, .09, CY); ring(2.05, .03, CY, .6); ring(1.15, .07, W1, .95); ring(.82, .03, CY, .7);
    const coils = new THREE.Group(); g.add(coils);
    for (let i = 0; i < 10; i++){ const a = i / 10 * Math.PI * 2, c = new THREE.Group(); c.position.set(Math.cos(a) * 1.6, Math.sin(a) * 1.6, 0); c.rotation.z = a;
      const box = new THREE.BoxGeometry(.62, .3, .34); c.add(new THREE.Mesh(box, new THREE.MeshBasicMaterial(add(CU, .22))));
      c.add(new THREE.LineSegments(new THREE.EdgesGeometry(box), new THREE.LineBasicMaterial(add(CU, .95))));
      for (let k = -2; k <= 2; k++){ const w = new THREE.Mesh(new THREE.TorusGeometry(.17, .018, 4, 16), new THREE.MeshBasicMaterial(add(CU, .9))); w.rotation.y = Math.PI / 2; w.position.x = k * .11; c.add(w); }
      coils.add(c); }
    const tri = new THREE.Shape([[0, .62], [-.54, -.31], [.54, -.31]].map(([x, y]) => new THREE.Vector2(x, y)));
    const triM = new THREE.Mesh(new THREE.ShapeGeometry(tri), new THREE.MeshBasicMaterial(add(W1, .5))); g.add(triM);
    const heart = new THREE.Sprite(new THREE.SpriteMaterial({map: dot, color: new THREE.Color(CY), transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false})); heart.scale.setScalar(3.2); g.add(heart);
    const n = 900, pts = new Float32Array(n * 3), geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(pts, 3));
    g.add(new THREE.Points(geo, new THREE.PointsMaterial({size: .07, map: dot, ...add(CY, .9)})));
    g.userData.tick = t => { coils.rotation.z = t * .35; triM.rotation.z = -t * .6; const pulse = .85 + Math.sin(t * 4) * .15; heart.scale.setScalar(3.2 * pulse); triM.material.opacity = .35 + .25 * pulse;
      for (let i = 0; i < n; i++){ const a = i / n * Math.PI * 2 * 7 + t * (1 + (i % 3) * .4), r = .9 + (i % 9) * .13 + Math.sin(t * 2 + i) * .03; pts[i * 3] = Math.cos(a) * r; pts[i * 3 + 1] = Math.sin(a) * r; pts[i * 3 + 2] = Math.sin(a * 3 + t) * .12; }
      geo.attributes.position.needsUpdate = true; };
    return g; },

  helmet(){   // an armored helmet, sculpted: make a fist and the faceplate snaps shut, open your hand and it lifts
    const g = new THREE.Group(), W1 = "#e8fbff";
    rig(g);
    const RED = new THREE.MeshPhongMaterial({color: 0x7a111b, specular: 0x8a5a5a, shininess: 70, emissive: 0x0a0102});
    const GOLD = new THREE.MeshPhongMaterial({color: 0xa07c26, specular: 0xb8a070, shininess: 80, emissive: 0x0a0702});
    const sculpt = (geo, fn) => { const pa = geo.attributes.position, v = new THREE.Vector3(); for (let i = 0; i < pa.count; i++){ v.fromBufferAttribute(pa, i); fn(v); pa.setXYZ(i, v.x, v.y, v.z); } geo.computeVertexNormals(); return geo; };
    const G = (x, s) => Math.exp(-(x / s) * (x / s));
    // the shell: a rounded skull, flat sides, a crest down the middle
    const shell = new THREE.Mesh(sculpt(new THREE.SphereGeometry(1.6, 72, 56), v => { v.x *= .86; v.y *= 1.12; v.z *= 1.02;
      v.x *= 1 - .12 * G(v.y - .1, .9) * Math.abs(v.x) / 1.4; v.y += .07 * G(v.x, .12) * (v.y > 0 ? 1 : 0); if (v.y < -1.2) v.y = -1.2 + (v.y + 1.2) * .3; }), RED);
    g.add(shell);
    [-1, 1].forEach(sx => { const ear = new THREE.Mesh(new THREE.CylinderGeometry(.42, .5, .18, 40), GOLD); ear.rotation.z = Math.PI / 2; ear.position.set(sx * 1.36, -.15, .05); g.add(ear); });
    const jaw = new THREE.Mesh(sculpt(new THREE.SphereGeometry(1, 48, 32, 0, Math.PI * 2, Math.PI * .45, Math.PI * .4), v => { v.x *= 1.15; v.y *= .8; v.z *= 1.05; }), RED);
    jaw.position.set(0, -.75, .2); g.add(jaw);
    // the faceplate: brow, angled eye slits, cheek lines, mouth line; hinged at the top
    const hinge = new THREE.Group(); hinge.position.set(0, 1.25, .85); g.add(hinge);
    const fp = sculpt(new THREE.SphereGeometry(1, 72, 72, Math.PI / 2 - Math.PI * .3, Math.PI * .6, Math.PI * .2, Math.PI * .6), v => {
      const x = v.x, y = v.y; let z = v.z * .55 + .45; z += .07 * G(y - .28, .06) * G(x, .45);                     // brow
      z -= .09 * (G(x - .3, .14) * G(y - .12 + (x - .3) * .25, .045) + G(x + .3, .14) * G(y - .12 - (x + .3) * .25, .045));   // eye slits
      z += .06 * G(x, .05) * G(y + .1, .25); z -= .035 * G(Math.abs(x) - .2, .025) * G(y + .3, .18); z -= .03 * G(y + .45, .02) * G(x, .25);
      v.set(x * 1.18, y * 1.25, z); });
    const face = new THREE.Mesh(fp, GOLD); face.position.set(0, -1.15, -.15); face.scale.setScalar(1.12); hinge.add(face);
    const eyes = [-.36, .36].map(x => { const e = new THREE.Mesh(new THREE.BoxGeometry(.42, .07, .05), new THREE.MeshBasicMaterial(add(W1, 1))); e.position.set(x, .27, 1.035); e.rotation.z = x < 0 ? -.24 : .24; face.add(e); return e; });
    const eg = new THREE.Sprite(new THREE.SpriteMaterial({map: dot, color: new THREE.Color("#5fd8ff"), transparent: true, opacity: .8, blending: THREE.AdditiveBlending, depthWrite: false})); eg.scale.set(2.4, .7, 1); eg.position.set(0, .27, 1.1); face.add(eg);
    let shut = 1;
    g.userData.tick = (t, dt) => {
      const want = HANDCURL ? (Math.max(...HANDCURL.slice(1)) > .6 ? 1 : 0) : (Math.sin(t * .9) > -.3 ? 1 : 0);   // fist = shut, open hand = open
      shut += (want - shut) * Math.min(1, dt * 7); hinge.rotation.x = -(1 - shut) * 1.05;
      const lit = .45 + shut * .55 * (.85 + Math.sin(t * 5) * .15); eyes.forEach(e => e.material.opacity = lit); eg.material.opacity = .8 * shut;
      if (HANDCURL && !grab && !carry){ spinV.y *= Math.pow(.05, dt); holder.rotation.y += angDiff(0, holder.rotation.y % (Math.PI * 2)) * Math.min(1, dt * 4); }
    };
    g.position.y = .2; g.scale.setScalar(1.1); return g; },

  car(){   // a neon hypercar racing over a road grid
    const g = new THREE.Group(), RED = "#ff4d5e", CY = "#5fd8ff", PINK = "#ff3df0";
    const side = new THREE.Shape(); [[-3, -.35], [3.05, -.35], [3.15, .05], [2.7, .3], [1.2, .45], [.45, 1.0], [-.9, 1.05], [-2.0, .55], [-3.05, .45], [-3.1, 0]].forEach(([x, y], i) => i ? side.lineTo(x, y) : side.moveTo(x, y));
    const body = new THREE.ExtrudeGeometry(side, {depth: 1.9, bevelEnabled: true, bevelThickness: .12, bevelSize: .1, bevelSegments: 2}); body.translate(0, 0, -.95);
    rig(g, 0xff3df0);
    g.add(new THREE.Mesh(body, new THREE.MeshPhongMaterial({color: 0x8a0d18, specular: 0x6a4a4a, shininess: 70, emissive: 0x0c0102})));
    g.add(new THREE.LineSegments(new THREE.EdgesGeometry(body, 30), new THREE.LineBasicMaterial(add(RED, .35))));
    const glass = new THREE.Shape(); [[.35, .98], [-.85, 1.02], [-1.85, .58], [1.1, .5]].forEach(([x, y], i) => i ? glass.lineTo(x, y) : glass.moveTo(x, y));
    const gl = new THREE.ExtrudeGeometry(glass, {depth: 1.5, bevelEnabled: false}); gl.translate(0, .02, -.75); g.add(new THREE.Mesh(gl, new THREE.MeshPhongMaterial({color: 0x0a1622, specular: 0xbfe8ff, shininess: 160, transparent: true, opacity: .85})));
    const wheels = [[2.05, 1.0], [2.05, -1.0], [-2.05, 1.0], [-2.05, -1.0]].map(([x, z]) => { const w = new THREE.Group(); w.position.set(x, -.35, z); g.add(w);
      const tyre = new THREE.Mesh(new THREE.TorusGeometry(.4, .15, 16, 40), new THREE.MeshPhongMaterial({color: 0x121418, specular: 0x333333, shininess: 20})); w.add(tyre);
      const rim = new THREE.Mesh(new THREE.CylinderGeometry(.3, .3, .2, 32), new THREE.MeshPhongMaterial({color: 0x8f9aa3, specular: 0xffffff, shininess: 150})); rim.rotation.x = Math.PI / 2; w.add(rim);
      const glowRing = new THREE.Mesh(new THREE.TorusGeometry(.31, .012, 6, 40), new THREE.MeshBasicMaterial(add(CY, .9))); glowRing.position.z = z > 0 ? .11 : -.11; w.add(glowRing);
      for (let k = 0; k < 5; k++){ const sp = new THREE.Mesh(new THREE.BoxGeometry(.04, .5, .04), new THREE.MeshPhongMaterial({color: 0xcfd6dc, shininess: 120})); sp.rotation.z = k / 5 * Math.PI; sp.position.z = z > 0 ? .1 : -.1; w.add(sp); } return w; });
    [-.6, .6].forEach(z => { const h = new THREE.Sprite(new THREE.SpriteMaterial({map: dot, color: new THREE.Color("#e8fbff"), transparent: true, opacity: 1, blending: THREE.AdditiveBlending, depthWrite: false})); h.scale.setScalar(.7); h.position.set(3.1, .1, z); g.add(h);
      const beam = new THREE.Mesh(new THREE.ConeGeometry(.9, 4, 20, 1, true), new THREE.MeshBasicMaterial(add("#bff6ff", .08))); beam.rotation.z = Math.PI / 2; beam.position.set(5.1, .05, z); g.add(beam); });
    const under = new THREE.Mesh(new THREE.PlaneGeometry(5.6, 2.2), new THREE.MeshBasicMaterial(add(PINK, .25))); under.rotation.x = -Math.PI / 2; under.position.y = -.8; g.add(under);
    const road = new THREE.GridHelper(30, 30, new THREE.Color(PINK), new THREE.Color(CY)); road.material.transparent = true; road.material.opacity = .25; road.position.y = -.78; g.add(road);
    g.userData.tick = (t, dt) => { wheels.forEach(w => w.rotation.z -= dt * 14); road.position.x = -((t * 9) % 1); under.material.opacity = .18 + Math.sin(t * 6) * .07; g.position.y = -.2 + Math.sin(t * 9) * .02; };
    g.rotation.y = -.5; g.scale.setScalar(.85); return g; },

  missiles(){   // a micro-missile pod: salvos curve out with trails and burst (open palm held still = fire)
    const g = new THREE.Group(), RED = "#ff4d5e", GOLD = "#ffd23f", CY = "#5fd8ff";
    rig(g); const podG = new THREE.BoxGeometry(2.2, 1.4, 1.6); g.add(new THREE.Mesh(podG, solid(RED, 100))); g.add(new THREE.LineSegments(new THREE.EdgesGeometry(podG), new THREE.LineBasicMaterial(add(RED, .35))));
    const tubes = []; for (let r = 0; r < 2; r++) for (let c = 0; c < 3; c++){ const tb = new THREE.Mesh(new THREE.CylinderGeometry(.2, .2, .24, 28), solid(GOLD, 120)); tb.rotation.x = Math.PI / 2; tb.position.set(-.6 + c * .6, .3 - r * .6, .82); g.add(tb); tubes.push(tb); }
    const mk = () => { const m = new THREE.Group(); m.add(new THREE.Mesh(new THREE.CylinderGeometry(.08, .08, .55, 16), new THREE.MeshPhongMaterial({color: 0xdfe5ea, specular: 0xffffff, shininess: 120})));
      const nose = new THREE.Mesh(new THREE.ConeGeometry(.07, .2, 8), new THREE.MeshBasicMaterial(add(RED, .95))); nose.position.y = .35; m.add(nose); m.visible = false; g.add(m); return m; };
    const shots = tubes.map(tb => ({m: mk(), tb, t: -1, p0: null, p1: null, p2: null}));
    const N = 1400, pts = new Float32Array(N * 3), cols = new Float32Array(N * 3), life = new Float32Array(N), vel = new Float32Array(N * 3); let head = 0;
    const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(pts, 3)); geo.setAttribute("color", new THREE.BufferAttribute(cols, 3));
    g.add(new THREE.Points(geo, new THREE.PointsMaterial({size: .16, map: dot, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false})));
    const puff = (x, y, z, c, v = .2, l = .8) => { const i = head++ % N; pts.set([x, y, z], i * 3); cols.set(c, i * 3); life[i] = l; vel.set([(Math.random() - .5) * v, (Math.random() - .5) * v, (Math.random() - .5) * v], i * 3); };
    const salvo = () => { shots.forEach((s, k) => { s.t = -k * .12; const a = (k - 2.5) * .55; s.p0 = s.tb.position.clone().add(new THREE.Vector3(0, 0, .2));
      s.p1 = new THREE.Vector3(Math.sin(a) * 4, 3 + Math.random() * 2, 3); s.p2 = new THREE.Vector3(Math.sin(a) * 6 + (Math.random() - .5) * 2, -1 + Math.random() * 3, 6 + Math.random() * 2); }); sfx("whoosh"); buzz([10, 20, 10, 20]); };
    let next = .4, armed = 0;
    g.userData.tick = (t, dt) => {
      const openPalm = HANDCURL && Math.max(...HANDCURL.slice(1)) < .25; armed = openPalm && HANDSTILL ? armed + dt : 0;
      if (armed > .5 && shots.every(s => s.t < 0 || s.t > 1)){ armed = -1.5; flash("FIRE!"); salvo(); next = t + 99; }
      if (!HANDCURL && t > next){ salvo(); next = t + 4; }
      shots.forEach(s => { if (s.t < 0 && s.p0 && s.t > -1){ s.t += dt; return; } if (!s.p0 || s.t > 1 || s.t < 0){ s.m.visible = false; return; }
        s.t += dt * .9; const k = Math.min(1, s.t), a = s.p0.clone().multiplyScalar((1 - k) ** 2).add(s.p1.clone().multiplyScalar(2 * k * (1 - k))).add(s.p2.clone().multiplyScalar(k * k));
        const b = s.p0.clone().multiplyScalar((1 - k - .02) ** 2).add(s.p1.clone().multiplyScalar(2 * (k + .02) * (1 - k - .02))).add(s.p2.clone().multiplyScalar((k + .02) ** 2));
        s.m.visible = true; s.m.position.copy(a); s.m.lookAt(b); s.m.rotateX(Math.PI / 2); puff(a.x, a.y, a.z, [1, .6, .25], .05, .5);
        if (s.t >= 1){ s.m.visible = false; for (let i = 0; i < 60; i++) puff(a.x, a.y, a.z, i % 2 ? [1, .82, .25] : [.37, .85, 1], 1.6, 1); } });
      for (let i = 0; i < N; i++){ if (life[i] <= 0) continue; life[i] -= dt; pts[i * 3] += vel[i * 3] * dt * 3; pts[i * 3 + 1] += vel[i * 3 + 1] * dt * 3; pts[i * 3 + 2] += vel[i * 3 + 2] * dt * 3;
        const f = Math.max(0, life[i]); cols[i * 3] *= .985; cols[i * 3 + 1] *= .985; cols[i * 3 + 2] *= .985; if (f <= 0) pts.set([0, -99, 0], i * 3); }
      geo.attributes.position.needsUpdate = true; geo.attributes.color.needsUpdate = true; };
    g.position.y = -.6; return g; },
  gauntlet(){   // an armored gauntlet: its fingers copy yours, an open palm held still fires the repulsor
    const g = new THREE.Group(), RED = "#ff4d5e", GOLD = "#ffd23f", CY = "#5fd8ff";
    const part = (geo, c, op = .16) => { const o = new THREE.Group(); o.add(new THREE.Mesh(geo, solid(c, 90)));
      o.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), new THREE.LineBasicMaterial(add(c, .3)))); return o; };
    rig(g);
    const arm = part(new THREE.CylinderGeometry(.72, .92, 2.4, 32, 1, true), RED); arm.position.y = -2.3; g.add(arm);
    [-1.25, -2.0, -2.9].forEach((y, i) => { const r = new THREE.Mesh(new THREE.TorusGeometry(i ? .86 : .78, .045, 6, 40), new THREE.MeshBasicMaterial(add(GOLD, .9))); r.rotation.x = Math.PI / 2; r.position.y = y; g.add(r); });
    const hand = new THREE.Group(); hand.position.y = -.85; g.add(hand);
    const palm = part(new THREE.BoxGeometry(1.75, 1.55, .55), RED); palm.position.y = .25; hand.add(palm);
    const back = part(new THREE.BoxGeometry(1.5, 1.25, .12), GOLD, .22); back.position.set(0, .3, -.34); hand.add(back);
    const rep = new THREE.Mesh(new THREE.CircleGeometry(.3, 32), new THREE.MeshBasicMaterial(add("#e8fbff", .95))); rep.position.set(0, .2, .29); hand.add(rep);
    const rring = new THREE.Mesh(new THREE.RingGeometry(.34, .42, 32), new THREE.MeshBasicMaterial(add(CY, .9))); rring.position.copy(rep.position); hand.add(rring);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({map: dot, color: new THREE.Color(CY), transparent: true, opacity: .9, blending: THREE.AdditiveBlending, depthWrite: false}));
    glow.scale.setScalar(1.6); glow.position.set(0, .2, .35); hand.add(glow);
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(.22, .5, 8, 20, 1, true), new THREE.MeshBasicMaterial(add("#bff6ff", 0)));

    X.font = `900 ${Math.min(W, H) * .06}px Orbitron, sans-serif`; X.fillText(msg.text, W / 2, H > W ? H * .26 : H * .24); X.shadowBlur = 0; X.globalAlpha = 1; }
}

// ---------------------------------------------------------------- loop
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  readHands(now); interact(now, dt);
  if (!carry && !flying){
    if (toss){ holder.position.x += toss.vx * dt; holder.position.y += toss.vy * dt; toss.vx *= Math.pow(.4, dt); toss.vy *= Math.pow(.4, dt);
      const lim = toWorld(W * .92, H * .1);
      if (Math.abs(holder.position.x) > Math.abs(lim.x)){ holder.position.x = Math.sign(holder.position.x) * Math.abs(lim.x); toss.vx *= -.7; sfx("hover"); buzz(6); }
      if (Math.abs(holder.position.y) > Math.abs(lim.y)){ holder.position.y = Math.sign(holder.position.y) * Math.abs(lim.y); toss.vy *= -.7; sfx("hover"); buzz(6); }
      if (now - toss.t0 > 2600 || Math.hypot(toss.vx, toss.vy) < .25) toss = null; }
    else { const hm = home(); holder.position.x += (hm.x - holder.position.x) * Math.min(1, dt * 3); holder.position.y += (hm.y - holder.position.y) * Math.min(1, dt * 3); } }
  if (flying){ const k = (now - flying) / 700; holder.position.y = (H > W ? .9 : 0) + k * k * 14; holder.scale.multiplyScalar(.97); if (k >= 1){ flying = 0; holder.scale.setScalar(.2); holder.position.y = 0; show(model); } }
  else holder.scale.setScalar(holder.scale.x + (scaleT - holder.scale.x) * Math.min(1, dt * 6));
  if (!grab && !carry){ spinV.y = Math.max(-25, Math.min(25, spinV.y)); holder.rotation.y += spinV.y * dt; holder.rotation.x += spinV.x * dt; spinV.y += (.35 - spinV.y) * dt * .8; spinV.x *= Math.pow(.2, dt); holder.rotation.x *= Math.pow(.6, dt); }
  if (obj?.userData.spin) obj.userData.spin.rotation.y -= dt * 1.4;
  obj?.userData.tick?.(now / 1000, dt);
  R.render(scene, cam); drawHUD(now);
  requestAnimationFrame(frame);
}
addEventListener("resize", resize); resize();
show(model, q.get("caught") ? "drop" : "pop"); if (q.get("caught")){ flash("CAUGHT IT"); }
requestAnimationFrame(frame);
if (!q.get("nocam")) startCam(); else $("#status").textContent = "";
window.__hands = {readPose, state: () => ({scaleT, carry: !!carry, toss: !!toss, model, rotY: holder.rotation.y, posX: holder.position.x})};
</script>
<script src="transitions.js" defer></script>
</body></html>
