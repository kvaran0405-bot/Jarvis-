<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Holo Hands</title>
<meta name="theme-color" content="#02040a">
<script src="vendor/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Holo Hands (#44, #46, #47): control JARVIS with your hands in the air, through the laptop webcam or the phone's
   front camera. Neon ring menus float beside you; point and pinch to choose. Pinch the hologram to grab and spin it,
   pinch with both hands to resize, swipe to switch, flick it up to throw it to your other screen.
   Hand tracking runs in the browser (MediaPipe): the camera picture never leaves your device. */
:root{--c:#5fd8ff;--g:#ffd23f}
html,body{margin:0;height:100%;background:#02040a;overflow:hidden;color:#dce7f2;font-family:"JetBrains Mono",monospace;touch-action:none;-webkit-tap-highlight-color:transparent}
video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:saturate(.7) brightness(.55) contrast(1.1)}
#gl,#hud{position:fixed;inset:0;width:100%;height:100%;display:block}
#grid{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(95,216,255,.05) 0 1px,transparent 1px 4px),radial-gradient(circle at 50% 50%,transparent 40%,rgba(0,0,0,.7) 100%)}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:max(12px,env(safe-area-inset-top)) 14px 0;z-index:3}
.top b{font:900 12px Orbitron,sans-serif;letter-spacing:.34em;color:var(--c);text-shadow:0 0 12px var(--c)}
.top a,.top button{font:700 10px Orbitron,sans-serif;letter-spacing:.18em;color:var(--c);border:1px solid var(--c);background:rgba(2,8,14,.6);padding:8px 12px;border-radius:999px;text-decoration:none;cursor:pointer}
#tip{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));text-align:center;font:600 11px "JetBrains Mono",monospace;color:#9fb0c3;z-index:3;padding:0 14px;text-shadow:0 1px 6px #000}
#status{position:fixed;left:0;right:0;top:46%;text-align:center;font:700 11px Orbitron,sans-serif;letter-spacing:.3em;color:var(--c);z-index:3}
</style></head><body>
<video playsinline muted autoplay></video>
<canvas id="gl"></canvas><div id="grid"></div><canvas id="hud"></canvas>
<div class="top"><b>HOLO HANDS</b><div><button id="camBtn">📷 CAMERA</button> <a href="javascript:history.length>1?history.back():location.href='home.html'">✕</a></div></div>
<div id="status">WAKING THE CAMERA…</div>
<div id="tip">✋ spread = bigger · squeeze = smaller · ✊ grab to carry, let go fast to toss · 🔄 twist to spin · 👋 swipe across = spin · ✌ next · 👍 reset · 🤏 pinch to choose · flick up = throw</div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
const PHONE = /Android|iPhone|iPad/i.test(navigator.userAgent) || !!window.JarvisNative;
const VER = "0.10.14";

// ---------------------------------------------------------------- the hologram (three.js)
const R = new THREE.WebGLRenderer({canvas: $("#gl"), antialias: !PHONE, alpha: true, powerPreference: "high-performance"}); R.setClearColor(0, 0);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(45, 1, .1, 100); cam.position.set(0, 0, 13);
let W = 0, H = 0, DPR = 1;
const HUD = $("#hud"), X = HUD.getContext("2d");
function resize(){ DPR = Math.min(PHONE ? 1.5 : 2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; R.setPixelRatio(DPR); R.setSize(W, H, false);
  cam.aspect = W / H; cam.position.z = H > W ? 21 : 13; /* a tall phone screen: step back so the menus stay clear */ cam.updateProjectionMatrix(); HUD.width = W * DPR; HUD.height = H * DPR; X.setTransform(DPR, 0, 0, DPR, 0, 0); layout(); }
const holder = new THREE.Group(); scene.add(holder);
const dot = (() => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d"), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.3, "rgba(255,255,255,.5)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const add = (c, op = .9) => ({color: new THREE.Color(c), transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false});
const MODELS = {

  // ---- original hero tech (my own designs, in the spirit of the films)
  gauntlet(){   // an armored gauntlet: its fingers copy yours, an open palm held still fires the repulsor
    const g = new THREE.Group(), RED = "#ff4d5e", GOLD = "#ffd23f", CY = "#5fd8ff";
    const part = (geo, c, op = .16) => { const o = new THREE.Group(); o.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial(add(c, op))));
      o.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 18), new THREE.LineBasicMaterial(add(c, .95)))); return o; };
    const arm = part(new THREE.CylinderGeometry(.72, .92, 2.4, 10, 1, true), RED); arm.position.y = -2.3; g.add(arm);
    [-1.25, -2.0, -2.9].forEach((y, i) => { const r = new THREE.Mesh(new THREE.TorusGeometry(i ? .86 : .78, .045, 6, 40), new THREE.MeshBasicMaterial(add(GOLD, .9))); r.rotation.x = Math.PI / 2; r.position.y = y; g.add(r); });
    const hand = new THREE.Group(); hand.position.y = -.85; g.add(hand);
    const palm = part(new THREE.BoxGeometry(1.75, 1.55, .55), RED); palm.position.y = .25; hand.add(palm);
    const back = part(new THREE.BoxGeometry(1.5, 1.25, .12), GOLD, .22); back.position.set(0, .3, -.34); hand.add(back);
    const rep = new THREE.Mesh(new THREE.CircleGeometry(.3, 32), new THREE.MeshBasicMaterial(add("#e8fbff", .95))); rep.position.set(0, .2, .29); hand.add(rep);
    const rring = new THREE.Mesh(new THREE.RingGeometry(.34, .42, 32), new THREE.MeshBasicMaterial(add(CY, .9))); rring.position.copy(rep.position); hand.add(rring);
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({map: dot, color: new THREE.Color(CY), transparent: true, opacity: .9, blending: THREE.AdditiveBlending, depthWrite: false}));
    glow.scale.setScalar(1.6); glow.position.set(0, .2, .35); hand.add(glow);
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(.22, .5, 8, 20, 1, true), new THREE.MeshBasicMaterial(add("#bff6ff", 0)));
    beam.rotation.x = Math.PI / 2; beam.position.set(0, .2, 4.3); hand.add(beam);
    const fingers = [[-.62, .95], [-.21, 1.05], [.21, 1.0], [.62, .8]].map(([x, L]) => { const hinges = []; let parent = new THREE.Group(); parent.position.set(x, 1.0, 0); hand.add(parent);
      for (let k = 0; k < 3; k++){ const h = k ? new THREE.Group() : parent; if (k){ h.position.y = L * .36; parent.add(h); }
        const seg = part(new THREE.BoxGeometry(.33, L * .34, .36), k === 1 ? GOLD : RED, .18); seg.position.y = L * .17; h.add(seg); hinges.push(h); parent = h; }
      return hinges; });
    const tb = new THREE.Group(); tb.position.set(-.95, .05, .1); tb.rotation.z = .9; hand.add(tb);
    const t1 = part(new THREE.BoxGeometry(.36, .55, .36), RED, .18); t1.position.y = .27; tb.add(t1);
    const tk = new THREE.Group(); tk.position.y = .55; tb.add(tk); const t2 = part(new THREE.BoxGeometry(.32, .5, .34), GOLD, .2); t2.position.y = .25; tk.add(t2);
    let blast = 0, still = 0;
    g.userData.tick = (t, dt) => {
      const c = HANDCURL || (() => { const k = (Math.sin(t * 1.3) + 1) / 2 * .85; return [k, k, k, k, k]; })();
      fingers.forEach((hs, i) => hs.forEach((h, k) => { const want = c[i + 1] * (k === 0 ? 1.15 : 1.25); h.rotation.x += (want - h.rotation.x) * Math.min(1, dt * 12); }));
      tb.rotation.x += (c[0] * .9 - tb.rotation.x) * Math.min(1, dt * 12); tk.rotation.x += (c[0] * 1.1 - tk.rotation.x) * Math.min(1, dt * 12);
      if (HANDCURL && !grab && !carry){ spinV.y *= Math.pow(.05, dt); holder.rotation.y += angDiff(0, holder.rotation.y % (Math.PI * 2)) * Math.min(1, dt * 4); holder.rotation.x *= Math.pow(.05, dt); }   // your hand in view: it faces you
      const openPalm = HANDCURL && Math.max(...HANDCURL.slice(1)) < .25;
      still = openPalm && HANDSTILL ? still + dt : 0;
      if (still > .6 && blast <= 0){ blast = 1; still = -1.2; flash("REPULSOR"); sfx("whoosh"); buzz([15, 40, 25]); }
      const pulse = .85 + Math.sin(t * 6) * .15 + Math.max(0, blast) * 1.5;
      glow.scale.setScalar(1.6 * pulse); rep.material.opacity = Math.min(1, .7 + Math.max(0, blast));
      beam.material.opacity = Math.max(0, blast) * .8; beam.scale.set(1 + (1 - blast) * 1.5, 1, 1 + (1 - blast) * 1.5);
      if (blast > 0) blast -= dt * 1.6;
    };
    g.position.y = .6; g.rotation.y = .25; return g; },

  armor(){   // a hovering armored suit: glowing chest reactor, eyes and boot thrusters
    const g = new THREE.Group(), RED = "#ff4d5e", GOLD = "#ffd23f", CY = "#5fd8ff";
    const part = (geo, c, p, r = [0, 0, 0], op = .16) => { const o = new THREE.Group(); o.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial(add(c, op))));
      o.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 18), new THREE.LineBasicMaterial(add(c, .95)))); o.position.set(...p); o.rotation.set(...r); g.add(o); return o; };
    part(new THREE.SphereGeometry(.52, 12, 10), RED, [0, 3.45, 0]);                                     // helmet
    part(new THREE.BoxGeometry(.62, .55, .2), GOLD, [0, 3.35, .42], [0, 0, 0], .25);                    // faceplate
    const eyes = [-.15, .15].map(x => { const e = new THREE.Mesh(new THREE.BoxGeometry(.16, .05, .05), new THREE.MeshBasicMaterial(add("#e8fbff", 1))); e.position.set(x, 3.45, .54); g.add(e); return e; });
    part(new THREE.CylinderGeometry(.95, .7, 1.8, 10), RED, [0, 2.15, 0]);                               // chest
    part(new THREE.BoxGeometry(1.2, .5, .5), GOLD, [0, 1.05, 0], [0, 0, 0], .2);                         // waist
    const reactor = new THREE.Mesh(new THREE.CircleGeometry(.2, 32), new THREE.MeshBasicMaterial(add("#e8fbff", 1))); reactor.position.set(0, 2.45, .84); g.add(reactor);
    const rr = new THREE.Mesh(new THREE.RingGeometry(.24, .32, 32), new THREE.MeshBasicMaterial(add(CY, .95))); rr.position.copy(reactor.position); g.add(rr);
    const rg = new THREE.Sprite(new THREE.SpriteMaterial({map: dot, color: new THREE.Color(CY), transparent: true, opacity: .85, blending: THREE.AdditiveBlending, depthWrite: false})); rg.scale.setScalar(1.3); rg.position.set(0, 2.45, .9); g.add(rg);
    [-1, 1].forEach(sx => { part(new THREE.SphereGeometry(.38, 10, 8), GOLD, [sx * 1.15, 2.85, 0], [0, 0, 0], .2);   // shoulders
      part(new THREE.CylinderGeometry(.24, .2, 1.3, 8), RED, [sx * 1.3, 2.1, 0], [0, 0, sx * .12]); part(new THREE.CylinderGeometry(.27, .22, 1.2, 8), GOLD, [sx * 1.42, .95, 0], [0, 0, sx * .06], .2);
      part(new THREE.CylinderGeometry(.34, .26, 1.5, 8), RED, [sx * .4, -.1, 0]); part(new THREE.CylinderGeometry(.28, .3, 1.5, 8), GOLD, [sx * .42, -1.6, 0], [0, 0, 0], .2);
      part(new THREE.BoxGeometry(.4, .25, .7), RED, [sx * .42, -2.45, .1]); });
    const flames = [-1, 1].map(sx => { const f = new THREE.Mesh(new THREE.ConeGeometry(.2, 1, 16, 1, true), new THREE.MeshBasicMaterial(add(CY, .7))); f.rotation.x = Math.PI; f.position.set(sx * .42, -3.05, .1); g.add(f); return f; });
    const palmGlow = [-1, 1].map(sx => { const s = new THREE.Sprite(new THREE.SpriteMaterial({map: dot, color: new THREE.Color(CY), transparent: true, opacity: .8, blending: THREE.AdditiveBlending, depthWrite: false})); s.scale.setScalar(.7); s.position.set(sx * 1.48, .25, 0); g.add(s); return s; });
    g.userData.tick = t => { g.position.y = -.3 + Math.sin(t * 1.6) * .15;
      const fl = .8 + Math.random() * .4; flames.forEach(f => { f.scale.set(1, fl, 1); f.material.opacity = .45 + Math.random() * .35; });
      const p = .85 + Math.sin(t * 3) * .15; rg.scale.setScalar(1.3 * p); palmGlow.forEach(s => s.scale.setScalar(.7 * p)); eyes.forEach(e => e.material.opacity = .7 + Math.sin(t * 5) * .3); };
    g.scale.setScalar(.82); return g; },

  king(){   // the Iron King: a masked armored sorcerer in a hood, cape rippling, green magic circling his hands
    const g = new THREE.Group(), STEEL = "#9fb7c9", GREEN = "#3dff9a", DARK = "#2de0c0";
    const part = (geo, c, p, r = [0, 0, 0], op = .14) => { const o = new THREE.Group(); o.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial(add(c, op))));
      o.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 18), new THREE.LineBasicMaterial(add(c, .9)))); o.position.set(...p); o.rotation.set(...r); g.add(o); return o; };
    part(new THREE.SphereGeometry(.72, 14, 10, 0, Math.PI * 2, 0, Math.PI * .62), DARK, [0, 3.55, -.05], [0, 0, 0], .1);   // hood
    part(new THREE.BoxGeometry(.66, .78, .3), STEEL, [0, 3.35, .32], [0, 0, 0], .22);                                        // iron mask
    [-.15, .15].forEach(x => { const e = new THREE.Mesh(new THREE.BoxGeometry(.17, .06, .05), new THREE.MeshBasicMaterial(add(GREEN, 1))); e.position.set(x, 3.48, .49); g.add(e); });
    for (let i = 0; i < 4; i++){ const m = new THREE.Mesh(new THREE.BoxGeometry(.04, .2, .04), new THREE.MeshBasicMaterial(add(STEEL, .9))); m.position.set(-.12 + i * .08, 3.12, .49); g.add(m); }   // grille
    part(new THREE.CylinderGeometry(1.0, .75, 1.9, 10), STEEL, [0, 2.15, 0]);
    part(new THREE.BoxGeometry(1.3, .3, .55), GREEN, [0, 1.15, 0], [0, 0, 0], .2);                                            // belt
    [-1, 1].forEach(sx => { part(new THREE.SphereGeometry(.42, 10, 8), STEEL, [sx * 1.15, 2.9, 0], [0, 0, 0], .2);
      part(new THREE.CylinderGeometry(.24, .2, 1.3, 8), STEEL, [sx * 1.35, 2.1, .1], [0, 0, sx * .25]); part(new THREE.CylinderGeometry(.26, .22, 1.1, 8), STEEL, [sx * 1.65, 1.05, .35], [.4, 0, sx * .35]);
      part(new THREE.CylinderGeometry(.34, .5, 2.6, 8), DARK, [sx * .38, -.55, 0], [0, 0, 0], .08); });                           // robe legs
    const cape = new THREE.PlaneGeometry(2.6, 5, 16, 24), base = Float32Array.from(cape.attributes.position.array);
    const capeMesh = new THREE.Mesh(cape, new THREE.MeshBasicMaterial({...add(DARK, .14), side: THREE.DoubleSide, wireframe: true})); capeMesh.position.set(0, .9, -.75); g.add(capeMesh);
    const orbs = [-1, 1].map(sx => { const n = 70, pts = new Float32Array(n * 3), geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(pts, 3));
      g.add(new THREE.Points(geo, new THREE.PointsMaterial({size: .14, map: dot, ...add(GREEN, .95)}))); const core = new THREE.Sprite(new THREE.SpriteMaterial({map: dot, color: new THREE.Color(GREEN), transparent: true, opacity: .9, blending: THREE.AdditiveBlending, depthWrite: false}));
      core.scale.setScalar(.9); core.position.set(sx * 1.85, .45, .6); g.add(core); return {pts, geo, core, sx, n}; });
    g.userData.tick = t => {
      const a = cape.attributes.position; for (let i = 0; i < a.count; i++){ const x = base[i * 3], y = base[i * 3 + 1], k = (2.5 - y) / 5; a.setZ(i, Math.sin(t * 2 + x * 1.4 + y * .9) * .35 * k - k * .4); } a.needsUpdate = true;
      orbs.forEach(o => { for (let i = 0; i < o.n; i++){ const ang = t * 2.2 + i / o.n * Math.PI * 2 * 3, r = .35 + (i % 7) * .03; o.pts[i * 3] = o.core.position.x + Math.cos(ang) * r;
          o.pts[i * 3 + 1] = o.core.position.y + Math.sin(ang * 1.3) * r * .8; o.pts[i * 3 + 2] = o.core.position.z + Math.sin(ang) * r; } o.geo.attributes.position.needsUpdate = true;
        o.core.scale.setScalar(.9 + Math.sin(t * 4 + o.sx) * .15); }); };
    g.position.y = -.6; g.scale.setScalar(.85); return g; },
  core(){ const g = new THREE.Group(), n = 5000, p = new Float32Array(n * 3); for (let i = 0; i < n; i++){ const y = 1 - i / (n - 1) * 2, r = Math.sqrt(1 - y * y), t = i * 2.39996, k = 2.2 * (1 + (Math.random() - .5) * .08); p.set([Math.cos(t) * r * k, y * k, Math.sin(t) * r * k], i * 3); }
    const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(p, 3)); g.add(new THREE.Points(geo, new THREE.PointsMaterial({size: .12, map: dot, ...add("#ffd23f")})));
    [[3.2, [1.1, .3, 0]], [3.7, [-.5, .8, .2]], [4.2, [.2, -.4, .9]]].forEach(([r, rot], k) => { const m = new THREE.Mesh(new THREE.TorusGeometry(r, .03 + k * .01, 6, 120, Math.PI * 1.5), new THREE.MeshBasicMaterial(add(k % 2 ? "#5fd8ff" : "#ffd23f"))); m.rotation.set(...rot); g.add(m); });
    return g; },
  globe(){ const g = new THREE.Group(); g.add(new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.SphereGeometry(2.8, 24, 16)), new THREE.LineBasicMaterial(add("#5fd8ff", .35))));
    const n = 400, p = new Float32Array(n * 3); for (let i = 0; i < n; i++){ const a = Math.random() * 6.283, b = Math.acos(2 * Math.random() - 1); p.set([2.85 * Math.sin(b) * Math.cos(a), 2.85 * Math.cos(b), 2.85 * Math.sin(b) * Math.sin(a)], i * 3); }
    const geo = new THREE.BufferGeometry(); geo.setAttribute("position", new THREE.BufferAttribute(p, 3)); g.add(new THREE.Points(geo, new THREE.PointsMaterial({size: .14, map: dot, ...add("#ffd23f")})));
    const sg = new THREE.Mesh(new THREE.SphereGeometry(.16, 12, 12), new THREE.MeshBasicMaterial(add("#ff4d5e", 1))); const la = 1.35 * Math.PI / 180, lo = 103.8 * Math.PI / 180;
    sg.position.set(2.85 * Math.cos(la) * Math.cos(lo), 2.85 * Math.sin(la), -2.85 * Math.cos(la) * Math.sin(lo)); g.add(sg); return g; },
  figure(){ const g = new THREE.Group(), wire = (geo, p, r = [0, 0, 0]) => { const l = new THREE.LineSegments(new THREE.WireframeGeometry(geo), new THREE.LineBasicMaterial(add("#5fd8ff", .6))); l.position.set(...p); l.rotation.set(...r); g.add(l); };
    wire(new THREE.SphereGeometry(.5, 12, 10), [0, 3.4, 0]); wire(new THREE.CylinderGeometry(.85, .6, 1.9, 12, 3), [0, 2, 0]); wire(new THREE.CylinderGeometry(.6, .65, .7, 12), [0, .75, 0]);
    [-1, 1].forEach(s => { wire(new THREE.CylinderGeometry(.2, .17, 1.5, 8), [s * 1.12, 2.05, 0], [0, 0, s * .18]); wire(new THREE.CylinderGeometry(.16, .12, 1.4, 8), [s * 1.38, .7, 0], [0, 0, s * .08]);
      wire(new THREE.CylinderGeometry(.28, .21, 1.7, 8), [s * .34, -.4, 0]); wire(new THREE.CylinderGeometry(.21, .14, 1.7, 8), [s * .35, -2.1, 0]); });
    g.position.y = -.5; return g; },
  cube(){ const g = new THREE.Group(), geo = new THREE.IcosahedronGeometry(2.4, 1);
    g.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial(add("#5fd8ff", .08)))); g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial(add("#5fd8ff", 1))));
    const inner = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(2, 2, 2)), new THREE.LineBasicMaterial(add("#ffd23f", 1))); g.add(inner); g.userData.spin = inner; return g; },
};
const ORDER = ["core", "globe", "figure", "cube", "gauntlet", "armor", "king"];
let HANDCURL = null, HANDSTILL = false;   // your fingers, for the gauntlet to copy
let model = MODELS[q.get("model")] ? q.get("model") : "core", obj = null, spinV = {x: 0, y: .4}, scaleT = 1, flying = 0;
function show(name, entry = "pop"){
  model = name; if (obj) holder.remove(obj); obj = MODELS[name](); holder.add(obj); holder.scale.setScalar(entry === "drop" ? 3 : .2); holder.position.set(0, entry === "drop" ? 8 : 0, 0);
  flash(name.toUpperCase()); sfx("pop");
}

// ---------------------------------------------------------------- sounds
let AC = null;
function sfx(kind){ try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.resume?.(); const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.connect(g); g.connect(AC.destination);
  const s = {hover: [1400, 1800, .02, .06], pop: [500, 1300, .06, .18], pick: [900, 400, .08, .22], whoosh: [200, 2400, .05, .4], grab: [300, 500, .05, .1]}[kind] || [800, 800, .04, .1];
  o.type = kind === "whoosh" ? "sawtooth" : "sine"; o.frequency.setValueAtTime(s[0], t); o.frequency.exponentialRampToValueAtTime(s[1], t + s[3]); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(s[2], t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + s[3]); o.start(t); o.stop(t + s[3] + .02); } catch {} }
const buzz = ms => { try { navigator.vibrate?.(ms); } catch {} };

// ---------------------------------------------------------------- the floating ring menus
let DIALS = [], msg = {text: "", t: 0};
const flash = t => { msg = {text: t, t: performance.now()}; };
function layout(){
  const r = Math.min(W, H) * (PHONE && H > W ? .17 : .13), y = H > W ? H * .78 : H * .5;

  if (camOn && track.mode){ X.font = "600 9px JetBrains Mono, monospace"; X.textAlign = "left"; X.fillStyle = "rgba(159,176,195,.55)";
    X.fillText(`TRACKING ${track.hz} Hz · ${track.mode}${hands.length ? "" : " · SHOW ME YOUR HAND"}`, 14, 58); X.textAlign = "center"; }
  if (now - sizing < 600){ const hs = holoScreen(); X.save(); X.font = "700 13px Orbitron, sans-serif"; X.fillStyle = "#ffd23f";
    X.fillText(`SIZE ${Math.round(scaleT * 100)}%`, hs.x, hs.y + Math.min(W, H) * .3 * scaleT + 18); X.restore(); }
  if (carry){ const hs = holoScreen(); X.strokeStyle = "rgba(255,210,63,.7)"; X.lineWidth = 2; X.setLineDash([3, 7]); X.beginPath(); X.arc(hs.x, hs.y, Math.min(W, H) * .22 * scaleT, 0, Math.PI * 2); X.stroke(); X.setLineDash([]); }
  if (grab){ X.strokeStyle = "rgba(255,210,63,.6)"; X.setLineDash([6, 6]); X.beginPath(); X.arc(W / 2, H > W ? H * .44 : H * .5, Math.min(W, H) * .3, 0, Math.PI * 2); X.stroke(); X.setLineDash([]); }
  // message
  const age = (now - msg.t) / 1000; if (msg.text && age < 1.4){ X.globalAlpha = Math.max(0, 1 - Math.max(0, age - .8) / .6); X.fillStyle = "#ffd23f"; X.shadowColor = "#ffd23f"; X.shadowBlur = 20;
    X.font = `900 ${Math.min(W, H) * .06}px Orbitron, sans-serif`; X.fillText(msg.text, W / 2, H > W ? H * .26 : H * .24); X.shadowBlur = 0; X.globalAlpha = 1; }
}

// ---------------------------------------------------------------- loop
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  readHands(now); interact(now, dt);
  if (!carry && !flying){
    if (toss){ holder.position.x += toss.vx * dt; holder.position.y += toss.vy * dt; toss.vx *= Math.pow(.4, dt); toss.vy *= Math.pow(.4, dt);
      const lim = toWorld(W * .92, H * .1);
      if (Math.abs(holder.position.x) > Math.abs(lim.x)){ holder.position.x = Math.sign(holder.position.x) * Math.abs(lim.x); toss.vx *= -.7; sfx("hover"); buzz(6); }
      if (Math.abs(holder.position.y) > Math.abs(lim.y)){ holder.position.y = Math.sign(holder.position.y) * Math.abs(lim.y); toss.vy *= -.7; sfx("hover"); buzz(6); }
      if (now - toss.t0 > 2600 || Math.hypot(toss.vx, toss.vy) < .25) toss = null; }
    else { const hm = home(); holder.position.x += (hm.x - holder.position.x) * Math.min(1, dt * 3); holder.position.y += (hm.y - holder.position.y) * Math.min(1, dt * 3); } }
  if (flying){ const k = (now - flying) / 700; holder.position.y = (H > W ? .9 : 0) + k * k * 14; holder.scale.multiplyScalar(.97); if (k >= 1){ flying = 0; holder.scale.setScalar(.2); holder.position.y = 0; show(model); } }
  else holder.scale.setScalar(holder.scale.x + (scaleT - holder.scale.x) * Math.min(1, dt * 6));
  if (!grab && !carry){ spinV.y = Math.max(-25, Math.min(25, spinV.y)); holder.rotation.y += spinV.y * dt; holder.rotation.x += spinV.x * dt; spinV.y += (.35 - spinV.y) * dt * .8; spinV.x *= Math.pow(.2, dt); holder.rotation.x *= Math.pow(.6, dt); }
  if (obj?.userData.spin) obj.userData.spin.rotation.y -= dt * 1.4;
  obj?.userData.tick?.(now / 1000, dt);
  R.render(scene, cam); drawHUD(now);
  requestAnimationFrame(frame);
}
addEventListener("resize", resize); resize();
show(model, q.get("caught") ? "drop" : "pop"); if (q.get("caught")){ flash("CAUGHT IT"); }
requestAnimationFrame(frame);
if (!q.get("nocam")) startCam(); else $("#status").textContent = "";
window.__hands = {readPose, state: () => ({scaleT, carry: !!carry, toss: !!toss, model, rotY: holder.rotation.y, posX: holder.position.x})};
</script>
<script src="transitions.js" defer></script>
</body></html>
