<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS OS</title>
<meta name="theme-color" content="#07090d">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<script src="/native-bridge.js"></script>
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090d; --panel:#0c1016; --line:#1a212c; --dim:#4b5666; --text:#c9d3e0; --muted:#7d8899;
  --c:#ffd23f;  /* active agent colour */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px}
body{background:radial-gradient(1200px 700px at 50% 38%, color-mix(in srgb,var(--c) 7%,transparent), transparent 60%),var(--bg);transition:background .8s}
.hud{font-family:Orbitron,sans-serif;letter-spacing:.18em;text-transform:uppercase}
header{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--line)}
header .brand{font-size:12px;color:var(--muted)}
header .brand b{color:var(--c);transition:color .6s}
header .sp{flex:1}
header .pill{font-size:10px;color:var(--muted);border:1px solid var(--line);padding:4px 8px;border-radius:3px;cursor:default;background:none;font-family:inherit}
header button.pill{cursor:pointer}
header .ok{color:#3dff8b}
header .pill.hot{color:#000;background:var(--c);border-color:var(--c)}
body.paused .orb .glow{filter:grayscale(1) brightness(.5);animation:none}
body.paused .orb .ring{animation-play-state:paused;opacity:.3}
body.paused #who::after{content:" · PAUSED";color:var(--muted);text-shadow:none}
main{display:grid;grid-template-columns:1fr 380px;height:calc(100% - 50px)}
#stage{display:flex;flex-direction:column;min-width:0;padding:18px 22px 12px}
#grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.card{border:1px solid var(--line);border-bottom:2px solid var(--ac);padding:10px 8px;text-align:center;background:color-mix(in srgb,var(--panel) 80%,transparent);
  opacity:.45;transition:all .4s;cursor:pointer;border-radius:2px}
.card.on{opacity:1}
.card.active{border-color:var(--ac);box-shadow:0 0 22px color-mix(in srgb,var(--ac) 35%,transparent);opacity:1}
.card .dot{width:5px;height:5px;border-radius:50%;background:var(--ac);margin:0 auto 6px;box-shadow:0 0 8px var(--ac)}
.card .nm{font-size:11px;color:var(--ac)}
.card .st{font-size:8px;color:var(--muted);margin-top:4px;letter-spacing:.2em}
.card.working .st{color:var(--ac)}
#core{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:240px}
.orb{position:relative;width:150px;height:150px}
.orb .glow{position:absolute;inset:38px;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--c) 38%,color-mix(in srgb,var(--c) 30%,transparent) 62%,transparent 72%);
  filter:drop-shadow(0 0 28px var(--c));animation:pulse 2.4s ease-in-out infinite;transition:background .6s}
.orb .ring{position:absolute;inset:6px;border-radius:50%;border:2px solid transparent;border-top-color:var(--c);border-right-color:var(--c);animation:spin 5s linear infinite;opacity:.9}
.orb #globe{position:absolute;inset:-60px;width:270px;height:270px;opacity:.35;pointer-events:none}
.orb #dayring{position:absolute;inset:-28px;width:206px;height:206px;pointer-events:none}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
body.alert::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:19;box-shadow:inset 0 0 120px 30px rgba(255,40,40,.65);animation:alertpulse .6s ease-in-out 6 alternate}
@keyframes alertpulse{from{opacity:.2}to{opacity:1}}
#focusbar{display:none;position:fixed;top:48px;left:50%;transform:translateX(-50%);z-index:18;background:rgba(56,214,255,.12);border:1px solid #38d6ff;border-top:0;color:#38d6ff;font:600 11px Orbitron,sans-serif;letter-spacing:.15em;padding:6px 16px;border-radius:0 0 10px 10px}
.orb .ring.r2{inset:0;border-top-color:transparent;border-right-color:transparent;border-bottom-color:var(--c);border-left-color:color-mix(in srgb,var(--c) 40%,transparent);animation-duration:8s;animation-direction:reverse;opacity:.6}
.orb.speak .glow{animation-duration:.7s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.08);opacity:.85}}
#who{margin-top:14px;font-size:18px;color:var(--c);text-shadow:0 0 14px var(--c);font-weight:700}
#role{font-size:9px;color:var(--muted);margin-top:4px}
.wave{display:flex;gap:3px;height:18px;align-items:center;margin-top:10px}
.wave i{width:3px;height:4px;background:var(--c);border-radius:2px;transition:height .1s}
.orb.speak ~ .wave i{animation:bar .5s ease-in-out infinite alternate}
.wave i:nth-child(2){animation-delay:.1s!important}.wave i:nth-child(3){animation-delay:.25s!important}.wave i:nth-child(4){animation-delay:.05s!important}.wave i:nth-child(5){animation-delay:.18s!important}
@keyframes bar{from{height:3px}to{height:18px}}
#log{height:190px;overflow:auto;border-top:1px solid var(--line);padding-top:10px;font-size:12px;line-height:1.6}
.ln{display:grid;grid-template-columns:86px 1fr;gap:12px}
.ln .a{color:var(--ac);font-weight:600}
.ln .m{white-space:pre-wrap;word-break:break-word}
.ln.tool .m,.ln.job .m,.ln.system .m{color:var(--dim)}
.ln.error .m{color:#ff6b6b}
.ln.command .a{color:#fff}
.cursor{display:inline-block;width:7px;height:13px;background:var(--c);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#bar{display:flex;gap:8px;margin-top:10px}
#bar select,#bar input,#bar button{background:var(--panel);color:var(--text);border:1px solid var(--line);font-family:inherit;font-size:13px;padding:10px;border-radius:3px}
#bar input{flex:1;min-width:0}
#bar input:focus{outline:none;border-color:var(--c)}
#bar button{cursor:pointer;color:var(--c)}
#mic.rec,#hands.rec{background:var(--c);color:#000}
aside{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:color-mix(in srgb,var(--panel) 60%,transparent)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:12px 4px;font-family:Orbitron;font-size:9px;letter-spacing:.15em;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--c);border-bottom-color:var(--c)}
.pane{flex:1;overflow:auto;padding:14px;display:none}
.pane.on{display:block}
.item{border:1px solid var(--line);padding:9px 10px;margin-bottom:8px;border-radius:2px;background:var(--panel)}
.item .t{color:var(--text)}
.item .s{color:var(--muted);font-size:11px;margin-top:3px}
.item.overdue{border-left:2px solid #ff3b3b}
.item .row{display:flex;gap:8px;align-items:flex-start}
.item input[type=checkbox]{accent-color:var(--c);margin-top:3px}
.tag{font-size:9px;border:1px solid var(--line);padding:1px 5px;border-radius:2px;margin-right:4px;color:var(--muted)}
.h{font-family:Orbitron;font-size:9px;letter-spacing:.2em;color:var(--muted);margin:14px 0 8px}
.h:first-child{margin-top:0}
.btn{background:none;border:1px solid var(--line);color:var(--c);padding:5px 9px;font-family:inherit;font-size:11px;cursor:pointer;border-radius:2px}
.empty{color:var(--dim);font-size:12px}
.item details summary{cursor:pointer;color:var(--c)}
.item textarea{width:100%;min-height:84px;margin-top:6px;background:var(--bg);color:var(--text);border:1px solid var(--line);font-family:inherit;font-size:12px;padding:7px;border-radius:2px;resize:vertical}
.item .acts{display:flex;gap:6px;margin-top:7px}
.btn.no{color:var(--muted)}
input[type=range]{accent-color:var(--c)}
.badge[hidden]{display:none}
.badge{display:inline-block;min-width:16px;padding:0 5px;border-radius:8px;background:#ff3b3b;color:#fff;font-size:9px;margin-left:4px;font-family:'JetBrains Mono',monospace}
.conn{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--line)}
.conn b{font-weight:400} .conn .y{color:#3dff8b} .conn .n{color:var(--dim)}
#overlay[hidden]{display:none}
#overlay{position:fixed;inset:0;background:rgba(3,5,8,.92);display:flex;align-items:center;justify-content:center;z-index:10}
#overlay button{font-family:Orbitron;letter-spacing:.3em;background:none;color:var(--c);border:1px solid var(--c);padding:18px 34px;font-size:14px;cursor:pointer;box-shadow:0 0 30px color-mix(in srgb,var(--c) 30%,transparent)}
#mtabs{display:none;position:fixed;left:0;right:0;bottom:0;z-index:5;justify-content:space-around;background:rgba(7,9,13,.96);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
#mtabs button,#mtabs a{background:none;border:0;color:var(--muted);font-size:18px;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;padding:2px 8px}
#mtabs span{font-family:Orbitron,sans-serif;font-size:8px;letter-spacing:.12em}
#mtabs .callgo{color:#3dff8b}
@media (max-width:900px){ body{padding-bottom:64px} }
#modal{position:fixed;inset:0;background:rgba(3,5,8,.85);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#modal .box{background:var(--panel);border:1px solid var(--line);max-width:760px;width:100%;max-height:85vh;overflow:auto;padding:22px 26px;line-height:1.6}
#modal p{margin:.5em 0}
#modal ul,#modal ol{margin:.4em 0;padding-left:1.4em}
#modal li{margin:.25em 0}
#modal h1,#modal h2,#modal h3{font-family:Orbitron;letter-spacing:.06em;color:var(--c);font-size:15px}
footer{position:fixed;bottom:6px;left:0;right:380px;text-align:center;font-size:8px;color:var(--dim)}
@media (max-width:900px){
  main{grid-template-columns:1fr;height:auto}
  #stage{padding:12px 16px}
  #bar{flex-wrap:wrap}
  #bar input{flex:1 1 100%;order:-1}
  #bar select{flex:1}
  #grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  aside{border-left:0;border-top:1px solid var(--line);min-height:60vh}
  footer{display:none}
  header .hide-sm,.brand .hide-sm{display:none}
  header{flex-wrap:wrap;gap:6px;padding:10px 12px}
  header .sp{flex-basis:100%;height:0}
  header .pill{font-size:8px;letter-spacing:.1em;padding:5px 7px}
  #grid{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:6px}
  .card{padding:7px 2px}
  .card .nm{font-size:8.5px;letter-spacing:.04em}
  .card .st{display:none}
  .card .dot{margin-bottom:4px}
  #core{min-height:0;padding:14px 0 6px}
  .orb{width:96px;height:96px}
  #who{font-size:15px}
  #log{height:150px}
  #mtabs{display:flex}
}
</style>
</head>
<body>
<div id="overlay" hidden><button id="engage" class="hud">Engage Protocol</button></div>
<div id="modal"><div class="box" id="modalBody"></div></div>

<header>
  <div class="brand hud"><b>JARVIS OS</b><span class="hide-sm"> · Agents Protocol</span></div>
  <div class="sp"></div>
  <span class="pill hud hide-sm" id="model" title="Which AI JARVIS is thinking with">—</span>
  <a class="pill hud" id="callLink" href="/call.html" title="Talk to JARVIS like a phone call" style="color:#3dff8b;border-color:rgba(61,255,139,.4);text-decoration:none">📞 Call</a>
  <button class="pill hud" id="saverBtn" title="Leave your Claude plan alone: run on free Gemini" hidden>🔋 Saver</button>
  <button class="pill hud" id="pauseBtn" title="Stop all AI use until you resume">⏸ Pause</button>
  <button class="pill hud" id="voiceBtn">🔊 Voice</button>
  <button class="pill hud" id="voiceCfg" title="Choose each agent's voice">🎚 Voices</button>
  <button class="pill hud" id="holoBtn" title="3D holograms of your week, business, body, money, city, diagnostics and trophies" onclick="window.HOLO && HOLO.open('week')">🌐 Holo</button>
  <span class="pill hud hide-sm" id="clock">--:--</span>
  <span class="pill hud ok" id="online">0/0 ONLINE</span>
</header>

<canvas id="confetti"></canvas><div id="focusbar"></div>
<main>
  <section id="stage">
    <div id="grid"></div>
    <div id="core">
      <div class="orb" id="orb"><canvas id="globe" width="540" height="540"></canvas><canvas id="dayring" width="412" height="412"></canvas><div class="ring"></div><div class="ring r2"></div><div class="glow"></div></div>
      <div id="who" class="hud">JARVIS</div>
      <div id="role" class="hud">Prime Orchestrator</div>
      <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div id="log"></div>
    <form id="bar" autocomplete="off">
      <select id="target" aria-label="Agent"></select>
      <input id="cmd" placeholder="Give an order… e.g. “Plan my week around my exams”">
      <button type="button" id="mic" title="Push to talk (Ctrl+Space)">🎙</button>
      <button type="button" id="hands" title="Always listen for “Jarvis, …”">👂 Hands-free</button>
      <button type="submit">Send</button>
    </form>
  </section>

  <aside>
    <div class="tabs">
      <button data-p="tasks" class="on">Tasks</button>
      <button data-p="agenda">Agenda</button>
      <button data-p="reports">Reports</button>
      <button data-p="outbox">Outbox<span class="badge" id="obadge" hidden>0</span></button>
      <button data-p="auto">Autopilot</button>
    </div>
    <div class="pane on" id="p-tasks"></div>
    <div class="pane" id="p-agenda"></div>
    <div class="pane" id="p-reports"></div>
    <div class="pane" id="p-outbox"></div>
    <div class="pane" id="p-auto"></div>
  </aside>
</main>
<footer class="hud">JARVIS OS · Command Centre</footer>
<nav id="mtabs" aria-label="Sections">
  <button data-go="tasks">✅<span>Tasks</span></button><button data-go="agenda">📅<span>Agenda</span></button>
  <a href="/call.html" class="callgo">📞<span>Call</span></a>
  <a href="/vision.html">👁<span>Vision</span></a>
  <button data-go="outbox">📥<span>Outbox</span></button><button data-go="reports">📄<span>Reports</span></button>
</nav>

<script>
const MOODS = {warm:[-4,-1],gentle:[-10,-2],calm:[-6,-2],proud:[2,4],cheerful:[6,4],excited:[12,6],playful:[6,5],amused:[3,3],dry:[-6,-4],sarcastic:[-5,3],serious:[-8,-5],stern:[-6,-7],concerned:[-9,-3],worried:[-7,-2],urgent:[12,3],whisper:[-12,-4],tired:[-12,-5],triumphant:[8,7]};
const MOOD_RE = new RegExp("\\[(" + Object.keys(MOODS).join("|") + ")\\]\\s*", "gi");
const EMOTES = {laughs:"Ha ha!", chuckles:"Heh heh.", giggles:"Hee hee!", sighs:"Haah...", groans:"Ughh.", gasps:"Oh!", scoffs:"Pfft.", hums:"Hmm.", whispers:""};
const EMOTE_RE = new RegExp("\\[(" + Object.keys(EMOTES).join("|") + ")\\]\\s*", "gi");
const showEmotes = t => String(t ?? "").replace(EMOTE_RE, (m, e) => e.toLowerCase() === "whispers" ? "" : `(${e.toLowerCase()}) `);
const sayEmotes = t => String(t ?? "").replace(EMOTE_RE, (m, e) => (EMOTES[e.toLowerCase()] || "") + " ");
const stripMoods = t => showEmotes(String(t ?? "").replace(MOOD_RE, ""));
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let AGENTS = {}, ORDER = [], voiceOn = true, state = null;
Object.defineProperty(window, "AGENTS", {get: () => AGENTS}); Object.defineProperty(window, "ORDER", {get: () => ORDER});
try { voiceOn = localStorage.getItem("jarvis-voice") !== "off"; } catch {}

const VOICE = { // per-agent voice character
  JARVIS:{pitch:.85,rate:1.02}, FRIDAY:{pitch:1.25,rate:1.05}, ORACLE:{pitch:.95,rate:.98}, ATHENA:{pitch:1.2,rate:1},
  ZEUS:{pitch:.6,rate:.95}, HERALD:{pitch:1.05,rate:1.08}, STEVE:{pitch:.8,rate:1.05}, VERONICA:{pitch:1.3,rate:1.05},
  BANNER:{pitch:.75,rate:.95}, SENTINEL:{pitch:.5,rate:.92}, EDITH:{pitch:1.1,rate:1}, PEPPER:{pitch:1.15,rate:1.02}
};

// ---------------------------------------------------------------- agents & focus
function buildGrid(){
  $("#grid").innerHTML = ORDER.map(n => `<div class="card" id="card-${n}" style="--ac:${AGENTS[n].color}" data-a="${n}">
     <div class="dot"></div><div class="nm hud">${n}</div><div class="st hud">STANDBY</div></div>`).join("");
  $("#target").innerHTML = ORDER.map(n => `<option>${n}</option>`).join("");
  document.querySelectorAll(".card").forEach(c => c.onclick = () => { $("#target").value = c.dataset.a; focus(c.dataset.a); $("#cmd").focus(); });
}
function setCard(n, st){
  const c = $("#card-"+n); if(!c) return;
  c.classList.add("on"); c.classList.toggle("working", st==="working");
  c.querySelector(".st").textContent = {online:"ONLINE",working:"WORKING…",reporting:"REPORTING…"}[st] || st.toUpperCase();
  $("#online").textContent = `${document.querySelectorAll(".card.on").length}/${ORDER.length} ONLINE`;
}
function focus(n){
  const a = AGENTS[n]; if(!a) return;
  document.documentElement.style.setProperty("--c", a.color);
  $("#who").textContent = n; $("#role").textContent = a.title;
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("active", c.dataset.a===n));
}

// ---------------------------------------------------------------- log + voice
function logLine(agent, msg, kind="log", type=false){
  msg = stripMoods(msg).replace(/\*\*(.+?)\*\*/g, "$1").replace(/^#{1,6}\s+/gm, "").replace(/`([^`]+)`/g, "$1");
  const color = agent==="YOU" ? "#fff" : (AGENTS[agent]?.color || "#888");
  const el = document.createElement("div");
  el.className = `ln ${kind}`; el.style.setProperty("--ac", color);
  el.innerHTML = `<span class="a hud" style="font-size:10px">${esc(agent)}</span><span class="m"></span>`;
  $("#log").appendChild(el);
  const m = el.querySelector(".m");
  document.querySelectorAll("#log .cursor").forEach(c => c.remove());
  if(!type){ m.textContent = msg; scroll(); return Promise.resolve(); }
  return new Promise(res => { let i = 0; const step = () => {
      m.textContent = msg.slice(0, i += 2); scroll();
      if(i < msg.length) setTimeout(step, 14); else { m.insertAdjacentHTML("beforeend", '<span class="cursor"></span>'); res(); } };
    step(); });
}
const scroll = () => { const l = $("#log"); l.scrollTop = l.scrollHeight; };
const GREET_RE = /\b(good\s+(?:morning|afternoon|evening|night)|morning|afternoon|evening|night|hello|hi|hey|welcome(?:\s+back|\s+home)?|yes|no|right|certainly|of\s+course|indeed|understood|done|okay|ok|thanks|thank\s+you|very\s+well|at\s+once|absolutely|sure|noted|on\s+it|right\s+away|goodbye|good\s+night|sleep\s+well|congratulations|well\s+done|apologies|sorry),\s*(sir|ma'am|boss)\b/gi;
const oneBreath = t => String(t).replace(GREET_RE, "$1 $2");
// a mood tag holds for the following sentences until another one appears
function withMood(st, sentence){
  const m = sentence.match(/^\s*\[(\w+)\]/);
  if(m && MOODS[m[1].toLowerCase()]){ st.mood = m[1].toLowerCase(); return sentence; }
  return st.mood ? `[${st.mood}] ${sentence}` : sentence;
}
function plain(md){ return oneBreath(md).replace(/```[\s\S]*?```/g,"").replace(/[#*_`>|]/g,"").replace(/\[(.*?)\]\(.*?\)/g,"$1").slice(0,600); }
// Voices: premium (ElevenLabs via /api/tts) when configured, else the computer's voices, customisable per agent.
let VOICE_PROVIDER = "browser", currentAudio = null;
function loadCustomVoices(){ try { return JSON.parse(localStorage.getItem("jarvis-voices") || "{}"); } catch { return {}; } }
function saveCustomVoices(v){ try { localStorage.setItem("jarvis-voices", JSON.stringify(v)); } catch {} }
let CUSTOM = loadCustomVoices();
function voiceSettings(agent){
  const base = VOICE[agent] || {pitch:1, rate:1};
  return {pitch: base.pitch, rate: base.rate, name: "", ...(CUSTOM[agent] || {})};
}
function browserVoices(){ return "speechSynthesis" in window ? speechSynthesis.getVoices() : []; }
let PRONOUNCE = {}, AUDITIONS = {};   // how to say Singapore names (from the laptop; the screen keeps the real spelling)
function sayNames(t){ for(const [w, s] of Object.entries(PRONOUNCE).sort((a, b) => b[0].length - a[0].length))
  t = t.replace(new RegExp("(^|[^\\w-])" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(?![\\w-])", "gi"), (m, pre) => pre + s); return t; }
// Speakers and Bluetooth headphones sleep when quiet and swallow the first word: wake them with a moment of silence.
let lastSound = 0, wakeCtx = null;
async function wakeAudio(){
  if(Date.now() - lastSound < 8000) return;
  try { wakeCtx = wakeCtx || new (window.AudioContext || window.webkitAudioContext)(); if(wakeCtx.state === "suspended") await wakeCtx.resume();
    const o = wakeCtx.createOscillator(), g = wakeCtx.createGain(); g.gain.value = 0.0001; o.connect(g); g.connect(wakeCtx.destination);
    o.start(); o.stop(wakeCtx.currentTime + 0.35); await new Promise(r => setTimeout(r, 300)); } catch {}
}
function speakBrowser(agent, text, done){
  const mood = (String(text).match(/^\s*\[(\w+)\]/) || [])[1]?.toLowerCase();
  const u = new SpeechSynthesisUtterance(sayNames(plain(sayEmotes(String(text).replace(MOOD_RE, "")))));
  const v = voiceSettings(agent), [dr, dp] = MOODS[mood] || [0, 0];
  u.pitch = Math.max(0.1, v.pitch + dp / 20); u.rate = Math.max(0.5, v.rate * (1 + dr / 100));
  const all = browserVoices(), en = all.filter(x => x.lang.startsWith("en"));
  const chosen = v.name && all.find(x => x.name === v.name);
  if(chosen) u.voice = chosen;
  else if(en.length){ const pref = en.find(x => /Daniel|UK English Male|Google UK/i.test(x.name)); u.voice = agent==="JARVIS" && pref ? pref : en[(ORDER.indexOf(agent)+en.length) % en.length]; }
  u.onend = u.onerror = done;
  speechSynthesis.speak(u);
  setTimeout(done, 4000 + text.length*90); // safety
}
// Speech queue: sentences are spoken in order as they stream in. Premium audio for the next sentence is
// fetched while the current one plays, so there are no gaps.
let speechChain = Promise.resolve(), speechGen = 0, speaking = 0;
function prepareClip(agent, text){
  const clip = {agent, text: plain(text), gen: speechGen};
  if(VOICE_PROVIDER !== "browser")
    clip.audio = fetch("/api/tts", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({agent, text: clip.text})})
      .then(r => { if(!r.ok) throw new Error(r.status); return r.blob(); });
  return clip;
}
function playClip(clip){
  return new Promise(res => {
    if(clip.gen !== speechGen || !voiceOn) return res();
    let finished = false;
    const done = () => { if(finished) return; finished = true; $("#orb").classList.remove("speak"); window.HUDFX?.speakEnd(clip); res(); };
    focus(clip.agent); $("#orb").classList.add("speak"); window.HUDFX?.speakStart(clip, null);
    const browser = () => "speechSynthesis" in window ? speakBrowser(clip.agent, clip.text, done) : done();
    if(clip.audio){
      clip.audio.then(async b => { await wakeAudio(); lastSound = Date.now(); if(clip.gen !== speechGen) return done(); const a = new Audio(URL.createObjectURL(b)); currentAudio = a; a.onended = a.onerror = () => { lastSound = Date.now(); done(); }; window.HUDFX?.speakStart(clip, a); return a.play(); })
        .catch(browser);
      setTimeout(done, 9000 + clip.text.length*120); // safety
    } else browser();
  });
}
function queueSpeech(agent, text){
  if(!voiceOn || !plain(text).trim()) return speechChain;
  const clip = prepareClip(agent, text);
  speaking++; pauseListening();
  speechChain = speechChain.then(() => playClip(clip)).finally(() => { if(--speaking === 0) resumeListening(); });
  return speechChain;
}
function speak(agent, text){
  if(!voiceOn) return new Promise(r => setTimeout(r, 600 + text.length*12));
  return queueSpeech(agent, text);
}
function stopSpeaking(){
  speechGen++;
  try { speechSynthesis.cancel(); } catch {}
  if(currentAudio){ currentAudio.pause(); currentAudio = null; }
  $("#orb").classList.remove("speak");
}
// Split streamed text into speakable sentences.
const streams = {};
function feedStream(rid, agent, text, final){
  const st = streams[rid] || (streams[rid] = {buf:"", any:false});
  if(st.ended) return;
  st.buf += text || "";
  let m;
  while((m = st.buf.match(/^[\s\S]*?[.!?…](?=\s)|^[^\n]*\n/))){
    const sentence = m[0]; st.buf = st.buf.slice(sentence.length);
    if(sentence.trim()){ st.any = true; st.lastSpoken = sentence; queueSpeech(agent, withMood(st, sentence)); }
  }
  if(final && st.buf.trim()){ st.any = true; st.lastSpoken = st.buf; queueSpeech(agent, withMood(st, st.buf)); st.buf = ""; }
  if(final) st.ended = true;
}
// The full reply has arrived. Streamed pieces can still be on their way (slower over Tailscale), so wait for the
// end of the stream; if it doesn't come, speak whatever part of the reply hasn't been spoken yet.
function finishStream(rid, agent, reply, speakFn, feedFn){
  const st = streams[rid]; if(!st) return;
  if(!st.any && !st.ended){ st.ended = true; speakFn(agent, reply || "Done."); return; }
  setTimeout(() => {
    if(st.ended) return;
    st.ended = true;
    const said = (st.lastSpoken || "").trim(), full = reply || "";
    const at = said ? full.lastIndexOf(said.replace(/^\[\w+\]\s*/, "")) : -1;
    const rest = at >= 0 ? full.slice(at + said.replace(/^\[\w+\]\s*/, "").length) : st.buf;
    if(rest.trim()) speakFn(agent, withMood(st, rest));
  }, 4000);
  setTimeout(() => { delete streams[rid]; }, 60000);
}

function confetti(){
  const c = $("#confetti"), x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cols = ["#ffd23f","#38d6ff","#3dff8b","#ff4f7b","#e8b04b","#b06bff"];
  const bits = Array.from({length: 160}, () => ({x: innerWidth/2 + (Math.random()-.5)*200, y: innerHeight*.45, vx: (Math.random()-.5)*14,
    vy: -Math.random()*14-4, r: Math.random()*6+3, c: cols[Math.floor(Math.random()*cols.length)], a: Math.random()*6}));
  let n = 0; (function step(){ x.clearRect(0,0,c.width,c.height);
    bits.forEach(b => { b.x += b.vx; b.y += b.vy; b.vy += .35; b.a += .2; x.fillStyle = b.c; x.save(); x.translate(b.x,b.y); x.rotate(b.a); x.fillRect(-b.r/2,-b.r/4,b.r,b.r/2); x.restore(); });
    if(++n < 140) requestAnimationFrame(step); else x.clearRect(0,0,c.width,c.height); })();
}
function redAlert(){ document.body.classList.remove("alert"); void document.body.offsetWidth; document.body.classList.add("alert"); setTimeout(() => document.body.classList.remove("alert"), 4000); }
function showFocus(until, task){ const f = $("#focusbar"); clearInterval(window._ft);
  if(!until){ f.style.display = "none"; return; }
  const end = new Date(until); f.style.display = "block";
  const tick = () => { const m = Math.max(0, Math.round((end - new Date())/60000)); f.textContent = `🛡 FOCUS${task ? " · " + task.toUpperCase() : ""} · ${m} MIN`; if(m <= 0){ f.style.display = "none"; clearInterval(window._ft); } };
  tick(); window._ft = setInterval(tick, 30000);
}
function chime(){   // start-up sound, made on the fly
  try { const a = new (window.AudioContext || window.webkitAudioContext)(), t = a.currentTime;
    [[220,0],[330,.12],[440,.24],[660,.36]].forEach(([f,d]) => { const o = a.createOscillator(), g = a.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(f, t+d); o.frequency.exponentialRampToValueAtTime(f*1.5, t+d+.5);
      g.gain.setValueAtTime(0, t+d); g.gain.linearRampToValueAtTime(.08, t+d+.05); g.gain.exponentialRampToValueAtTime(.0001, t+d+1.1);
      o.connect(g); g.connect(a.destination); o.start(t+d); o.stop(t+d+1.2); }); } catch {}
}
(function globe(){   // slowly turning wireframe globe behind the core
  const c = $("#globe"); if(!c) return; const x = c.getContext("2d"), R = 230, cx = 270, cy = 270; let rot = 0;
  (function draw(){ x.clearRect(0,0,540,540); const col = getComputedStyle(document.body).getPropertyValue("--c").trim() || "#ffd23f";
    x.strokeStyle = col; x.lineWidth = 1;
    for(let lon = 0; lon < 180; lon += 20){ const a = (lon + rot) * Math.PI/180; x.beginPath(); x.ellipse(cx, cy, Math.abs(R*Math.cos(a)), R, 0, 0, Math.PI*2); x.globalAlpha = .35; x.stroke(); }
    for(let lat = -60; lat <= 60; lat += 30){ const y = cy + R*Math.sin(lat*Math.PI/180), r = R*Math.cos(lat*Math.PI/180); x.beginPath(); x.ellipse(cx, y, r, r*.18, 0, 0, Math.PI*2); x.globalAlpha = .25; x.stroke(); }
    x.globalAlpha = 1; rot = (rot + .15) % 360; requestAnimationFrame(draw); })();
})();
function drawDayRing(){   // today's events as arcs around the core (12 o'clock = midnight), a dot for now
  const c = $("#dayring"); if(!c || !state) return; const x = c.getContext("2d"), cx = 206, cy = 206, R = 190;
  x.clearRect(0,0,412,412); x.lineWidth = 6; x.lineCap = "round";
  x.strokeStyle = "rgba(255,255,255,.06)"; x.beginPath(); x.arc(cx, cy, R, 0, Math.PI*2); x.stroke();
  const ang = d => (d.getHours() + d.getMinutes()/60) / 24 * Math.PI*2 - Math.PI/2, today = state.now.slice(0,10);
  state.events.filter(e => e.start.slice(0,10) === today && e.start.length > 10).forEach(e => {
    const s = new Date(e.start), en = e.end ? new Date(e.end) : new Date(s.getTime() + 3600e3);
    x.strokeStyle = e.area === "academic" ? "#5b8cff" : e.area === "career" ? "#e8b04b" : "#3dff8b";
    x.beginPath(); x.arc(cx, cy, R, ang(s), Math.max(ang(en), ang(s) + .05)); x.stroke(); });
  const now = new Date(); x.fillStyle = "#fff"; x.beginPath(); x.arc(cx + R*Math.cos(ang(now)), cy + R*Math.sin(ang(now)), 5, 0, Math.PI*2); x.fill();
}

  let html = "", list = null;
  const close = () => { if(list){ html += `</${list}>`; list = null; } };
  for(const raw of esc(src).split("\n")){
    const line = raw.trimEnd(); let m;
    if((m = line.match(/^(#{1,3})\s+(.*)$/))){ close(); html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
    else if((m = line.match(/^\s*[-*]\s+(.*)$/))){ if(list !== "ul"){ close(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }

    $("#cmd").placeholder = "Give an order… or say “Jarvis, …”";
    const text = (r.text || "").trim();
    if(!text || r.confidence < .32){
      if(retry < 1){ await queueSpeech(agent || "JARVIS", ["Sorry Sir, say that again?", "Once more, Sir? I missed that.", "Pardon, Sir?"][Math.floor(Math.random() * 3)]); return hearTalk(agent, retry + 1); }
      logLine("JARVIS", "Couldn't make that out" + (text ? `: “${text}”` : "") + ". Try typing it, or hold the mic closer.", "system"); resumeListening(); return;
    }
    const w = parseWake(text), cmd = w && w.command.length >= 2 ? w.command : text;
    convo = true;
    sendCommand(cmd, w ? w.agent : (agent || $("#target").value), true);
  };
  mr.start(200); tick();
}

// ---------------------------------------------------------------- brain & pause switch
const BRAIN_LABEL = {pro: "CLAUDE PLAN", api: "CLAUDE API", gemini: "GEMINI FREE"};
let brainState = null;
function showBrain(b){
  brainState = b;
  const paused = b.mode === "paused", saver = b.mode === "saver";
  document.body.classList.toggle("paused", paused);
  const until = b.until ? ` → ${b.until.slice(11,16)}` : "";
  $("#model").textContent = paused ? `PAUSED${until}` : (b.now ? BRAIN_LABEL[b.now] : "NO BRAIN") + (saver ? until : "") + (b.pro_limited && !saver ? " · LIMIT" : "") + (b.fast && !paused ? " · ⚡FAST" : "");
  $("#model").style.color = paused || !b.now ? "#ffb020" : "";
  $("#pauseBtn").textContent = paused ? "▶ Resume" : "⏸ Pause";
  $("#pauseBtn").classList.toggle("hot", paused);
  $("#saverBtn").hidden = !b.ready?.gemini || paused;
  $("#saverBtn").textContent = saver ? "🔋 Saver on" : "🔋 Saver";
  $("#saverBtn").classList.toggle("hot", saver);
}
async function setBrain(mode, hours){
  const r = await fetch("/api/brain", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({mode, hours})});
  showBrain(await r.json());
}
$("#pauseBtn").onclick = () => brainState?.mode === "paused" ? setBrain("on") : openPauseMenu();
$("#saverBtn").onclick = () => setBrain(brainState?.mode === "saver" ? "on" : "saver");
function openPauseMenu(){
  $("#modalBody").innerHTML = `<h2>Pause JARVIS</h2>
    <p style="color:var(--muted);font-size:12px">While paused, JARVIS uses no AI at all, so your Claude plan is all yours. Routines wait; messages you already approved still go out. You can also say or text “pause” / “resume”.</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">
      ${[[1,"1 hour"],[3,"3 hours"],[8,"8 hours"],[null,"Until I resume"]].map(([h,l]) => `<button class="btn" data-ph="${h ?? ""}">${l}</button>`).join("")}
    </div>`;
  $("#modal").style.display = "flex";
  document.querySelectorAll("[data-ph]").forEach(b => b.onclick = () => { setBrain("paused", b.dataset.ph ? +b.dataset.ph : null); $("#modal").style.display = "none"; });
}

// the floating orb (laptop) and the phone orb ask the dashboard to listen
window.jarvisTalk = () => { const m = $("#mic"); if(m && !m.hidden && !m.classList.contains("rec")) m.click(); };

// ---------------------------------------------------------------- live stream
function connect(){
  const es = new EventSource("/api/stream");
  es.onmessage = e => {
    const ev = JSON.parse(e.data);
    try { window.HUDFX?.onEvent(ev); } catch {}
    if(ev.type === "activity"){
      if(ev.kind === "reply") { logLine(ev.agent, ev.message, "reply", true); }
      else logLine(ev.agent, ev.message, ev.kind);
    } else if(ev.type === "delta"){ if(streams[ev.rid]) feedStream(ev.rid, ev.agent, ev.text, false); }
    else if(ev.type === "delta_end"){ if(streams[ev.rid]) feedStream(ev.rid, ev.agent, "", true); }
    else if(ev.type === "status"){ setCard(ev.agent, ev.state); if(ev.state==="working") focus(ev.agent); }
    else if(ev.type === "brain"){ showBrain(ev); }
    else if(ev.type === "say"){   // an agent speaking up on its own (brief, reminder, alert)
      logLine(ev.agent, "🔊 " + ev.text, "reply");
      queueSpeech(ev.agent, ev.text);
    }
    else if(ev.type === "team"){   // a group call: everyone speaks in turn, each in their own voice
      ev.lines.forEach(l => { logLine(l.agent, (ev.dinner ? "🍽 " : "🎙 ") + l.line, "reply"); queueSpeech(l.agent, l.line); });
    }
    else if(ev.type === "ask"){   // an agent needs a yes/no: say it, then listen for the answer (no wake word needed)
      logLine(ev.agent, "💡 " + ev.say, "reply");
      $("#target").value = "JARVIS";
      queueSpeech(ev.agent, ev.say).then(() => { awaitingUntil = Date.now() + 15000;
        if(handsFree) $("#cmd").placeholder = "👂 Listening for your answer… (“yes”, “no”, “send B”)"; });
      refresh();
    }
    else if(ev.type === "report"){ logLine(ev.agent, `📄 Report filed: ${ev.title}`, "job"); refresh(); }
    else if(ev.type === "data"){ clearTimeout(window._rt); window._rt = setTimeout(refresh, 400); }
    else if(ev.type === "celebrate"){ confetti(); logLine(ev.agent, "🎉 " + ev.text, "job"); }
    else if(ev.type === "alert"){ redAlert(); }
    else if(ev.type === "focus"){ showFocus(ev.until, ev.task); }
    else if(ev.type === "listen"){ window.jarvisTalk(); }
  };
}

    HEAR = !!vi.hear && !window.JarvisNative && !!(window.MediaRecorder && navigator.mediaDevices?.getUserMedia); if(vi.speech_lang && rec) rec.lang = vi.speech_lang; warmAcks(); } catch {}
  try { showBrain(await (await fetch("/api/brain")).json()); } catch {}

  buildGrid(); focus("JARVIS"); await refresh(); connect(); phoneLink();

  } else ORDER.forEach(n => setCard(n, "online"));
  try { if(rec && localStorage.getItem("jarvis-handsfree") === "on") setHandsFree(true); } catch {}
  document.querySelectorAll("#mtabs [data-go]").forEach(b => b.onclick = () => {
    document.querySelector(`.tabs button[data-p="${b.dataset.go}"]`).click();
    document.querySelector("aside").scrollIntoView({behavior: "smooth"}); });
  const tab = location.hash.slice(1);  // e.g. #outbox from the app shortcut or a Telegram link
  if(tab && document.querySelector(`.tabs button[data-p="${tab}"]`)){ document.querySelector(`.tabs button[data-p="${tab}"]`).click();
    if(innerWidth <= 900) setTimeout(() => document.querySelector("aside").scrollIntoView(), 300); }
})();
