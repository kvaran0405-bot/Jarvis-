<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090d; --panel:#0c1016; --line:#1a212c; --dim:#4b5666; --text:#c9d3e0; --muted:#7d8899;
  --c:#ffd23f;  /* active agent colour */
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px}
body{background:radial-gradient(1200px 700px at 50% 38%, color-mix(in srgb,var(--c) 7%,transparent), transparent 60%),var(--bg);transition:background .8s}
.hud{font-family:Orbitron,sans-serif;letter-spacing:.18em;text-transform:uppercase}
header{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid var(--line)}
header .brand{font-size:12px;color:var(--muted)}
header .brand b{color:var(--c);transition:color .6s}
header .sp{flex:1}
header .pill{font-size:10px;color:var(--muted);border:1px solid var(--line);padding:4px 8px;border-radius:3px;cursor:default;background:none;font-family:inherit}
header button.pill{cursor:pointer}
header .ok{color:#3dff8b}
main{display:grid;grid-template-columns:1fr 380px;height:calc(100% - 50px)}
#stage{display:flex;flex-direction:column;min-width:0;padding:18px 22px 12px}
#grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.card{border:1px solid var(--line);border-bottom:2px solid var(--ac);padding:10px 8px;text-align:center;background:color-mix(in srgb,var(--panel) 80%,transparent);
  opacity:.45;transition:all .4s;cursor:pointer;border-radius:2px}
.card.on{opacity:1}
.card.active{border-color:var(--ac);box-shadow:0 0 22px color-mix(in srgb,var(--ac) 35%,transparent);opacity:1}
.card .dot{width:5px;height:5px;border-radius:50%;background:var(--ac);margin:0 auto 6px;box-shadow:0 0 8px var(--ac)}
.card .nm{font-size:11px;color:var(--ac)}
.card .st{font-size:8px;color:var(--muted);margin-top:4px;letter-spacing:.2em}
.card.working .st{color:var(--ac)}
#core{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:240px}
.orb{position:relative;width:150px;height:150px}
.orb .glow{position:absolute;inset:38px;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--c) 38%,color-mix(in srgb,var(--c) 30%,transparent) 62%,transparent 72%);
  filter:drop-shadow(0 0 28px var(--c));animation:pulse 2.4s ease-in-out infinite;transition:background .6s}
.orb .ring{position:absolute;inset:6px;border-radius:50%;border:2px solid transparent;border-top-color:var(--c);border-right-color:var(--c);animation:spin 5s linear infinite;opacity:.9}
.orb .ring.r2{inset:0;border-top-color:transparent;border-right-color:transparent;border-bottom-color:var(--c);border-left-color:color-mix(in srgb,var(--c) 40%,transparent);animation-duration:8s;animation-direction:reverse;opacity:.6}
.orb.speak .glow{animation-duration:.7s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.08);opacity:.85}}
#who{margin-top:14px;font-size:18px;color:var(--c);text-shadow:0 0 14px var(--c);font-weight:700}
#role{font-size:9px;color:var(--muted);margin-top:4px}
.wave{display:flex;gap:3px;height:18px;align-items:center;margin-top:10px}
.wave i{width:3px;height:4px;background:var(--c);border-radius:2px;transition:height .1s}
.orb.speak ~ .wave i{animation:bar .5s ease-in-out infinite alternate}
.wave i:nth-child(2){animation-delay:.1s!important}.wave i:nth-child(3){animation-delay:.25s!important}.wave i:nth-child(4){animation-delay:.05s!important}.wave i:nth-child(5){animation-delay:.18s!important}
@keyframes bar{from{height:3px}to{height:18px}}
#log{height:190px;overflow:auto;border-top:1px solid var(--line);padding-top:10px;font-size:12px;line-height:1.6}
.ln{display:grid;grid-template-columns:86px 1fr;gap:12px}
.ln .a{color:var(--ac);font-weight:600}
.ln .m{white-space:pre-wrap;word-break:break-word}
.ln.tool .m,.ln.job .m,.ln.system .m{color:var(--dim)}
.ln.error .m{color:#ff6b6b}
.ln.command .a{color:#fff}
.cursor{display:inline-block;width:7px;height:13px;background:var(--c);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
#bar{display:flex;gap:8px;margin-top:10px}
#bar select,#bar input,#bar button{background:var(--panel);color:var(--text);border:1px solid var(--line);font-family:inherit;font-size:13px;padding:10px;border-radius:3px}
#bar input{flex:1;min-width:0}
#bar input:focus{outline:none;border-color:var(--c)}
#bar button{cursor:pointer;color:var(--c)}
#mic.rec{background:var(--c);color:#000}
aside{border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:color-mix(in srgb,var(--panel) 60%,transparent)}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:12px 4px;font-family:Orbitron;font-size:9px;letter-spacing:.15em;cursor:pointer;border-bottom:2px solid transparent}
.tabs button.on{color:var(--c);border-bottom-color:var(--c)}
.pane{flex:1;overflow:auto;padding:14px;display:none}
.pane.on{display:block}
.item{border:1px solid var(--line);padding:9px 10px;margin-bottom:8px;border-radius:2px;background:var(--panel)}
.item .t{color:var(--text)}
.item .s{color:var(--muted);font-size:11px;margin-top:3px}
.item.overdue{border-left:2px solid #ff3b3b}
.item .row{display:flex;gap:8px;align-items:flex-start}
.item input[type=checkbox]{accent-color:var(--c);margin-top:3px}
.tag{font-size:9px;border:1px solid var(--line);padding:1px 5px;border-radius:2px;margin-right:4px;color:var(--muted)}
.h{font-family:Orbitron;font-size:9px;letter-spacing:.2em;color:var(--muted);margin:14px 0 8px}
.h:first-child{margin-top:0}
.btn{background:none;border:1px solid var(--line);color:var(--c);padding:5px 9px;font-family:inherit;font-size:11px;cursor:pointer;border-radius:2px}
.empty{color:var(--dim);font-size:12px}
.item textarea{width:100%;min-height:84px;margin-top:6px;background:var(--bg);color:var(--text);border:1px solid var(--line);font-family:inherit;font-size:12px;padding:7px;border-radius:2px;resize:vertical}
.item .acts{display:flex;gap:6px;margin-top:7px}
.btn.no{color:var(--muted)}
input[type=range]{accent-color:var(--c)}
.badge{display:inline-block;min-width:16px;padding:0 5px;border-radius:8px;background:#ff3b3b;color:#fff;font-size:9px;margin-left:4px;font-family:'JetBrains Mono',monospace}
.conn{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--line)}
.conn b{font-weight:400} .conn .y{color:#3dff8b} .conn .n{color:var(--dim)}
#overlay[hidden]{display:none}
#overlay{position:fixed;inset:0;background:rgba(3,5,8,.92);display:flex;align-items:center;justify-content:center;z-index:10}
#overlay button{font-family:Orbitron;letter-spacing:.3em;background:none;color:var(--c);border:1px solid var(--c);padding:18px 34px;font-size:14px;cursor:pointer;box-shadow:0 0 30px color-mix(in srgb,var(--c) 30%,transparent)}
#modal{position:fixed;inset:0;background:rgba(3,5,8,.85);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#modal .box{background:var(--panel);border:1px solid var(--line);max-width:760px;width:100%;max-height:85vh;overflow:auto;padding:22px 26px;line-height:1.6}
#modal h1,#modal h2,#modal h3{font-family:Orbitron;letter-spacing:.06em;color:var(--c);font-size:15px}
footer{position:fixed;bottom:6px;left:0;right:380px;text-align:center;font-size:8px;color:var(--dim)}
@media (max-width:900px){
  main{grid-template-columns:1fr;height:auto}
  #stage{padding:12px 16px}
  #grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  aside{border-left:0;border-top:1px solid var(--line);min-height:60vh}
  footer{display:none}
  header .hide-sm{display:none}
}
</style>
</head>
<body>
<div id="overlay" hidden><button id="engage" class="hud">Engage Protocol</button></div>
<div id="modal"><div class="box" id="modalBody"></div></div>

<header>
  <div class="brand hud"><b>JARVIS OS</b> · Agents Protocol</div>
  <div class="sp"></div>
  <span class="pill hud hide-sm" id="model">—</span>
  <button class="pill hud" id="voiceBtn">🔊 Voice</button>
  <button class="pill hud" id="voiceCfg" title="Choose each agent's voice">🎚 Voices</button>
  <span class="pill hud hide-sm" id="clock">--:--</span>
  <span class="pill hud ok" id="online">0/0 ONLINE</span>
</header>

<main>
  <section id="stage">
    <div id="grid"></div>
    <div id="core">
      <div class="orb" id="orb"><div class="ring"></div><div class="ring r2"></div><div class="glow"></div></div>
      <div id="who" class="hud">JARVIS</div>
      <div id="role" class="hud">Prime Orchestrator</div>
      <div class="wave"><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div id="log"></div>
    <form id="bar" autocomplete="off">
      <select id="target" aria-label="Agent"></select>
      <input id="cmd" placeholder="Give an order… e.g. “Plan my week around my exams”">
      <button type="button" id="mic" title="Speak">🎙</button>
      <button type="submit">Send</button>
    </form>
  </section>

  <aside>
    <div class="tabs">
      <button data-p="tasks" class="on">Tasks</button>
      <button data-p="agenda">Agenda</button>
      <button data-p="reports">Reports</button>
      <button data-p="outbox">Outbox<span class="badge" id="obadge" hidden>0</span></button>
      <button data-p="auto">Autopilot</button>
    </div>
    <div class="pane on" id="p-tasks"></div>
    <div class="pane" id="p-agenda"></div>
    <div class="pane" id="p-reports"></div>
    <div class="pane" id="p-outbox"></div>
    <div class="pane" id="p-auto"></div>
  </aside>
</main>
<footer class="hud">JARVIS OS · Command Centre</footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let AGENTS = {}, ORDER = [], voiceOn = true, state = null;
try { voiceOn = localStorage.getItem("jarvis-voice") !== "off"; } catch {}

const VOICE = { // per-agent voice character
  JARVIS:{pitch:.85,rate:1.02}, FRIDAY:{pitch:1.25,rate:1.05}, ORACLE:{pitch:.95,rate:.98}, ATHENA:{pitch:1.2,rate:1},
  ZEUS:{pitch:.6,rate:.95}, HERALD:{pitch:1.05,rate:1.08}, STEVE:{pitch:.8,rate:1.05}, VERONICA:{pitch:1.3,rate:1.05},
  BANNER:{pitch:.75,rate:.95}, SENTINEL:{pitch:.5,rate:.92}, EDITH:{pitch:1.1,rate:1}
};

// ---------------------------------------------------------------- agents & focus
function buildGrid(){
  $("#grid").innerHTML = ORDER.map(n => `<div class="card" id="card-${n}" style="--ac:${AGENTS[n].color}" data-a="${n}">
     <div class="dot"></div><div class="nm hud">${n}</div><div class="st hud">STANDBY</div></div>`).join("");
  $("#target").innerHTML = ORDER.map(n => `<option>${n}</option>`).join("");
  document.querySelectorAll(".card").forEach(c => c.onclick = () => { $("#target").value = c.dataset.a; focus(c.dataset.a); $("#cmd").focus(); });
}
function setCard(n, st){
  const c = $("#card-"+n); if(!c) return;
  c.classList.add("on"); c.classList.toggle("working", st==="working");
  c.querySelector(".st").textContent = {online:"ONLINE",working:"WORKING…",reporting:"REPORTING…"}[st] || st.toUpperCase();
  $("#online").textContent = `${document.querySelectorAll(".card.on").length}/${ORDER.length} ONLINE`;
}
function focus(n){
  const a = AGENTS[n]; if(!a) return;
  document.documentElement.style.setProperty("--c", a.color);
  $("#who").textContent = n; $("#role").textContent = a.title;
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("active", c.dataset.a===n));
}

// ---------------------------------------------------------------- log + voice
function logLine(agent, msg, kind="log", type=false){
  const color = agent==="YOU" ? "#fff" : (AGENTS[agent]?.color || "#888");
  const el = document.createElement("div");
  el.className = `ln ${kind}`; el.style.setProperty("--ac", color);
  el.innerHTML = `<span class="a hud" style="font-size:10px">${esc(agent)}</span><span class="m"></span>`;
  $("#log").appendChild(el);
  const m = el.querySelector(".m");
  document.querySelectorAll("#log .cursor").forEach(c => c.remove());
  if(!type){ m.textContent = msg; scroll(); return Promise.resolve(); }
  return new Promise(res => { let i = 0; const step = () => {
      m.textContent = msg.slice(0, i += 2); scroll();
      if(i < msg.length) setTimeout(step, 14); else { m.insertAdjacentHTML("beforeend", '<span class="cursor"></span>'); res(); } };
    step(); });
}
const scroll = () => { const l = $("#log"); l.scrollTop = l.scrollHeight; };
function plain(md){ return md.replace(/```[\s\S]*?```/g,"").replace(/[#*_`>|]/g,"").replace(/\[(.*?)\]\(.*?\)/g,"$1").slice(0,600); }
// Voices: premium (ElevenLabs via /api/tts) when configured, else the computer's voices, customisable per agent.
let VOICE_PROVIDER = "browser", currentAudio = null;
function loadCustomVoices(){ try { return JSON.parse(localStorage.getItem("jarvis-voices") || "{}"); } catch { return {}; } }
function saveCustomVoices(v){ try { localStorage.setItem("jarvis-voices", JSON.stringify(v)); } catch {} }
let CUSTOM = loadCustomVoices();
function voiceSettings(agent){
  const base = VOICE[agent] || {pitch:1, rate:1};
  return {pitch: base.pitch, rate: base.rate, name: "", ...(CUSTOM[agent] || {})};
}
function browserVoices(){ return "speechSynthesis" in window ? speechSynthesis.getVoices() : []; }
function speakBrowser(agent, text, done){
  const u = new SpeechSynthesisUtterance(plain(text));
  const v = voiceSettings(agent); u.pitch = v.pitch; u.rate = v.rate;
  const all = browserVoices(), en = all.filter(x => x.lang.startsWith("en"));
  const chosen = v.name && all.find(x => x.name === v.name);
  if(chosen) u.voice = chosen;
  else if(en.length){ const pref = en.find(x => /Daniel|UK English Male|Google UK/i.test(x.name)); u.voice = agent==="JARVIS" && pref ? pref : en[(ORDER.indexOf(agent)+en.length) % en.length]; }
  u.onend = u.onerror = done;
  speechSynthesis.speak(u);
  setTimeout(done, 4000 + text.length*90); // safety
}
function speak(agent, text){
  return new Promise(res => {
    let finished = false;
    const done = () => { if(finished) return; finished = true; $("#orb").classList.remove("speak"); res(); };
    if(!voiceOn){ setTimeout(done, 600 + text.length*12); return; }
    $("#orb").classList.add("speak");
    if(VOICE_PROVIDER === "elevenlabs"){
      fetch("/api/tts", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({agent, text: plain(text)})})
        .then(r => { if(!r.ok) throw new Error(r.status); return r.blob(); })
        .then(b => { const a = new Audio(URL.createObjectURL(b)); currentAudio = a; a.onended = a.onerror = done; return a.play(); })
        .catch(() => "speechSynthesis" in window ? speakBrowser(agent, text, done) : done());
      setTimeout(done, 8000 + text.length*120); // safety
    } else if("speechSynthesis" in window) speakBrowser(agent, text, done);
    else setTimeout(done, 600 + text.length*12);
  });
}
function stopSpeaking(){ try { speechSynthesis.cancel(); } catch {} if(currentAudio){ currentAudio.pause(); currentAudio = null; } }
function openVoiceSettings(){
  const opts = browserVoices();
  const premium = VOICE_PROVIDER === "elevenlabs";
  $("#modalBody").innerHTML = `<h2>Agent voices</h2>
    <p style="color:var(--muted);font-size:12px">${premium
      ? "Premium ElevenLabs voices are on. Each agent's voice is set in .env (JARVIS_VOICE_&lt;AGENT&gt;). The settings below are used only if the voice service is unreachable."
      : "Using your computer's built-in voices. Pick a voice, pitch and speed for each agent. For realistic AI voices, add an ELEVENLABS_API_KEY to .env."}</p>
    <div style="display:grid;gap:10px">${ORDER.map(n => { const v = voiceSettings(n); return `<div class="item" style="display:grid;grid-template-columns:90px minmax(0,1fr);gap:8px;align-items:center">
      <b class="hud" style="color:${AGENTS[n].color};font-size:11px">${n}</b>
      <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-width:0">
        <select data-vn="${n}" aria-label="${n} voice" style="flex:1 1 180px;min-width:0;background:var(--bg);color:var(--text);border:1px solid var(--line);padding:5px;font-family:inherit;font-size:11px">
          <option value="">Automatic</option>${opts.map(o => `<option ${o.name===v.name?"selected":""}>${esc(o.name)}</option>`).join("")}</select>
        <label style="font-size:10px;color:var(--muted)">pitch <input type="range" min="0.1" max="2" step="0.05" value="${v.pitch}" data-vp="${n}"></label>
        <label style="font-size:10px;color:var(--muted)">speed <input type="range" min="0.6" max="1.6" step="0.05" value="${v.rate}" data-vr="${n}"></label>
        <button class="btn" data-vt="${n}">Test</button></div></div>`; }).join("")}</div>
    <div style="margin-top:12px;display:flex;gap:8px"><button class="btn" id="vReset">Reset all</button><button class="btn" id="vClose">Done</button></div>`;
  $("#modal").style.display = "flex";
  const upd = (n, k, val) => { CUSTOM[n] = {...(CUSTOM[n] || {}), [k]: val}; saveCustomVoices(CUSTOM); };
  document.querySelectorAll("[data-vn]").forEach(e => e.onchange = () => upd(e.dataset.vn, "name", e.value));
  document.querySelectorAll("[data-vp]").forEach(e => e.oninput = () => upd(e.dataset.vp, "pitch", +e.value));
  document.querySelectorAll("[data-vr]").forEach(e => e.oninput = () => upd(e.dataset.vr, "rate", +e.value));
  document.querySelectorAll("[data-vt]").forEach(e => e.onclick = () => { stopSpeaking(); const n = e.dataset.vt; focus(n);
    const was = voiceOn; voiceOn = true; speak(n, `${n} here. This is my voice, Sir.`).then(() => voiceOn = was); });
  $("#vReset").onclick = () => { CUSTOM = {}; saveCustomVoices(CUSTOM); openVoiceSettings(); };
  $("#vClose").onclick = () => $("#modal").style.display = "none";
}
async function say(agent, text){ focus(agent); setCard(agent, "reporting"); await Promise.all([logLine(agent, text, "reply", true), speak(agent, text)]); setCard(agent, "online"); }

// ---------------------------------------------------------------- boot sequence
async function boot(){
  const {lines} = await (await fetch("/api/boot")).json();
  for(const {agent, text} of lines){ await say(agent, text); await new Promise(r => setTimeout(r, 250)); }
  focus("JARVIS");
}

// ---------------------------------------------------------------- data panes
const fmt = d => d ? new Date(d.length<=10 ? d+"T00:00" : d).toLocaleString([], d.length<=10 ? {weekday:"short",month:"short",day:"numeric"} : {weekday:"short",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
async function refresh(){
  state = await (await fetch("/api/state")).json();
  const today = state.now.slice(0,10);
  const t = state.tasks;
  $("#p-tasks").innerHTML = (t.length ? "" : `<div class="empty">No open tasks. Tell JARVIS what's on your plate.</div>`) +
    t.map(x => `<div class="item ${x.due && x.due.slice(0,10) < today ? "overdue":""}"><div class="row">
      <input type="checkbox" data-done="${x.id}" title="Mark done"><div><div class="t">${esc(x.title)}</div>
      <div class="s"><span class="tag">${x.area}</span><span class="tag">P${x.priority}</span>${x.assignee?`<span class="tag" style="color:${AGENTS[x.assignee]?.color||"#aaa"}">→ ${x.assignee}</span>`:""}${x.due?"due "+fmt(x.due):""}</div></div></div></div>`).join("") +
    (state.done_recent.length ? `<div class="h">Recently done</div>` + state.done_recent.slice(0,5).map(x => `<div class="item"><div class="t" style="color:var(--muted);text-decoration:line-through">${esc(x.title)}</div>${x.result?`<div class="s">${esc(x.result.slice(0,160))}</div>`:""}</div>`).join("") : "");
  document.querySelectorAll("[data-done]").forEach(cb => cb.onchange = async () => {
    await fetch(`/api/tasks/${cb.dataset.done}`, {method:"PATCH", headers:{"Content-Type":"application/json"}, body:JSON.stringify({status:"done"})}); refresh(); });

  $("#p-agenda").innerHTML = `<div class="h">Next 7 days</div>` + (state.events.length ? state.events.map(e => `<div class="item"><div class="t">${esc(e.title)}</div><div class="s">${fmt(e.start)}${e.location?" · "+esc(e.location):""} <span class="tag">${e.area}</span></div></div>`).join("") : `<div class="empty">Calendar clear.</div>`) +
    `<div class="h">Goals</div>` + (state.goals.length ? state.goals.map(g => `<div class="item"><div class="t">${esc(g.title)}</div><div class="s"><span class="tag">${g.area}</span>${g.progress}%${g.target_date?" · by "+fmt(g.target_date):""}</div></div>`).join("") : `<div class="empty">No goals yet.</div>`) +
    `<div class="h">Career pipeline</div>` + (state.applications.length ? state.applications.map(a => `<div class="item"><div class="t">${esc(a.role)} · ${esc(a.company)}</div><div class="s"><span class="tag">${a.status}</span>${esc(a.next_step)}</div></div>`).join("") : `<div class="empty">No applications tracked.</div>`);

  $("#p-reports").innerHTML = state.reports.length ? state.reports.map(r => `<div class="item" style="cursor:pointer" data-r="${r.id}"><div class="t">${esc(r.title)}</div><div class="s"><span class="tag" style="color:${AGENTS[r.agent]?.color}">${r.agent}</span>${r.kind} · ${fmt(r.created)}</div></div>`).join("") : `<div class="empty">No reports yet. FRIDAY files the first brief at the next scheduled time — or run one from Autopilot.</div>`;
  document.querySelectorAll("[data-r]").forEach(el => el.onclick = () => openReport(el.dataset.r));

  const pend = state.outbox_pending;
  $("#obadge").hidden = !pend.length; $("#obadge").textContent = pend.length;
  const who = m => m.channel === "computer" ? "⌘ Run on laptop" : `${m.channel === "email" ? "✉ Email" : "💬 WhatsApp"} → ${esc(m.recipient_name || m.recipient)}`;
  if(!$("#p-outbox").contains(document.activeElement)) $("#p-outbox").innerHTML = `<div class="h">Waiting for your OK</div>` + (pend.length ? pend.map(m => `<div class="item"><div class="t">${who(m)}</div>
      <div class="s"><span class="tag" style="color:${AGENTS[m.agent]?.color}">${m.agent}</span>#${m.id}${m.send_at ? " · scheduled "+fmt(m.send_at) : ""}</div>
      ${m.subject ? `<div class="s">Subject: ${esc(m.subject)}</div>` : ""}
      <textarea id="ob-${m.id}" aria-label="Message text">${esc(m.body)}</textarea>
      ${m.reason ? `<div class="s">Why: ${esc(m.reason)}</div>` : ""}
      <div class="acts"><button class="btn" data-ok="${m.id}">${m.channel === "computer" ? "Run" : "Send"}</button><button class="btn no" data-no="${m.id}">Cancel</button></div></div>`).join("")
      : `<div class="empty">Nothing waiting. Messages and commands that need your approval appear here and on your WhatsApp.</div>`) +
    `<div class="h">Recent</div>` + (state.outbox_recent.length ? state.outbox_recent.map(m => `<div class="item"><div class="t">${who(m)}</div><div class="s"><span class="tag">${m.status}</span>${esc((m.result || m.error || m.body).slice(0,140))}</div></div>`).join("") : `<div class="empty">Nothing sent yet.</div>`);
  document.querySelectorAll("[data-ok]").forEach(b => b.onclick = async () => {
    b.textContent = "…"; const id = b.dataset.ok;
    const r = await (await fetch(`/api/outbox/${id}/approve`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({body: $("#ob-"+id).value})})).json();
    logLine("JARVIS", r.result, "job"); refresh(); });
  document.querySelectorAll("[data-no]").forEach(b => b.onclick = async () => { await fetch(`/api/outbox/${b.dataset.no}/reject`, {method:"POST"}); refresh(); });

  const cx = await (await fetch("/api/connections")).json();
  const row = (label, on, hint) => `<div class="conn"><b>${label}</b><span class="${on?"y":"n"}">${on ? "connected" : esc(hint)}</span></div>`;
  $("#p-auto").innerHTML = `<div class="h">Connections · autonomy: ${esc(cx.autonomy)}</div>` +
    row("WhatsApp", cx.whatsapp.ready, /off/.test(cx.whatsapp.reason || "") ? "off" : "bridge not running") + row("Email (send)", cx.email_send, "not set up") +
    row("Email (read)", cx.email_read, "not set up") + row("Android phone", cx.phone, "not set up") +
    `<div class="h">Your routines</div>` + (state.routines.length ? state.routines.map(r => `<div class="item"><div class="row" style="justify-content:space-between;align-items:center"><div><div class="t">${esc(r.name)}</div><div class="s"><span class="tag" style="color:${AGENTS[r.agent]?.color}">${r.agent}</span>${esc(r.schedule)}${r.enabled ? "" : " · paused"}</div></div><button class="btn" data-rt="${r.id}">${r.enabled ? "Pause" : "Resume"}</button></div></div>`).join("")
      : `<div class="empty">None yet. Ask JARVIS, e.g. “every weekday at 6am send me a motivational quote and my schedule on WhatsApp”.</div>`) +
    `<div class="h">Built-in routines</div>` + state.jobs.map(j => `<div class="item"><div class="row" style="justify-content:space-between;align-items:center"><div><div class="t">${j.label}</div><div class="s"><span class="tag" style="color:${AGENTS[j.agent]?.color}">${j.agent}</span>${j.running?"running…":j.last_run?"last "+fmt(j.last_run):"never run"}</div></div><button class="btn" data-job="${j.name}">Run now</button></div></div>`).join("") +
    `<div class="h">How the night shift works</div><div class="empty" style="line-height:1.6">Any task with an agent assignee (e.g. “ORACLE, research laptops under $1000 tonight”) is worked on autonomously overnight. Results land in Notes and in the morning brief.</div>`;
  document.querySelectorAll("[data-rt]").forEach(b => b.onclick = async () => { await fetch(`/api/routines/${b.dataset.rt}/toggle`, {method:"POST"}); refresh(); });
  document.querySelectorAll("[data-job]").forEach(b => b.onclick = async () => { b.textContent = "Started"; await fetch(`/api/jobs/${b.dataset.job}/run`, {method:"POST"}); setTimeout(refresh, 800); });
}
function md(src){
  let h = esc(src);
  h = h.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>")
       .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`([^`]+)`/g,"<code>$1</code>")
       .replace(/^\s*[-*] (.*)$/gm,"<li>$1</li>").replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
       .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--c)">$1</a>');
  return h.replace(/\n{2,}/g,"<br><br>");
}
async function openReport(id){
  const r = await (await fetch(`/api/reports/${id}`)).json();
  $("#modalBody").innerHTML = `<div class="hud" style="font-size:9px;color:var(--muted)">${r.agent} · ${r.kind} · ${fmt(r.created)}</div><h1>${esc(r.title)}</h1>${md(r.body)}`;
  $("#modal").style.display = "flex";
}
$("#modal").onclick = e => { if(e.target.id==="modal") $("#modal").style.display = "none"; };
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button,.pane").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); $("#p-"+b.dataset.p).classList.add("on"); });

// ---------------------------------------------------------------- commands
$("#bar").onsubmit = async e => {
  e.preventDefault();
  const text = $("#cmd").value.trim(); if(!text) return;
  const agent = $("#target").value; $("#cmd").value = ""; focus(agent);
  try {
    const r = await fetch("/api/command", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text, agent})});
    const data = await r.json();
    speak(agent, data.reply || "Done.");
  } catch(err){ logLine("JARVIS", "Connection to core lost: "+err, "error"); }
  refresh();
};
// voice input
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SR){
  const rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; let on = false;
  rec.onresult = e => { $("#cmd").value = [...e.results].map(r => r[0].transcript).join(""); if(e.results[e.results.length-1].isFinal){ rec.stop(); $("#bar").requestSubmit(); } };
  rec.onend = () => { on = false; $("#mic").classList.remove("rec"); };
  $("#mic").onclick = () => { if(on){ rec.stop(); return; } stopSpeaking(); rec.start(); on = true; $("#mic").classList.add("rec"); };
} else $("#mic").hidden = true;
$("#voiceBtn").onclick = () => { voiceOn = !voiceOn; try{localStorage.setItem("jarvis-voice", voiceOn?"on":"off");}catch{}; $("#voiceBtn").textContent = voiceOn ? "🔊 Voice" : "🔇 Muted"; if(!voiceOn) stopSpeaking(); };
$("#voiceCfg").onclick = openVoiceSettings;
if("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};

// ---------------------------------------------------------------- live stream
function connect(){
  const es = new EventSource("/api/stream");
  es.onmessage = e => {
    const ev = JSON.parse(e.data);
    if(ev.type === "activity"){
      if(ev.kind === "reply") { focus(ev.agent); logLine(ev.agent, ev.message, "reply", true); }
      else logLine(ev.agent, ev.message, ev.kind);
    } else if(ev.type === "status"){ setCard(ev.agent, ev.state); if(ev.state==="working") focus(ev.agent); }
    else if(ev.type === "report"){ logLine(ev.agent, `📄 Report filed: ${ev.title}`, "job"); refresh(); }
    else if(ev.type === "data"){ clearTimeout(window._rt); window._rt = setTimeout(refresh, 400); }
  };
}

// ---------------------------------------------------------------- start
setInterval(() => $("#clock").textContent = new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}), 1000);
(async () => {
  const info = await (await fetch("/api/agents")).json();
  info.agents.forEach(a => AGENTS[a.name] = a); ORDER = info.agents.map(a => a.name);
  try { VOICE_PROVIDER = (await (await fetch("/api/voices")).json()).provider; } catch {}
  $("#model").textContent = info.llm ? info.model : "LOCAL MODE"; $("#model").style.color = info.llm ? "" : "#ffb020";
  $("#voiceBtn").textContent = voiceOn ? "🔊 Voice" : "🔇 Muted";
  buildGrid(); focus("JARVIS"); await refresh(); connect();
  state.activity.slice(-25).forEach(a => logLine(a.agent, a.message, a.kind));
  if(new URLSearchParams(location.search).get("autostart") === "true"){
    $("#overlay").hidden = false; // browsers need one click before audio may play
    $("#engage").onclick = () => { $("#overlay").hidden = true; boot(); };
  } else ORDER.forEach(n => setCard(n, "online"));
})();
</script>
