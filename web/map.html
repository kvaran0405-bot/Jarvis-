<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS Explorer</title>
<meta name="theme-color" content="#03060a"><link rel="icon" href="/icon-192.png">
<script src="/native-bridge.js"></script>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<script src="/vendor/leaflet/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Explorer: a dark street map where the places you've been glow and the rest stays in shadow, with side quests to
   discover and your route for the day. Phone-first. */
:root{--bg:#03060a;--line:#1b2735;--txt:#dce7f2;--muted:#8a95a7;--ac:#ffd23f;--go:#3dff9a}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:"JetBrains Mono",monospace;overflow:hidden}
#map{position:fixed;inset:0;background:#05080d}
.leaflet-container{background:#05080d;font-family:inherit}
.leaflet-tile-pane{filter:invert(1) hue-rotate(200deg) brightness(.78) contrast(1.15) saturate(.45)}   /* OpenStreetMap, made dark-neon */
.leaflet-control-attribution{background:rgba(3,6,10,.6)!important;color:#55606f!important;font-size:9px}.leaflet-control-attribution a{color:#7a8899!important}
.leaflet-control-zoom{display:none}
/* top: title + chips */
.top{position:fixed;top:0;left:0;right:0;z-index:500;padding:max(10px,env(safe-area-inset-top)) 12px 10px;background:linear-gradient(#03060ae6,transparent);pointer-events:none}
.title{display:flex;align-items:center;gap:8px;pointer-events:auto}.title b{font:700 12px Orbitron,sans-serif;letter-spacing:.3em;color:var(--ac);text-shadow:0 0 12px #ffd23f66}
.title a{margin-left:auto;color:var(--muted);text-decoration:none;font-size:11px;border:1px solid var(--line);padding:5px 10px;border-radius:14px;background:rgba(3,6,10,.7)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:9px;pointer-events:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:18px;border:1px solid var(--line);background:rgba(8,13,20,.85);color:var(--txt);font:600 11px "JetBrains Mono",monospace;cursor:pointer;backdrop-filter:blur(6px)}
.chip.on{border-color:var(--c,var(--ac));color:var(--c,var(--ac));box-shadow:0 0 12px color-mix(in srgb,var(--c,var(--ac)) 40%,transparent)}
/* markers */
.q{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;position:relative}
.q.done{background:radial-gradient(circle,color-mix(in srgb,var(--c) 85%,#fff) 0,var(--c) 35%,transparent 70%);box-shadow:0 0 18px var(--c),0 0 40px color-mix(in srgb,var(--c) 50%,transparent)}
.q.todo{color:#fff;font:700 18px Orbitron,sans-serif;text-shadow:0 0 10px var(--c)}
.q.todo::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--c) 70%,transparent);animation:spin 9s linear infinite}
.q.near::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c);animation:ping 1.6s ease-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes ping{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.6)}}
.qlbl{position:absolute;left:50%;top:36px;transform:translateX(-50%);white-space:nowrap;text-align:center;font:700 11px "JetBrains Mono",monospace;color:#fff;text-shadow:0 1px 4px #000,0 0 8px #000;pointer-events:none}
.qlbl small{display:block;font-weight:400;font-size:10px;color:#b9c4d2}
.me{width:22px;height:22px;border-radius:50%;background:#4f8dff;border:3px solid #dfe9ff;box-shadow:0 0 0 8px rgba(79,141,255,.25),0 0 26px #4f8dff}
.stop{width:26px;height:26px;border-radius:50%;background:var(--go);color:#03060a;display:grid;place-items:center;font:700 12px Orbitron,sans-serif;box-shadow:0 0 16px var(--go)}
.place{width:12px;height:12px;border-radius:50%;background:#5fd8ff;box-shadow:0 0 14px #5fd8ff}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#081019;color:var(--txt);border:1px solid var(--line);box-shadow:0 0 24px rgba(0,0,0,.6)}
.leaflet-popup-content{margin:12px 14px;font:12px/1.5 "JetBrains Mono",monospace}.leaflet-popup-content b{font-size:13px}
.leaflet-popup-content button{margin-top:8px;background:transparent;color:var(--go);border:1px solid var(--go);border-radius:14px;padding:6px 10px;font:700 10px Orbitron,sans-serif;letter-spacing:.1em;cursor:pointer}
/* legend (like an atlas page) */
.legend{position:fixed;left:12px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:500;background:rgba(5,9,15,.88);border:1px solid var(--line);padding:10px 12px;border-radius:12px;backdrop-filter:blur(6px);font-size:11px;max-width:220px}
.legend h4{margin:0 0 6px;font:700 9px Orbitron,sans-serif;letter-spacing:.25em;color:var(--muted)}
.legend div{display:flex;align-items:center;gap:8px;margin:4px 0}.legend i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
.legend span{margin-left:auto;color:var(--muted)}.legend.min div,.legend.min .fog{display:none}
.legend .fog{margin-top:6px;color:var(--muted);line-height:1.5}
/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:500;padding:10px 12px max(12px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#03060af0 40%);display:flex;align-items:center;gap:8px}
.stat{flex:1;min-width:0}.stat b{display:block;font:700 15px Orbitron,sans-serif;color:var(--ac);text-shadow:0 0 12px #ffd23f55}.stat small{color:var(--muted);font-size:11px}
.btn{flex:none;height:44px;min-width:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:rgba(8,13,20,.9);color:var(--txt);font:700 10px Orbitron,sans-serif;letter-spacing:.12em;cursor:pointer;display:flex;align-items:center;gap:6px}
.btn.go{background:var(--go);color:#03060a;border-color:var(--go);box-shadow:0 0 18px #3dff9a66}.btn:disabled{opacity:.4}
.toast{position:fixed;left:50%;top:calc(100px + env(safe-area-inset-top));transform:translateX(-50%);z-index:600;background:#081019;border:1px solid var(--go);color:var(--txt);padding:9px 14px;border-radius:18px;font-size:12px;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
@media(min-width:900px){.legend{bottom:auto;top:110px}}
.far .q:not(.near) .qlbl{display:none}
.where{position:fixed;left:12px;right:12px;top:calc(96px + env(safe-area-inset-top));z-index:500;display:flex;gap:6px;max-width:560px}
.where input{flex:1;min-width:0;background:rgba(5,9,15,.9);border:1px solid var(--line);color:var(--txt);padding:11px 14px;border-radius:22px;font:13px "JetBrains Mono",monospace;outline:none}
.where input:focus{border-color:var(--ac);box-shadow:0 0 14px #ffd23f44}
.where button{flex:none;background:rgba(8,13,20,.9);color:var(--ac);border:1px solid var(--ac);border-radius:22px;padding:0 14px;font:700 10px Orbitron,sans-serif;letter-spacing:.12em;cursor:pointer}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:520;max-height:62vh;overflow:auto;background:linear-gradient(#050a12f2,#03060afa);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;padding:14px 14px max(16px,env(safe-area-inset-bottom));transform:translateY(105%);transition:.35s;box-shadow:0 -10px 40px #000a}
.sheet.on{transform:none}.sheet h3{margin:0 0 4px;font:700 12px Orbitron,sans-serif;letter-spacing:.2em;color:var(--ac)}.sheet .sub{color:var(--muted);font-size:11px;margin-bottom:10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px;background:#081019;cursor:pointer;transition:.2s}.opt.on,.opt:hover{border-color:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 40%,transparent)}
.opt b{display:block;font:700 18px Orbitron,sans-serif;color:var(--c)}.opt span{font-size:11px;color:var(--muted)}.opt i{font-style:normal;font-size:18px}
.steps{margin-top:10px;font-size:12px;line-height:1.7;color:#c9d6e3;max-height:24vh;overflow:auto}.steps div{display:flex;gap:8px}.steps em{color:var(--muted);font-style:normal;margin-left:auto}
.sheet .row{display:flex;gap:8px;margin-top:10px}.sheet .row button{flex:1;height:44px;border-radius:22px;border:1px solid var(--line);background:#0a1119;color:var(--txt);font:700 11px Orbitron,sans-serif;letter-spacing:.14em;cursor:pointer}
.sheet .row button:disabled{opacity:.35;box-shadow:none}.sheet .row button.go2{background:var(--go);color:#03060a;border-color:var(--go);box-shadow:0 0 18px #3dff9a66}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 10px}.stats div{background:#081019;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.stats b{display:block;font:700 16px Orbitron,sans-serif;color:var(--ac)}.stats span{font-size:10px;color:var(--muted)}
.turn{position:fixed;left:12px;right:12px;top:calc(96px + env(safe-area-inset-top));z-index:530;display:none;background:#050b13f2;border:1px solid var(--go);border-radius:16px;padding:12px 14px;box-shadow:0 0 24px #3dff9a44}
.turn.on{display:block}.turn b{display:block;font:700 17px Orbitron,sans-serif;color:var(--go);text-shadow:0 0 12px #3dff9a88}.turn small{color:var(--muted)}
.turn button{float:right;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:14px;padding:4px 10px;font:700 9px Orbitron,sans-serif;cursor:pointer}
.comet{width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff,0 0 30px #ff5cf0,0 0 60px #4fd8ff}
@media(max-width:700px){.legend{display:none}}   /* zoomed out: names only for nearby quests */
</style></head><body>
<div id="map"></div>
<div class="top"><div class="title"><b>EXPLORER</b><a href="/command-centre.html">← JARVIS</a></div><div class="chips" id="chips"></div></div>
<div class="legend" id="legend"></div>
<div class="where"><input id="where" placeholder="Where to, Sir?" autocomplete="off"><button id="whereGo">GO</button><button id="dayBtn" title="Your day: route, steps, places">📅 MY DAY</button></div>
<div class="sheet" id="sheet"></div>
<div class="turn" id="turn"></div>
<div class="bar"><div class="stat"><b id="km">—</b><small id="sub">Loading your map…</small></div>
  <button class="btn" id="meBtn" title="Where am I">◎</button><button class="btn" id="todayBtn">TODAY</button><button class="btn go" id="goBtn" disabled>ROUTE</button></div>
<div class="toast" id="toast"></div>
<script>
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let pathLine = null, D = null, filter = "none", picked = [], routeLine = null, stopLayer = L.layerGroup(), questLayer = L.layerGroup(), placeLayer = L.layerGroup(), meMarker = null;
const toast = t => { const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("on"), 2600); };

const map = L.map("map", {zoomControl: false, attributionControl: true, minZoom: 10, maxZoom: 18, worldCopyJump: false})
  .setView([1.3521, 103.8198], 12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
placeLayer.addTo(map); questLayer.addTo(map); stopLayer.addTo(map);

// ---- fog of war: the city sits in shadow; everywhere your phone has been is cleared and glows
map.createPane("fog"); map.getPane("fog").style.zIndex = 350; map.getPane("fog").style.pointerEvents = "none";
const fog = L.DomUtil.create("canvas", "", map.getPane("fog"));
function drawFog(){
  const size = map.getSize(), dpr = Math.min(2, devicePixelRatio || 1);
  fog.width = size.x * dpr; fog.height = size.y * dpr; fog.style.width = size.x + "px"; fog.style.height = size.y + "px";
  L.DomUtil.setPosition(fog, map.containerPointToLayerPoint([0, 0]));
  const g = fog.getContext("2d"); g.scale(dpr, dpr);
  g.fillStyle = "rgba(2,5,10,.66)"; g.fillRect(0, 0, size.x, size.y);
  if(!D) return;
  const mpp = 40075016.686 * Math.cos(map.getCenter().lat * Math.PI / 180) / Math.pow(2, map.getZoom() + 8);   // metres per pixel
  const r = Math.max(6, 280 / mpp);
  g.globalCompositeOperation = "destination-out";
  for(const [lat, lon] of D.trail){ const p = map.latLngToContainerPoint([lat, lon]);
    if(p.x < -r || p.y < -r || p.x > size.x + r || p.y > size.y + r) continue;
    const gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, r); gr.addColorStop(0, "rgba(0,0,0,1)"); gr.addColorStop(.6, "rgba(0,0,0,.85)"); gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y, r, 0, Math.PI * 2); g.fill(); }
  g.globalCompositeOperation = "lighter";
  for(const [lat, lon, n] of D.trail){ const p = map.latLngToContainerPoint([lat, lon]);
    if(p.x < -r || p.y < -r || p.x > size.x + r || p.y > size.y + r) continue;
    const a = Math.min(.22, .07 + n * .02), gr = g.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * .9);
    gr.addColorStop(0, `rgba(120,255,160,${a})`); gr.addColorStop(.5, `rgba(255,200,70,${a * .7})`); gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.beginPath(); g.arc(p.x, p.y, r * .9, 0, Math.PI * 2); g.fill(); }
  g.globalCompositeOperation = "source-over";
}
map.on("move zoom resize zoomend moveend", drawFog);
const zoomClass = () => $("#map").classList.toggle("far", map.getZoom() < 14);
map.on("zoomend", zoomClass); zoomClass();

// ---- side quests
function questIcon(q){
  const k = D.kinds[q.kind], c = k[1], near = !q.done && q.km != null && q.km <= 1.5;
  const lbl = q.done ? `<div class="qlbl">${esc(q.name)}<small>${k[0]}</small></div>`
    : near ? `<div class="qlbl">Side quest nearby<small>Get closer to see it</small></div>` : "";
  return L.divIcon({className: "", iconSize: [34, 34], iconAnchor: [17, 17],
    html: `<div class="q ${q.done ? "done" : "todo"} ${near ? "near" : ""}" style="--c:${c}">${q.done ? k[2] : "?"}${lbl}</div>`});
}
function drawQuests(){
  questLayer.clearLayers();
  D.quests.filter(q => filter !== "none" && (filter === "all" || filter === q.kind)).forEach(q => {
    const k = D.kinds[q.kind];
    const body = q.done ? `<b>${esc(q.name)}</b><br><span style="color:${k[1]}">${k[2]} ${k[0]} · discovered ✓</span><br>${esc(q.why)}`
      : `<b>${k[2]} A ${k[0].toLowerCase()} side quest</b><br>${q.km != null ? q.km + " km away. " : ""}Go there to reveal it.<br><span style="color:#8a95a7">Hint: ${esc(q.why.split(/[,;(]/)[0])}</span>`;
    L.marker([q.lat, q.lon], {icon: questIcon(q)}).addTo(questLayer)
      .bindPopup(`${body}<br><button data-add="${q.lat},${q.lon}" data-name="${esc(q.done ? q.name : k[0] + " quest")}">+ ADD TO ROUTE</button>`);
  });
}
map.on("popupopen", e => { const b = e.popup.getElement().querySelector("[data-add]"); if(!b) return;
  b.onclick = () => { if(picked.some(p => p.ll === b.dataset.add)) return toast("Already on your route");
    picked.push({ll: b.dataset.add, name: b.dataset.name}); map.closePopup(); drawRoute(); toast(`Added: ${b.dataset.name} (${picked.length} stop${picked.length > 1 ? "s" : ""})`); }; });

// ---- route: today's calendar stops plus picked quests, drawn as a glowing line
function drawRoute(){
  stopLayer.clearLayers(); if(routeLine){ routeLine.forEach(l => map.removeLayer(l)); routeLine = null; }
  const today = ((D.route || {}).stops || []).filter(s => s.lat != null).map(s => ({lat: s.lat, lon: s.lon, name: s.name, time: s.time}));
  const pts = [...today, ...picked.map(p => { const [lat, lon] = p.ll.split(",").map(Number); return {lat, lon, name: p.name, time: ""}; })];
  pts.forEach((s, i) => L.marker([s.lat, s.lon], {icon: L.divIcon({className: "", iconSize: [26, 26], iconAnchor: [13, 13], html: `<div class="stop">${i + 1}</div>`})})
    .addTo(stopLayer).bindPopup(`<b>${i + 1}. ${esc(s.name)}</b>${s.time ? "<br>" + s.time : ""}`));
  if(pts.length > 1){ const ll = pts.map(s => [s.lat, s.lon]);
    routeLine = [L.polyline(ll, {color: "#3dff9a", weight: 10, opacity: .18}).addTo(map), L.polyline(ll, {color: "#3dff9a", weight: 3, opacity: .95, dashArray: "8 10", className: "flow"}).addTo(map)]; }
  $("#goBtn").disabled = !(picked.length || today.length);
  $("#goBtn").textContent = pts.length ? `ROUTE · ${pts.length}` : "ROUTE";
}
const fcss = document.createElement("style"); fcss.textContent = `.flow{animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-36}}`; document.head.appendChild(fcss);

// ---- chips + legend
function ui(){
  const chips = [["none", "📍 Live", "#4f8dff"], ["all", "✨ Side quests", "#ffd23f"], ...(filter === "none" ? [] : Object.entries(D.kinds).map(([k, v]) => [k, `${v[2]} ${v[0]}`, v[1]]))];
  $("#chips").innerHTML = chips.map(([k, t, c]) => `<div class="chip ${filter === k ? "on" : ""}" data-k="${k}" style="--c:${c}">${t}</div>`).join("");
  $("#chips").onclick = e => { const c = e.target.closest("[data-k]"); if(!c) return; filter = c.dataset.k; ui(); drawQuests(); };
  const count = k => D.quests.filter(q => q.kind === k), lg = $("#legend");
  lg.innerHTML = `<h4>SIDE QUESTS · ${D.done}/${D.total}</h4>` + Object.entries(D.kinds).map(([k, v]) =>
    `<div style="--c:${v[1]}"><i></i>${v[2]} ${v[0]}<span>${count(k).filter(q => q.done).length}/${count(k).length}</span></div>`).join("") +
    `<div class="fog">Lit areas = where your phone has been. Tap a ? to see a hint.</div>`;
  lg.onclick = () => lg.classList.toggle("min"); lg.style.display = filter === "none" ? "none" : "";
  if(!ui.done){ ui.done = true; if(innerWidth < 700) lg.classList.add("min"); }
  const st = D.stats || {};
  $("#km").textContent = st.squares ? `${st.km2} km² explored` : "Start exploring";
  const ago = D.here_at ? Math.round((Date.now() - new Date(D.here_at)) / 60000) : null;
  $("#sub").textContent = (st.squares ? `${st.squares} spots lit · ${D.done}/${D.total} side quests` : "Your trail lights up as your phone moves (location allowed)")
    + (ago != null ? ` · 📍 ${ago < 2 ? "live" : ago + " min ago"}` : "");
}

async function load(first){
  try { D = await (await fetch("/api/map", {cache: "no-store"})).json(); } catch { $("#sub").textContent = "Can't reach JARVIS on the laptop"; return; }
  placeLayer.clearLayers();
  D.places.filter(p => !D.quests.some(q => q.name === p.name)).forEach(p => L.marker([p.lat, p.lon], {icon: L.divIcon({className: "", iconSize: [12, 12], html: `<div class="place" title="${esc(p.name)}"></div>`})}).addTo(placeLayer).bindPopup(`<b>${esc(p.name)}</b>`));
  if(D.here){ if(!meMarker) meMarker = L.marker(D.here, {icon: L.divIcon({className: "", iconSize: [22, 22], iconAnchor: [11, 11], html: `<div class="me"></div>`}), zIndexOffset: 1000}).addTo(map);
    else meMarker.setLatLng(D.here);
    if(first) map.setView(D.here, 14); }
  if(!dayMode) drawTrail(D.path || []);
  ui(); drawQuests(); drawRoute(); drawFog();
}
$("#meBtn").onclick = () => D?.here ? map.flyTo(D.here, 15) : toast("No phone location yet: open the JARVIS app with location allowed");
$("#todayBtn").onclick = async () => {
  const r = await (await fetch("/api/route", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({stops: [], today: true})})).json();
  D.route = r; drawRoute();
  const known = r.stops.filter(s => s.lat != null);
  if(known.length) map.fitBounds(known.map(s => [s.lat, s.lon]), {padding: [60, 60]});
  toast(r.stops.length ? `Today: ${r.stops.map(s => s.name).join(" → ")}` : "Nothing with a place on today's calendar. Add side quests!");
};
$("#goBtn").onclick = async () => {
  const r = await (await fetch("/api/route", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({stops: picked.map(p => p.ll), today: true})})).json();
  if(!picked.length && !(r.stops || []).length) return toast("Add a stop first");
  const last = picked.length ? picked[picked.length - 1].ll : `${r.stops[0].lat},${r.stops[0].lon}`;
  navTo(last, picked.length ? picked[picked.length - 1].name : r.stops[0].name);
};
// ---------------------------------------------------------------- glowing trail (colour = time of day)
let trailLayers = [], dayMode = false;
const timeColour = f => { const a = [[79, 216, 255], [61, 255, 154], [255, 210, 63], [255, 92, 240]], x = Math.max(0, Math.min(.999, f)) * 3, i = Math.floor(x), t = x - i;
  return `rgb(${a[i].map((v, k) => Math.round(v + (a[i + 1][k] - v) * t)).join(",")})`; };
function drawTrail(pts){
  trailLayers.forEach(l => map.removeLayer(l)); trailLayers = [];
  const ll = pts.map(p => p.length === 3 ? [p[1], p[2]] : p);
  if(ll.length < 2) return;
  trailLayers.push(L.polyline(ll, {color: "#4fd8ff", weight: 16, opacity: .08, lineCap: "round"}).addTo(map));
  trailLayers.push(L.polyline(ll, {color: "#7fe8ff", weight: 7, opacity: .18, lineCap: "round"}).addTo(map));
  for(let i = 0; i < ll.length - 1; i++){
    const f = pts[i].length === 3 ? ((pts[i][0] % 86400) + 8 * 3600) % 86400 / 86400 : i / ll.length;   // Singapore time of day
    trailLayers.push(L.polyline([ll[i], ll[i + 1]], {color: timeColour(f), weight: 3, opacity: .95, lineCap: "round", className: "glowline"}).addTo(map)); }
}
const gcss = document.createElement("style"); gcss.textContent = `.glowline{filter:drop-shadow(0 0 4px currentColor) drop-shadow(0 0 8px currentColor)}`; document.head.appendChild(gcss);

// ---------------------------------------------------------------- navigation inside JARVIS
let NAV = null, navLayers = [], live = null, stepIx = 0, watchId = null;
const say = t => { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.rate = 1.02; speechSynthesis.speak(u); } catch {} };
async function here(){ return new Promise(res => { if(!navigator.geolocation) return res(null);
  navigator.geolocation.getCurrentPosition(p => res([p.coords.latitude, p.coords.longitude]), () => res(null), {enableHighAccuracy: true, timeout: 6000, maximumAge: 20000}); }); }
async function navTo(to, label){
  const me = await here(), q = new URLSearchParams({to}); if(me){ q.set("lat", me[0]); q.set("lon", me[1]); }
  $("#sheet").innerHTML = `<h3>FINDING THE WAY…</h3>`; $("#sheet").classList.add("on");
  let o; try { o = await (await fetch("/api/nav?" + q)).json(); } catch { o = {error: "Can't reach JARVIS on the laptop."}; }
  if(o.error){ $("#sheet").innerHTML = `<h3>HMM</h3><div class="sub">${esc(o.error)}</div><div class="row"><button onclick="document.querySelector('#sheet').classList.remove('on')">CLOSE</button></div>`; return; }
  NAV = o; NAV.label = label || to; showOptions(o.best);
}
function showOptions(mode){
  const o = NAV, col = {walk: "#3dff9a", transit: "#4fd8ff", grab: "#3dff9a", drive: "#ffd23f"};
  $("#sheet").innerHTML = `<h3>TO ${esc(NAV.label).toUpperCase()}</h3>
    <div class="sub">${o.km} km away · traffic ${o.traffic}${o.rain ? " · ☂ raining" : ""}${o.leave_by ? ` · leave by <b style="color:#fff">${o.leave_by}</b>` : ""}</div>
    <div class="opts">${o.options.map(x => `<div class="opt ${x.mode === mode ? "on" : ""}" data-m="${x.mode}" style="--c:${col[x.mode]}"><i>${x.icon}</i><b>${x.min} min</b>
      <span>${x.label}${x.price ? ` · $${x.price[0]}–${x.price[1]}` : ""}${x.note ? " · " + esc(x.note) : ""}</span></div>`).join("")}</div>
    <div class="steps" id="steps"></div>
    <div class="row"><button onclick="document.querySelector('#sheet').classList.remove('on')">CLOSE</button><button class="go2" id="startNav">▶ START</button></div>`;
  $("#sheet").querySelectorAll(".opt").forEach(e => e.onclick = () => showOptions(e.dataset.m));
  const rt = routeFor(mode); drawNav(rt, col[mode]);
  $("#steps").innerHTML = rt && rt.steps ? rt.steps.filter(s => s.text).map(s => `<div>▸ ${esc(s.text)}<em>${s.m >= 1000 ? (s.m / 1000).toFixed(1) + " km" : s.m + " m"}</em></div>`).join("")
    : `<div style="color:var(--muted)">${mode === "transit" ? "Bus/MRT time is an estimate; JARVIS shows the walking and road route around it." : "Route line shown."}</div>`;
  $("#startNav").onclick = () => startNav(rt || routeFor("walk") || routeFor("drive"));
}
const routeFor = m => (m === "walk" ? NAV.routes.walk : NAV.routes.drive) || NAV.routes.walk || NAV.routes.drive;
function drawNav(rt, c){
  navLayers.forEach(l => map.removeLayer(l)); navLayers = [];
  const line = rt ? rt.line : [NAV.from_at, NAV.to_at];
  navLayers.push(L.polyline(line, {color: c, weight: 14, opacity: .12}).addTo(map), L.polyline(line, {color: c, weight: 4, opacity: .95, dashArray: "10 8", className: "flow glowline"}).addTo(map));
  navLayers.push(L.marker(NAV.to_at, {icon: L.divIcon({className: "", iconSize: [26, 26], iconAnchor: [13, 13], html: `<div class="stop">★</div>`})}).addTo(map));
  map.fitBounds(L.latLngBounds(line), {padding: [70, 70]});
}
function startNav(rt){
  if(!rt || !rt.steps){ return toast("Live turn-by-turn needs the road route; try Walk or Drive."); }
  live = rt; stepIx = 0; $("#sheet").classList.remove("on");
  const showTurn = () => { const s = live.steps[Math.min(stepIx, live.steps.length - 1)];
    $("#turn").innerHTML = `<button id="stopNav">END</button><b>${esc(s.text)}</b><small>${stepIx + 1} / ${live.steps.length} · ${esc(NAV.label)}</small>`;
    $("#stopNav").onclick = endNav; };
  $("#turn").classList.add("on"); showTurn(); say(live.steps[0].text + ".");
  if(navigator.geolocation) watchId = navigator.geolocation.watchPosition(p => {
    const me = [p.coords.latitude, p.coords.longitude]; if(meMarker) meMarker.setLatLng(me); map.panTo(me, {animate: true});
    const next = live.steps[stepIx + 1]; if(!next) return;
    const d = map.distance(me, next.at);
    if(d < 120 && !next.warned){ next.warned = true; say(`In ${Math.round(d / 10) * 10} metres, ${next.text.toLowerCase()}.`); }
    if(d < 25){ stepIx++; showTurn(); say(next.text + "."); if(/arrived/i.test(next.text)) setTimeout(endNav, 4000); }
  }, () => toast("Allow location for live navigation"), {enableHighAccuracy: true, maximumAge: 2000});
}
function endNav(){ if(watchId != null) navigator.geolocation.clearWatch(watchId); watchId = null; live = null; $("#turn").classList.remove("on"); }
$("#whereGo").onclick = () => { const v = $("#where").value.trim(); if(v) navTo(v, v); };
$("#where").addEventListener("keydown", e => { if(e.key === "Enter") $("#whereGo").click(); });

// ---------------------------------------------------------------- my day: the glowing route, steps, places, replay
let dayDate = null, comet = null, replayT = null;
async function showDay(d){
  dayMode = true; const iso = d || new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10); dayDate = iso;
  navLayers.forEach(l => map.removeLayer(l)); navLayers = []; endNav();
  let o; try { o = await (await fetch("/api/day?date=" + iso)).json(); } catch { return toast("Can't reach JARVIS"); }
  drawTrail(o.path);
  if(o.path.length > 1) map.fitBounds(L.latLngBounds(o.path.map(p => [p[1], p[2]])), {padding: [70, 70]});
  const nice = new Date(iso + "T12:00").toLocaleDateString([], {weekday: "long", day: "numeric", month: "short"});
  $("#sheet").innerHTML = `<h3>📅 ${esc(nice).toUpperCase()}</h3><div class="sub">Colour = time of day (morning cyan → night pink). Steps: ${esc(o.steps_source)}.</div>
    <div class="stats"><div><b>${o.steps.toLocaleString()}</b><span>steps</span></div><div><b>${o.walk_km}</b><span>km walked</span></div><div><b>${o.km}</b><span>km travelled</span></div><div><b>${o.moving_min}</b><span>min moving</span></div></div>
    <div class="steps">${o.places.length ? o.places.map(p => `<div>${p.time} · ${esc(p.place)}</div>`).join("") : `<div style="color:var(--muted)">${o.path.length ? "No named places today (save places like home and gym to see them here)." : "No movement recorded this day. Is location on in the JARVIS app (all the time)?"}</div>`}</div>
    <div class="row"><button id="dPrev">◀</button><button class="go2" id="dPlay" ${o.path.length > 1 ? "" : "disabled"}>▶ REPLAY</button><button id="dNext">▶</button><button id="dClose">CLOSE</button></div>`;
  $("#sheet").classList.add("on");
  const shift = n => { const t = new Date(dayDate + "T12:00"); t.setDate(t.getDate() + n); showDay(t.toISOString().slice(0, 10)); };
  $("#dPrev").onclick = () => shift(-1); $("#dNext").onclick = () => shift(1);
  $("#dClose").onclick = () => { $("#sheet").classList.remove("on"); dayMode = false; stopReplay(); drawTrail(D?.path || []); };
  $("#dPlay").onclick = () => replay(o.path);
}
function stopReplay(){ cancelAnimationFrame(replayT); if(comet){ map.removeLayer(comet); comet = null; } }
function replay(pts){
  stopReplay(); const ll = pts.map(p => [p[1], p[2]]), t0 = performance.now(), dur = Math.min(30000, 6000 + ll.length * 40);
  comet = L.marker(ll[0], {icon: L.divIcon({className: "", iconSize: [16, 16], iconAnchor: [8, 8], html: `<div class="comet"></div>`}), zIndexOffset: 2000}).addTo(map);
  const step = now => { const f = Math.min(1, (now - t0) / dur), x = f * (ll.length - 1), i = Math.floor(x), k = x - i, a = ll[i], b = ll[Math.min(ll.length - 1, i + 1)];
    comet.setLatLng([a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]);
    const ts = pts[i][0]; $("#dPlay").textContent = new Date(ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
    drawTrail(pts.slice(0, i + 2));
    if(f < 1) replayT = requestAnimationFrame(step); else { $("#dPlay").textContent = "▶ REPLAY"; drawTrail(pts); } };
  replayT = requestAnimationFrame(step);
}
$("#dayBtn").onclick = () => showDay();

load(true); setInterval(() => { if(!dayMode) load(); }, 15000);   // live: the blue dot follows you
const P0 = new URLSearchParams(location.search);
if(P0.get("nav")) setTimeout(() => navTo(P0.get("nav"), P0.get("nav")), 1200);
if(P0.get("day")) setTimeout(() => showDay(P0.get("day") === "today" ? null : P0.get("day")), 1200);
if(P0.get("route") === "today") setTimeout(() => $("#todayBtn").click(), 1500);
</script>
</body></html>
