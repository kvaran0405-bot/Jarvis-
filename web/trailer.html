<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS Trailer</title>
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* JARVIS-TRAILER v3. The voice drives the edit: every line is loaded first, its real length decides how long its
   shot lasts, and cuts land on the next beat after it finishes, so captions and titles always match what you hear.
   Speed: particles move on the graphics chip, the 3D and the titles are two layers (no per-frame copying), titles
   are pre-drawn once, and quality adapts to the device to hold 60 fps. */
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#dce7f2;font-family:"JetBrains Mono",monospace;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#rec{display:none}
#start{position:fixed;inset:0;overflow:auto;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#101b28,#000 70%);z-index:5;transition:opacity .6s}
#start.off{opacity:0;pointer-events:none}
.in{width:min(560px,92vw);display:grid;gap:12px;padding:22px 0;text-align:center}
.in .k{font:600 10px Orbitron,sans-serif;letter-spacing:.34em;color:#6d7a8c}
.in h1{margin:0;font:900 clamp(30px,8vw,58px) Orbitron,sans-serif;letter-spacing:.3em;color:#ffd23f;text-shadow:0 0 30px #ffd23f88}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.opt{border:1px solid #233142;background:rgba(10,16,24,.8);color:#c9d6e3;font:700 10px Orbitron,sans-serif;letter-spacing:.18em;padding:11px 14px;border-radius:999px;cursor:pointer}
.opt.on{border-color:var(--c,#ffd23f);color:var(--c,#ffd23f);box-shadow:0 0 16px color-mix(in srgb,var(--c,#ffd23f) 35%,transparent)}
.lbl{font:700 9px Orbitron,sans-serif;letter-spacing:.28em;color:#4f5d6e;margin-top:6px}
#ded{background:rgba(10,16,24,.8);border:1px solid #233142;color:#fff;font:600 13px "JetBrains Mono",monospace;padding:12px 14px;border-radius:12px;text-align:center;outline:none}
#ded:focus{border-color:#ffd23f}
.big{font:900 13px Orbitron,sans-serif;letter-spacing:.26em;padding:17px 22px;border-radius:999px;border:1px solid #ffd23f;cursor:pointer}
#play{background:#ffd23f;color:#000;box-shadow:0 0 34px #ffd23f77}
#recBtn{background:transparent;color:#ffd23f}
#status{font-size:11px;color:#8a95a7;min-height:16px}
#bar{height:3px;border-radius:3px;background:#1a2430;overflow:hidden}#bar i{display:block;height:100%;width:0;background:#ffd23f;box-shadow:0 0 10px #ffd23f;transition:width .3s}
#thumbs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#thumbs img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid #ffd23f55}
#skip{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:4;background:rgba(0,0,0,.4);border:1px solid #333;color:#888;font:700 9px Orbitron,sans-serif;letter-spacing:.2em;padding:8px 12px;border-radius:999px;display:none}
</style></head><body>
<div id="stage"><canvas id="gl"></canvas><canvas id="fx"></canvas></div><canvas id="rec"></canvas>
<button id="skip">✕</button>
<div id="start"><div class="in">

  <div class="lbl">STYLE</div>

  <div class="lbl">CUT</div>

  <div class="lbl">MAKE IT YOURS</div>
  <div class="row"><button class="opt" id="photosBtn">🖼 ADD YOUR PHOTOS</button><input type="file" id="photos" accept="image/*" multiple hidden></div>
  <div id="thumbs"></div>
  <input id="ded" maxlength="28" placeholder="Dedicate it (optional): e.g. for Mum">

  <button class="big" id="recBtn">⬇ PLAY &amp; SAVE VIDEO</button>
  <div id="bar"><i></i></div>
  <div id="status">Loading your story…</div>
</div></div>

  bright: new THREE.ShaderMaterial({uniforms: {t: {value: null}, th: {value: .46}}, vertexShader: VQ, depthTest: false, depthWrite: false,
    fragmentShader: `uniform sampler2D t; uniform float th; varying vec2 vUv; void main(){ vec3 c = texture2D(t, vUv).rgb; float l = max(c.r, max(c.g, c.b)); gl_FragColor = vec4(c * smoothstep(th, th + .3, l), 1.); }`}),

      void main(){ vec2 uv = vUv; float band = floor(uv.y * 28.);

  for (let i = 0; i < Q.blurIters; i++){ POST.blurH.uniforms.t.value = rtA.texture; pass(POST.blurH, rtB); POST.blurV.uniforms.t.value = rtB.texture; pass(POST.blurV, rtA); }

}

  POST.blurH.uniforms.px.value.set(1 / bw, 0); POST.blurV.uniforms.px.value.set(0, 1 / bh);
  if (PU) PU.uPx.value = H / 2;
  rainCols = []; SL.cache = null;
}

const hex = h => { const c = new THREE.Color(h); return [c.r, c.g, c.b]; };
const C = c => new THREE.Color(c);
const glowMat = (c, op = .9) => new THREE.MeshBasicMaterial({color: C(c), transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide});

const dotTex = (() => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d"), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);

// ================================================================ the particle swarm, animated on the graphics chip
let clock = 0;
const NP = Q.np;
const from = new Float32Array(NP * 3), to = new Float32Array(NP * 3), col = new Float32Array(NP * 3), vel = new Float32Array(NP * 3), seed = new Float32Array(NP);

const pg = new THREE.BufferGeometry();
pg.setAttribute("position", new THREE.BufferAttribute(from, 3)); pg.setAttribute("aTo", new THREE.BufferAttribute(to, 3));
pg.setAttribute("aCol", new THREE.BufferAttribute(col, 3)); pg.setAttribute("aVel", new THREE.BufferAttribute(vel, 3)); pg.setAttribute("aSeed", new THREE.BufferAttribute(seed, 1));
const PU = {uMorph: {value: 1}, uTime: {value: 0}, uBoom: {value: 0}, uSize: {value: .3}, uPx: {value: 400}};
const pm = new THREE.ShaderMaterial({uniforms: PU, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, vertexShader: `
    attribute vec3 aTo, aCol, aVel; attribute float aSeed; uniform float uMorph, uTime, uBoom, uSize, uPx; varying vec3 vC;

let morph = null, boomT0 = -1, SPIN = .05;
const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
function current(){   // where every particle is right now (once per shot, never per frame)

}
function morphTo(fn, dur){ current(); for (let i = 0; i < NP; i++){ const p = fn(i, seed[i]); to[i * 3] = p[0]; to[i * 3 + 1] = p[1]; to[i * 3 + 2] = p[2]; }

function explode(force = 1){ current(); to.set(from);

const dim = (c, k) => () => hex(c).map(v => v * k);
const still = () => { swarm.rotation.set(0, 0, 0); SPIN = 0; };

const point = (i, s) => [(s - .5) * .3, ((i * 7.1) % 1 - .5) * .3, ((i * 3.3) % 1 - .5) * .3];
function textPts(txt, width){
  const c = document.createElement("canvas"), g = c.getContext("2d"); c.width = 1400; c.height = 300;
  g.fillStyle = "#fff"; let fs = 210; g.font = `900 ${fs}px Orbitron, sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";

const textShape = (txt, width) => { const pts = textPts(txt, width); return (i, s) => { const p = pts[i % pts.length]; return [p[0] + (s - .5) * .14, p[1] + ((i * 7.3) % 1 - .5) * .14, (s - .5) * .7]; }; };
const geoXY = (lon, lat) => [(lon - 103.83) * 95, -(lat - 1.355) * 95];

  const ol = D.outline && D.outline.length > 3 ? D.outline : DEMO.outline, edge = [];

}

// ================================================================ the script: every spoken line is also the on-screen title

  const add = (shot, o = {}) => S.push({shot, min: 4, grid: 2, groove: "main", voAt: .25, ...o});

  add("intro", {groove: "heart", min: full ? 12 : 8, vo: line("JARVIS", "Good evening, Sir. Systems coming online."), voAt: 3});
  add("build", {groove: "build", min: full ? 8 : 4, fixed: true});
  add("drop", {groove: "impact", min: full ? 8 : 6, grid: 2, vo: line("JARVIS", "Just A Rather Very Intelligent System."), voAt: 2, title: "JUST A RATHER VERY INTELLIGENT SYSTEM"});

  (full ? montage : [montage[0], montage[1], montage[3], montage[5]]).forEach(([s, t]) => add(s, {groove: "main", min: full ? 4 : 3, vo: line("JARVIS", t), title: t.toUpperCase()}));
  for (let k = 0; k < (full ? 4 : 2); k++) add("stat", {groove: "main", min: 2, k});
  add("warp", {groove: "roll", min: full ? 8 : 4, fixed: true});
  add("slowmo", {groove: "slow", min: full ? 6 : 4, vo: line("JARVIS", "And when you need me most..."), voAt: 1});
  add("charge", {groove: "charge", min: 2, fixed: true});
  add("finale", {groove: "impact", min: full ? 8 : 6, vo: line("JARVIS", ownerName() === "SIR" ? "Starring... you, Sir." : `Starring... ${ownerName()}.`), voAt: 1.5});
  add("logo", {groove: "outro", min: full ? 10 : 8, vo: line("JARVIS", DEDIC ? `I'm always online, Sir. ${DEDIC.replace(/^for\s+/i, "This one's for ")}.` : "I'm always online, Sir."), voAt: 1});
  add("blank", {groove: "none", min: 2});
  add("sting", {groove: "none", min: 6, vo: line("FRIDAY", "Boss, you watched the whole thing? Legend."), voAt: .5});
  add("end", {groove: "none", min: 0});
  return S;
}

// ================================================================ the conductor: picks the cuts and plays the music, a moment ahead
let SCRIPT = [], si = -1, CURSHOT = null, nextBeat = 0, nextT = 0, beatZero = 0, BEAT = .5, CUES = [], playing = false, done = false, mainCount = 0, ticker = 0;
const LOOK = .2;
function voiceDone(sh, t){
  const v = sh.vo; if (!v) return true;
  if (v.t0 == null) return false;
  if (v.buf) return t >= v.end + .3;
  if (v.end != null) return t >= v.end + .25;
  return AC.currentTime > v.t0 + v.dur * 2.2 + 2;   // the phone never said it finished: move on anyway
}
function shouldCut(sh, b, t){
  const k = b - sh.startBeat; if (sh.shot === "end") return false;
  if (k < sh.min || k % sh.grid) return false;
  return sh.fixed || voiceDone(sh, t) || k >= sh.min + 24;
}
function startShot(i, b, t){
  const sh = SCRIPT[i]; si = i; sh.startBeat = b; sh.t0 = t; CURSHOT = sh;
  if (sh.shot === "end"){ CUES.push({t, fn: finish}); return; }
  sh.len = (sh.vo ? Math.max(sh.min * BEAT, sh.voAt * BEAT + sh.vo.dur + .3) : sh.min * BEAT);
  CUES.push({t, fn: () => { shotT0 = clock; unslam(); SHOTS[sh.shot](sh.title || "", sh.k); }});
  if (sh.vo){ const vt = t + sh.voAt * BEAT; playVoice(sh.vo, vt); CUES.push({t: vt, fn: () => caption(sh.vo)}); }
  const S = STYLE;
  if (sh.groove === "build"){ I.riser(t, sh.min * BEAT - .05); CUES.push({t: t + (sh.min - .5) * BEAT, fn: () => { FX.fadeAnim = null; FX.fade = 1; }}); }
  if (sh.groove === "roll") I.riser(t, sh.min * BEAT - .05);
  if (sh.groove === "charge"){ I.riser(t, sh.min * BEAT - .02); I.whoosh(t + sh.min * BEAT - .5, .5); }
  if (sh.groove === "impact"){ I.braam(t, sh.shot === "finale" ? 1.4 : 1); I.subdrop(t); }
  if (sh.groove === "slow"){ I.subdrop(t); I.pad(t, S.chords[3], Math.max(4, sh.len), .05); }
  if (sh.groove === "outro"){ I.pad(t, S.chords[0], 8 * BEAT, .05); I.ping(t, S.chords[0][3] * 2); }
  if (sh.groove === "heart") I.pad(t, S.chords[0], 24 * BEAT, .03);
  if (sh.groove === "main" && SCRIPT[i - 1]?.groove === "main") I.whoosh(t - BEAT * .4, BEAT * .5);
}
function grooveBeat(sh, k, t){
  const S = STYLE, B = BEAT;
  switch (sh.groove){
    case "heart": if (k % 2 === 0) I.heart(t); if (k % 6 === 3) I.ping(t, S.chords[0][3] * 2); break;
    case "build": I.heart(t); I.hat(t + B / 2, false); if (k >= sh.min - 1) I.whoosh(t, B); break;
    case "impact": case "main": {
      const inBar = mainCount % 4, chord = Math.floor(mainCount / 4) % 4; mainCount++;
      if (sh.groove === "impact" && k < 2) break;   // let the braam breathe
      I.kick(t); if (inBar === 1 || inBar === 3){ I.snare(t); if (STYLE_NAME === "hype") I.clap(t); }
      I.hat(t + B / 2, inBar === 3); if (STYLE_NAME !== "noir" && !PHONE) I.hat(t + B / 4);
      if (inBar === 0) I.bass(t, S.roots[chord], B * 1.9); if (inBar === 2) I.bass(t, S.roots[chord] * (STYLE_NAME === "noir" ? 1 : 1.5), B * 1.9);
      if (mainCount > 8) for (let s = 0; s < (PHONE ? 2 : 4); s++) I.arp(t + s * B / (PHONE ? 2 : 4), S.chords[chord][(mainCount * 4 + s) % 4] * (s % 2 ? 1 : 2));
      if (inBar === 0) I.pad(t, S.chords[chord], B * 4, .03); break; }
    case "roll": { const f = k / sh.min; for (let s = 0; s < 4; s++) I.snare(t + s * B / 4, .25 + f * .6); I.kick(t, .8); break; }
    case "slow": if (k % 2 === 1) I.heart(t); break;
    case "charge": I.snare(t, .9); I.snare(t + B / 2, 1); break;
  }
}
function schedule(){
  if (!playing || !AC) return;
  while (nextT < AC.currentTime + LOOK){
    const b = nextBeat, t = nextT;
    if (si < 0) startShot(0, b, t);
    else if (shouldCut(CURSHOT, b, t) && si + 1 < SCRIPT.length) startShot(si + 1, b, t);
    if (CURSHOT && CURSHOT.shot !== "end") grooveBeat(CURSHOT, b - CURSHOT.startBeat, t);
    nextBeat++; nextT += BEAT;
  }
}

// ================================================================ the loop (and quality that adapts to hold the frame rate)
let last = performance.now(), perf = {n: 0, sum: 0, checks: 0};
function adapt(ms){
  if (!playing) return; perf.n++; perf.sum += ms;
  if (perf.n < 40) return; const avg = perf.sum / perf.n; perf.n = 0; perf.sum = 0; perf.checks++;
  if (avg > 21 && Q.res > .55){ Q.res = Math.max(.55, Q.res * .82); Q.blurIters = 1; resize(); }
  else if (avg > 26 && pg.drawRange.count === Infinity){ pg.setDrawRange(0, Math.floor(NP * .6)); }
}
function frame(nowMs){
  const real = Math.min(.05, Math.max(0, (nowMs - last) / 1000)); adapt(nowMs - last); last = nowMs;
  const dt = real * FX.timeScale; clock += real;
  schedule();
  const now = audioNow();
  if (playing){ for (const c of CUES) if (!c.fired && now >= c.t){ c.fired = true; c.fn(); } CUES = CUES.filter(c => !c.fired); }
  if (FX.pending && clock >= FX.pending.at){ const f = FX.pending.fn; FX.pending = null; f(); }
  if (morph){ const k = Math.min(1, (clock - morph.t0) / morph.dur); PU.uMorph.value = ease(k); if (k >= 1) morph = null; }
  PU.uTime.value = clock; PU.uBoom.value = boomT0 >= 0 ? (clock - boomT0) * (FX.timeScale < 1 ? .3 : 1) : 0;
  const ph = playing && AC ? (((now - beatZero) / BEAT) % 1 + 1) % 1 : 0, pump = FX.timeScale < 1 || !CURSHOT || !/main|impact/.test(CURSHOT.groove) ? 0 : Math.exp(-ph * 7);
  swarm.scale.setScalar(1 + pump * .035); PU.uSize.value = .28 + pump * .08; swarm.rotation.y += dt * SPIN;
  anims.forEach(f => f(dt));
  for (let i = waves.length - 1; i >= 0; i--){ const w = waves[i], k = (clock - w.t0) / .9; if (k >= 1){ scene.remove(w.m); w.m.geometry.dispose(); waves.splice(i, 1); continue; }
    w.m.scale.setScalar(1 + k * 40); w.m.material.opacity = (1 - k) * .9; w.m.lookAt(cam.position); }
  if (rig){
    if (rig.warp){ cam.position.z -= real * 46; cam.position.x = Math.sin(clock * 1.2) * 1.1; cam.lookAt(cam.position.x * .5, 0, cam.position.z - 30); }
    else { const k = Math.min(1, (clock - rig.t0) / rig.dur), e = 1 - Math.pow(1 - k, 2); cam.position.lerpVectors(rig.from, rig.to, e);
      cam.position.x += Math.sin(clock * 1.7) * rig.hand * .6; cam.position.y += Math.sin(clock * 2.3) * rig.hand * .4; cam.lookAt(rig.look); }
  }
  if (FX.shake > .01){ cam.position.x += (Math.random() - .5) * FX.shake * .5; cam.position.y += (Math.random() - .5) * FX.shake * .5; }
  if (FX.fadeAnim){ const f = FX.fadeAnim, k = Math.min(1, (clock - f.t0) / f.dur); FX.fade = f.from + (f.to - f.from) * k; if (k >= 1) FX.fadeAnim = null; }
  FX.flash *= Math.pow(.0004, real); FX.glitch *= Math.pow(.02, real); FX.shake *= Math.pow(.03, real);
  const U = POST.final.uniforms; U.time.value = clock; U.flash.value = Math.min(1, FX.flash); U.glitch.value = FX.glitch; U.fade.value = FX.fade;
  U.ca.value = .003 + pump * .006; U.strength.value = (STYLE_NAME === "noir" ? .85 : 1.2) + pump * .35; U.tint.value.setRGB(...(STYLE_NAME === "noir" ? [1, .96, .94] : [1, 1, 1]));
  render(); drawOverlay(now);
  if (recorder){ RX.drawImage(GL, 0, 0, OW, OH); RX.drawImage(FXC, 0, 0); }
  requestAnimationFrame(frame);
}
addEventListener("resize", resize); resize();
requestAnimationFrame(frame);

// ================================================================ start, record, finish
let recorder = null, chunks = [];
async function begin(record){
  STYLE = STYLES[STYLE_NAME]; BEAT = 60 / STYLE.bpm; resize();
  if (!AC) audio(); await AC.resume(); DELAY.delayTime.value = BEAT * .75;
  DEDIC = $("#ded").value.trim();
  $("#play").disabled = $("#recBtn").disabled = true;
  SCRIPT = script();
  try { await document.fonts.load("900 60px Orbitron"); await document.fonts.load("600 20px JetBrains Mono"); } catch {}
  await loadVoices(SCRIPT.filter(s => s.vo).map(s => s.vo));
  $("#play").disabled = $("#recBtn").disabled = false;
  $("#start").classList.add("off"); $("#skip").style.display = "block";
  if (record){ try { const s = REC.captureStream(30); REC_DEST.stream.getAudioTracks().forEach(t => s.addTrack(t));
      const type = ["video/mp4;codecs=avc1,mp4a", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"].find(t => window.MediaRecorder?.isTypeSupported?.(t));
      recorder = new MediaRecorder(s, {mimeType: type, videoBitsPerSecond: 8e6}); chunks = []; recorder.ondataavailable = e => e.data.size && chunks.push(e.data); recorder.start(500); } catch { recorder = null; } }
  resetFX(); clearProps(); CUES = []; si = -1; CURSHOT = null; mainCount = 0; perf = {n: 0, sum: 0, checks: 0};
  MUSIC.gain.cancelScheduledValues(0); MUSIC.gain.value = 1;
  beatZero = nextT = AC.currentTime + .25; nextBeat = 0; playing = true; done = false;
  clearInterval(ticker); ticker = setInterval(schedule, 25);   // keeps the music going even if a frame is slow
  try { navigator.vibrate?.([30, 60, 30]); } catch {}
}
async function finish(){
  if (done) return; done = true; playing = false; clearInterval(ticker); $("#skip").style.display = "none";
  FX.sting = null; FX.fade = 1; FX.end = null; SL.cur = null; FX.counter = null; FX.cap = null;
  if (recorder){ const r = recorder; await new Promise(res => { r.onstop = res; r.stop(); }); recorder = null;
    const blob = new Blob(chunks, {type: r.mimeType}); $("#status").textContent = "Saving your trailer…"; let msg = "";
    if (location.protocol !== "file:"){ try { const d = await (await fetch("/api/trailer/video", {method: "POST", headers: {"Content-Type": r.mimeType}, body: blob})).json();
        msg = d.sent ? "Saved, and sent to your phone on Telegram, Sir. Ready to post." : "Saved on the laptop (data/trailers)."; } catch {} }
    if (!msg && !N){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "jarvis-trailer." + (r.mimeType.includes("mp4") ? "mp4" : "webm"); a.click(); msg = "Downloaded."; }
    $("#status").textContent = msg || "Couldn't save this time, Sir.";
  } else $("#status").textContent = VSTAT.premium ? "" : "Tip: with the laptop on (or Gemini voices ready), the trailer uses JARVIS's real voice.";
  $("#play").textContent = "↻ PLAY AGAIN"; $("#start").classList.remove("off");
}
$("#play").onclick = () => begin(false);
$("#recBtn").onclick = () => begin(true);
$("#skip").onclick = () => { if (AC){ MASTER.gain.setValueAtTime(0, AC.currentTime); setTimeout(() => MASTER.gain.setValueAtTime(.9, AC.currentTime), 600); }
  try { speechSynthesis.cancel(); N?.stopSpeaking?.(); } catch {} finish(); };
document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { STYLE_NAME = b.dataset.s; document.querySelectorAll("[data-s]").forEach(x => x.classList.toggle("on", x === b)); });
document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { CUT = b.dataset.c; document.querySelectorAll("[data-c]").forEach(x => x.classList.toggle("on", x === b)); resize(); });
$("#photosBtn").onclick = () => $("#photos").click();
$("#photos").onchange = async e => {
  PHOTOS = []; $("#thumbs").innerHTML = "";
  for (const f of [...e.target.files].slice(0, 6)){ const url = URL.createObjectURL(f), img = new Image(); img.src = url; try { await img.decode(); } catch { continue; }
    const c = document.createElement("canvas"), k = Math.min(1, 1024 / Math.max(img.width, img.height)); c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    PHOTOS.push(new THREE.CanvasTexture(c)); $("#thumbs").insertAdjacentHTML("beforeend", `<img src="${url}" alt="">`); }
  $("#photosBtn").textContent = PHOTOS.length ? `🖼 ${PHOTOS.length} PHOTO${PHOTOS.length > 1 ? "S" : ""} IN` : "🖼 ADD YOUR PHOTOS";
};
window.__trailer = {script: () => SCRIPT, state: () => ({si, shot: CURSHOT?.shot, playing, res: Q.res, np: NP}), begin, VSTAT};
(async () => {
  try {
    if (location.protocol === "file:" && N?.soloPack){ const p = PACK = JSON.parse(N.soloPack()), h = p.holo || {};
      D = {...DEMO, owner: (p.owner && p.owner !== "Sir") ? p.owner : "SIR", team: (p.team || []).length ? p.team : DEMO.team, outline: h.outline || DEMO.outline,
           places: Object.entries(p.places || {}).map(([k, v]) => ({name: /^(home|hq|house)$/i.test(k) ? "HQ" : k.toUpperCase(), lat: v[0], lon: v[1]})),
           stats: {...DEMO.stats, steps_week: (h.steps?.week || []).reduce((a, b) => a + b, 0), memories: (p.memories || []).length, places_explored: (h.explored || []).length, tasks_done_week: 0}}; }
    else if (location.protocol !== "file:"){ const r = await fetch("/api/trailer"); if (r.ok) D = {...DEMO, ...(await r.json())}; }
    $("#status").textContent = `Starring ${ownerName() === "SIR" ? "you" : ownerName()}. Pick a style and press play.`;
  } catch { $("#status").textContent = "Ready."; }
  const q = new URLSearchParams(location.search);
  if (q.get("style") && STYLES[q.get("style")]) document.querySelector(`[data-s="${q.get("style")}"]`).click();
  if (q.get("cut") === "reel") document.querySelector('[data-c="reel"]').click();
  if (q.get("autoplay") === "1") setTimeout(() => $("#play").click(), 400);
})();
};
