<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS Trailer</title>
<meta name="theme-color" content="#000000">
<script src="vendor/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* The JARVIS trailer v2: a beat-synced 3D film starring the owner. Original score made live, every cut on the beat,
   bloom + chromatic aberration, shockwaves, slow motion, a montage of JARVIS's powers, kinetic titles, three styles,
   a 30-second vertical Reel, your own photos as holograms, a dedication, and a post-credits scene.
   Everything is drawn into one canvas, so "SAVE VIDEO" records exactly what you see and hear. */
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#dce7f2;font-family:"JetBrains Mono",monospace;-webkit-tap-highlight-color:transparent}
#gl{display:none}
#out{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);display:block;background:#000}
#start{position:fixed;inset:0;overflow:auto;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#101b28,#000 70%);z-index:5;transition:opacity .6s}
#start.off{opacity:0;pointer-events:none}
.in{width:min(560px,92vw);display:grid;gap:12px;padding:22px 0;text-align:center}
.in .k{font:600 10px Orbitron,sans-serif;letter-spacing:.34em;color:#6d7a8c}
.in h1{margin:0;font:900 clamp(30px,8vw,58px) Orbitron,sans-serif;letter-spacing:.3em;color:#ffd23f;text-shadow:0 0 30px #ffd23f88}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.opt{border:1px solid #233142;background:rgba(10,16,24,.8);color:#c9d6e3;font:700 10px Orbitron,sans-serif;letter-spacing:.18em;padding:11px 14px;border-radius:999px;cursor:pointer}
.opt.on{border-color:var(--c,#ffd23f);color:var(--c,#ffd23f);box-shadow:0 0 16px color-mix(in srgb,var(--c,#ffd23f) 35%,transparent)}
.lbl{font:700 9px Orbitron,sans-serif;letter-spacing:.28em;color:#4f5d6e;margin-top:6px}
#ded{background:rgba(10,16,24,.8);border:1px solid #233142;color:#fff;font:600 13px "JetBrains Mono",monospace;padding:12px 14px;border-radius:12px;text-align:center;outline:none}
#ded:focus{border-color:#ffd23f}
.big{font:900 13px Orbitron,sans-serif;letter-spacing:.26em;padding:17px 22px;border-radius:999px;border:1px solid #ffd23f;cursor:pointer}
#play{background:#ffd23f;color:#000;box-shadow:0 0 34px #ffd23f77}
#rec{background:transparent;color:#ffd23f}
#status{font-size:11px;color:#8a95a7;min-height:16px}
#thumbs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#thumbs img{width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid #ffd23f55}
#skip{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:4;background:rgba(0,0,0,.4);border:1px solid #333;color:#888;font:700 9px Orbitron,sans-serif;letter-spacing:.2em;padding:8px 12px;border-radius:999px;display:none}
</style></head><body>
<canvas id="gl"></canvas><canvas id="out"></canvas>
<button id="skip">✕</button>
<div id="start"><div class="in">
  <div class="k">A JARVIS PRODUCTION</div>
  <h1>J.A.R.V.I.S</h1>
  <div class="k">THE TRAILER · SOUND ON</div>
  <div class="lbl">STYLE</div>
  <div class="row" id="styles"><button class="opt on" data-s="epic" style="--c:#ffd23f">⚡ EPIC</button><button class="opt" data-s="hype" style="--c:#ff3df0">🔥 HYPE</button><button class="opt" data-s="noir" style="--c:#c9d3df">🖤 NOIR</button></div>
  <div class="lbl">CUT</div>
  <div class="row" id="cuts"><button class="opt on" data-c="full">🎬 FULL · 60s</button><button class="opt" data-c="reel">📱 REEL · 30s VERTICAL</button></div>
  <div class="lbl">MAKE IT YOURS</div>
  <div class="row"><button class="opt" id="photosBtn">🖼 ADD YOUR PHOTOS</button><input type="file" id="photos" accept="image/*" multiple hidden></div>
  <div id="thumbs"></div>
  <input id="ded" maxlength="28" placeholder="Dedicate it (optional): e.g. for Mum">
  <button class="big" id="play">▶ PLAY</button>
  <button class="big" id="rec">⬇ PLAY &amp; SAVE VIDEO</button>
  <div id="status">Loading your story…</div>
</div></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const N = window.JarvisNative || null;
const DEMO = {owner: "SIR", team: [["JARVIS", "Chief of staff", "#ffd23f"], ["FRIDAY", "Operations", "#ff5fa2"], ["ZEUS", "Career", "#ff7a3c"], ["ATHENA", "Studies", "#b06bff"],
  ["ORACLE", "Analyst", "#5fd8ff"], ["STEVE", "Fitness", "#3dff9a"], ["PEPPER", "Business", "#ffb347"], ["VERONICA", "Money", "#ff4d5e"]].map(([name, title, color]) => ({name, title, color})),
  stats: {steps_week: 52440, tasks_done_week: 17, events_week: 12, memories: 64, places_explored: 23, trophies: 5},
  outline: [[103.615,1.32],[103.64,1.29],[103.68,1.27],[103.72,1.25],[103.76,1.26],[103.8,1.265],[103.84,1.27],[103.86,1.28],[103.88,1.295],[103.92,1.3],[103.96,1.31],[104,1.33],[104.03,1.36],
    [104.03,1.39],[103.99,1.41],[103.95,1.4],[103.91,1.42],[103.87,1.44],[103.83,1.46],[103.79,1.45],[103.75,1.45],[103.71,1.43],[103.68,1.41],[103.65,1.38],[103.63,1.35],[103.615,1.32]],
  places: [{name: "HQ", lat: 1.353, lon: 103.944}, {name: "SMU", lat: 1.2966, lon: 103.8502}, {name: "JEWEL", lat: 1.3602, lon: 103.9897}, {name: "ORCHARD", lat: 1.304, lon: 103.832}], trail: []};
let D = DEMO;
const STYLES = {
  epic: {bpm: 120, c: ["#ffd23f", "#5fd8ff", "#ff7a3c"], roots: [55, 43.65, 65.41, 49], chords: [[220, 261.6, 329.6, 440], [174.6, 220, 261.6, 349.2], [261.6, 329.6, 392, 523.3], [196, 246.9, 293.7, 392]], grit: 1},
  hype: {bpm: 140, c: ["#ff3df0", "#3dfcff", "#ffe23d"], roots: [55, 43.65, 65.41, 49], chords: [[440, 523.3, 659.3, 880], [349.2, 440, 523.3, 698.5], [523.3, 659.3, 784, 1046.5], [392, 493.9, 587.3, 784]], grit: 1.4},
  noir: {bpm: 96, c: ["#e8eef5", "#ff3b3b", "#8fa3b8"], roots: [73.4, 58.3, 49, 55], chords: [[293.7, 349.2, 440, 587.3], [233.1, 293.7, 349.2, 466.2], [196, 233.1, 293.7, 392], [220, 277.2, 329.6, 440]], grit: .7},
};
let STYLE = STYLES.epic, STYLE_NAME = "epic", CUT = "full", PHOTOS = [], DEDIC = "";

// ---------------------------------------------------------------- stage
const GL = $("#gl"), OUT = $("#out"), X = OUT.getContext("2d");
const R = new THREE.WebGLRenderer({canvas: GL, antialias: false, alpha: false, preserveDrawingBuffer: true}); R.setClearColor(0x000000);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(50, 1, .1, 800);
scene.fog = new THREE.FogExp2(0x000000, .01);
let W = 0, H = 0, DPR = 1, rtS = null, rtA = null, rtB = null;
const portrait = () => H > W;

// ---------------------------------------------------------------- post-processing: bloom, chromatic aberration, glitch, grain
const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1), quadScene = new THREE.Scene(), quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)); quadScene.add(quad);
const VQ = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`;
const blurMat = () => new THREE.ShaderMaterial({uniforms: {t: {value: null}, px: {value: new THREE.Vector2()}}, vertexShader: VQ,
  fragmentShader: `uniform sampler2D t; uniform vec2 px; varying vec2 vUv; void main(){ vec3 c = texture2D(t, vUv).rgb * .2;
    c += (texture2D(t, vUv + px * 1.5).rgb + texture2D(t, vUv - px * 1.5).rgb) * .2; c += (texture2D(t, vUv + px * 3.5).rgb + texture2D(t, vUv - px * 3.5).rgb) * .13;
    c += (texture2D(t, vUv + px * 6.).rgb + texture2D(t, vUv - px * 6.).rgb) * .07; gl_FragColor = vec4(c, 1.); }`});
const POST = {
  bright: new THREE.ShaderMaterial({uniforms: {t: {value: null}, th: {value: .46}}, vertexShader: VQ,
    fragmentShader: `uniform sampler2D t; uniform float th; varying vec2 vUv; void main(){ vec3 c = texture2D(t, vUv).rgb; float l = max(c.r, max(c.g, c.b)); gl_FragColor = vec4(c * smoothstep(th, th + .3, l), 1.); }`}),
  blurH: blurMat(), blurV: blurMat(),
  final: new THREE.ShaderMaterial({uniforms: {tS: {value: null}, tB: {value: null}, strength: {value: 1.6}, ca: {value: .004}, time: {value: 0}, flash: {value: 0}, glitch: {value: 0}, fade: {value: 1}, tint: {value: new THREE.Color(1, 1, 1)}},
    vertexShader: VQ, fragmentShader: `
      uniform sampler2D tS, tB; uniform float strength, ca, time, flash, glitch, fade; uniform vec3 tint; varying vec2 vUv;
      float rnd(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
      void main(){ vec2 uv = vUv; float band = floor(uv.y * 28.);
        uv.x += glitch * step(.55, rnd(vec2(band, floor(time * 24.)))) * (rnd(vec2(band, time)) - .5) * .16;
        vec2 d = (uv - .5) * (ca + glitch * .03);
        vec3 c = vec3(texture2D(tS, uv + d).r, texture2D(tS, uv).g, texture2D(tS, uv - d).b);
        vec3 b = vec3(texture2D(tB, uv + d * 2.).r, texture2D(tB, uv).g, texture2D(tB, uv - d * 2.).b);
        c += b * strength; c *= tint;
        c *= smoothstep(1.05, .3, length(vUv - .5));
        c += (rnd(vUv * 1000. + time) - .5) * .07;
        c = mix(c, vec3(1.), flash); c *= 1. - fade;
        gl_FragColor = vec4(c, 1.); }`}),
};
function pass(mat, target){ quad.material = mat; R.setRenderTarget(target); R.render(quadScene, quadCam); }
function render(){
  R.setRenderTarget(rtS); R.render(scene, cam);
  POST.bright.uniforms.t.value = rtS.texture; pass(POST.bright, rtA);
  for (let i = 0; i < 2; i++){ POST.blurH.uniforms.t.value = rtA.texture; pass(POST.blurH, rtB); POST.blurV.uniforms.t.value = rtB.texture; pass(POST.blurV, rtA); }
  POST.final.uniforms.tS.value = rtS.texture; POST.final.uniforms.tB.value = rtA.texture; pass(POST.final, null);
}
function resize(){
  DPR = Math.min(1.5, devicePixelRatio || 1);
  let w = innerWidth, h = innerHeight;
  if (CUT === "reel" && w / h > 9 / 16) w = Math.round(h * 9 / 16);      // the Reel is always vertical
  W = Math.round(w * DPR); H = Math.round(h * DPR);
  OUT.width = W; OUT.height = H; OUT.style.width = w + "px"; OUT.style.height = h + "px";
  R.setPixelRatio(1); R.setSize(W, H, false); cam.aspect = W / H; cam.updateProjectionMatrix();
  [rtS, rtA, rtB].forEach(r => r && r.dispose());
  rtS = new THREE.WebGLRenderTarget(W, H); rtA = new THREE.WebGLRenderTarget(W >> 1, H >> 1); rtB = new THREE.WebGLRenderTarget(W >> 1, H >> 1);
  POST.blurH.uniforms.px.value.set(1 / (W >> 1), 0); POST.blurV.uniforms.px.value.set(0, 1 / (H >> 1));
}
addEventListener("resize", resize); resize();

const dot = (() => { const c = document.createElement("canvas"); c.width = c.height = 64; const g = c.getContext("2d"), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.3, "rgba(255,255,255,.5)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
const hex = h => { const c = new THREE.Color(h); return [c.r, c.g, c.b]; };
const C = c => new THREE.Color(c);
const glowMat = (c, op = .9) => new THREE.MeshBasicMaterial({color: C(c), transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide});
const lineMat = (c, op = .9) => new THREE.LineBasicMaterial({color: C(c), transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false});

// ---------------------------------------------------------------- the particle swarm: morphs, explodes, drifts
let clock = 0;
const NP = 16000, pos = new Float32Array(NP * 3), col = new Float32Array(NP * 3), from = new Float32Array(NP * 3), to = new Float32Array(NP * 3), vel = new Float32Array(NP * 3), seed = new Float32Array(NP);
for (let i = 0; i < NP; i++){ seed[i] = Math.random(); const r = 60 + Math.random() * 90, a = Math.random() * 6.283, b = Math.acos(2 * Math.random() - 1);
  pos.set([r * Math.sin(b) * Math.cos(a), r * Math.cos(b), r * Math.sin(b) * Math.sin(a)], i * 3); col.set([1, .82, .25], i * 3); }
to.set(pos);
const pg = new THREE.BufferGeometry(); pg.setAttribute("position", new THREE.BufferAttribute(pos, 3)); pg.setAttribute("color", new THREE.BufferAttribute(col, 3));
const pm = new THREE.PointsMaterial({size: .3, map: dot, vertexColors: true, transparent: true, opacity: .95, blending: THREE.AdditiveBlending, depthWrite: false});
const swarm = new THREE.Points(pg, pm); scene.add(swarm);
let morph = null, exploding = 0, SPIN = .05;
function shape(fn){ for (let i = 0; i < NP; i++){ const p = fn(i, seed[i]); to[i * 3] = p[0]; to[i * 3 + 1] = p[1]; to[i * 3 + 2] = p[2]; } }
function morphTo(fn, dur){ from.set(pos); shape(fn); morph = {t0: clock, dur}; exploding = 0; }
function explode(force = 1){ for (let i = 0; i < NP; i++){ const x = pos[i * 3], y = pos[i * 3 + 1], z = pos[i * 3 + 2], l = Math.hypot(x, y, z) || 1, s = (8 + seed[i] * 40) * force;
    vel[i * 3] = x / l * s + (Math.random() - .5) * 6; vel[i * 3 + 1] = y / l * s + (Math.random() - .5) * 6; vel[i * 3 + 2] = z / l * s + (Math.random() - .5) * 6; } morph = null; exploding = 1; }
function tint(fn){ for (let i = 0; i < NP; i++){ const c = fn(i, seed[i]); col[i * 3] = c[0]; col[i * 3 + 1] = c[1]; col[i * 3 + 2] = c[2]; } pg.attributes.color.needsUpdate = true; }
const styleTint = (i, s) => hex(STYLE.c[s < .7 ? 0 : s < .92 ? 1 : 2]).map(v => v * (.55 + s * .45));
const dim = (c, k) => () => hex(c).map(v => v * k);
const still = () => { swarm.rotation.set(0, 0, 0); SPIN = 0; };
const sphere = r => (i, s) => { const y = 1 - (i / (NP - 1)) * 2, rr = Math.sqrt(1 - y * y), th = i * 2.39996; const k = r * (1 + (s - .5) * .08); return [Math.cos(th) * rr * k, y * k, Math.sin(th) * rr * k]; };
const scatter = k => (i, s) => { const r = (50 + s * 110) * k, a = s * 999, b = (i * 1.7) % 3.14; return [r * Math.sin(b) * Math.cos(a), r * Math.cos(b), r * Math.sin(b) * Math.sin(a)]; };
const vortex = (i, s) => { const a = s * 40 + i * .002, r = 2 + s * 28; return [Math.cos(a) * r, (s - .5) * 3 + Math.sin(a * 3) * .6, Math.sin(a) * r]; };
const ringShape = r => (i, s) => { const a = (i / NP) * 6.283 * 3, rr = r + Math.sin(i * 12.9898) * 1.4; return [Math.cos(a) * rr, Math.sin(i * 78.233) * 1.1, Math.sin(a) * rr]; };
const tunnel = (i, s) => { const a = s * 6.283 * 7 + i, r = 7 + (i % 5) * .7; return [Math.cos(a) * r, Math.sin(a) * r, 20 - (i / NP) * 260]; };
function textPts(txt, width){
  const c = document.createElement("canvas"), g = c.getContext("2d"); c.width = 1400; c.height = 300;
  g.fillStyle = "#fff"; let fs = 210; g.font = `900 ${fs}px Orbitron, sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
  while (g.measureText(txt).width > 1340 && fs > 40){ fs -= 10; g.font = `900 ${fs}px Orbitron, sans-serif`; }
  g.fillText(txt, 700, 150); const d = g.getImageData(0, 0, 1400, 300).data, out = [];
  for (let y = 0; y < 300; y += 3) for (let x = 0; x < 1400; x += 3) if (d[(y * 1400 + x) * 4 + 3] > 128) out.push([(x - 700) / 1400 * width, -(y - 150) / 1400 * width]);
  return out.length ? out : [[0, 0]];
}
const textShape = (txt, width) => { const pts = textPts(txt, width); return (i, s) => { const p = pts[i % pts.length]; return [p[0] + (s - .5) * .14, p[1] + ((i * 7.3) % 1 - .5) * .14, (s - .5) * .7]; }; };
const geoXY = (lon, lat) => [(lon - 103.83) * 95, -(lat - 1.355) * 95];
function cityShape(){
  const ol = D.outline && D.outline.length > 3 ? D.outline : DEMO.outline, edge = [];
  for (let k = 0; k < ol.length - 1; k++){ const [a, b] = [geoXY(...ol[k]), geoXY(...ol[k + 1])]; for (let t = 0; t < 1; t += .02) edge.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }
  const poly = ol.map(p => geoXY(...p)), inside = (x, z) => { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){ const [xi, zi] = poly[i], [xj, zj] = poly[j];
    if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) c = !c; } return c; };
  const fill = []; let guard = 0; while (fill.length < 3000 && guard++ < 60000){ const x = (Math.random() - .5) * 46, z = (Math.random() - .5) * 26; if (inside(x, z)) fill.push([x, z]); }
  return (i, s) => { if (i < NP * .35){ const e = edge[i % edge.length]; return [e[0], (s - .5) * .2, e[1]]; } const f = fill[i % fill.length] || [0, 0]; return [f[0] + (s - .5) * .3, -.2 + s * .15, f[1] + (s - .5) * .3]; };
}

// ---------------------------------------------------------------- props per shot
const props = new THREE.Group(); scene.add(props);
let anims = [];
function clearProps(){ while (props.children.length){ const o = props.children[0]; props.remove(o); o.geometry?.dispose?.(); } anims = []; }
function ring(r, c, w, rot, len = 1.4){ const m = new THREE.Mesh(new THREE.TorusGeometry(r, w, 6, 160, Math.PI * len), glowMat(c, .9)); m.rotation.set(...rot); props.add(m); return m; }
function card(a){ const c = document.createElement("canvas"); c.width = 512; c.height = 160; const g = c.getContext("2d");
  g.strokeStyle = a.color; g.lineWidth = 4; g.shadowColor = a.color; g.shadowBlur = 18; g.strokeRect(10, 10, 492, 140); g.fillStyle = "rgba(5,10,16,.75)"; g.fillRect(12, 12, 488, 136);
  g.shadowBlur = 22; g.fillStyle = a.color; g.font = "900 58px Orbitron, sans-serif"; g.fillText(a.name, 34, 84); g.shadowBlur = 0; g.fillStyle = "#c9d6e3"; g.font = "600 26px JetBrains Mono, monospace"; g.fillText((a.title || "").toUpperCase(), 36, 124);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false})); s.scale.set(6.4, 2, 1); return s; }
const waves = [];
function shockwave(c = STYLE.c[0]){ const m = new THREE.Mesh(new THREE.RingGeometry(.9, 1, 96), glowMat(c, 1)); scene.add(m); waves.push({m, t0: clock}); }

// ---------------------------------------------------------------- music: original, beat-based, made live (and recorded with the video)
let AC = null, MASTER = null, REC_DEST = null, REVERB = null, DELAY = null, MUSIC = null, NOISE = null;
function audio(){
  AC = new (window.AudioContext || window.webkitAudioContext)(); MASTER = AC.createGain(); MASTER.gain.value = .9;
  const comp = AC.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 5; comp.attack.value = .003; comp.release.value = .2;
  MASTER.connect(comp); comp.connect(AC.destination); REC_DEST = AC.createMediaStreamDestination(); comp.connect(REC_DEST);
  MUSIC = AC.createGain(); MUSIC.connect(MASTER);
  REVERB = AC.createConvolver(); const len = AC.sampleRate * 3, ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
  REVERB.buffer = ir; const rv = AC.createGain(); rv.gain.value = .4; REVERB.connect(rv); rv.connect(MASTER);
  DELAY = AC.createDelay(1); DELAY.delayTime.value = .375; const fb = AC.createGain(), dw = AC.createGain(); fb.gain.value = .38; dw.gain.value = .35; DELAY.connect(fb); fb.connect(DELAY); DELAY.connect(dw); dw.connect(MUSIC);
  NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate); const nd = NOISE.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
}
const toBus = (node, wet = .25, bus = MUSIC) => { node.connect(bus); if (wet){ const g = AC.createGain(); g.gain.value = wet; node.connect(g); g.connect(REVERB); } };
function env(g, t, a, peak, d){ g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); }
function nsrc(t, dur){ const n = AC.createBufferSource(); n.buffer = NOISE; n.loop = true; n.start(t); n.stop(t + dur + .05); return n; }
const I = {

// ---------------------------------------------------------------- the voice-over (JARVIS's real voice from the laptop, else the device's)
const VOICE = [];
async function loadVoice(lines){
  VOICE.length = 0;
  await Promise.all(lines.map(async ([beat, agent, s]) => { let buf = null;
    if (location.protocol !== "file:"){ try { const r = await fetch("/api/tts", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({agent, text: s})});
      if (r.ok) buf = await AC.decodeAudioData(await r.arrayBuffer()); } catch {} }
    VOICE.push({beat, agent, s, buf}); }));
}
function sayAt(v, t){
  if (v.buf){ const src = AC.createBufferSource(), g = AC.createGain(); src.buffer = v.buf; g.gain.value = 1.35; src.connect(g); toBus(g, .1, MASTER); src.start(t); return; }
  setTimeout(() => { if (!playing) return; try { if (N?.speak && N.ttsAvailable?.()) N.speak("vo" + v.beat, v.s, v.agent === "FRIDAY" ? 1.2 : .9, 1); else { const u = new SpeechSynthesisUtterance(v.s); u.lang = "en-GB"; u.pitch = v.agent === "FRIDAY" ? 1.3 : .85; speechSynthesis.speak(u); } } catch {} },
    Math.max(0, (t - AC.currentTime) * 1000));
}

    props.add(new THREE.Points(g, new THREE.PointsMaterial({size: .35, map: dot, color: C(STYLE.c[0]), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false})));
    const curves = [new THREE.QuadraticBezierCurve3(new THREE.Vector3(L, 0, 0), new THREE.Vector3(0, 5.5, 0), new THREE.Vector3(Rr, .6, 0)), new THREE.QuadraticBezierCurve3(new THREE.Vector3(L, 0, 0), new THREE.Vector3(L * .4, 4.8, 0), new THREE.Vector3(0, 4.5, 0))];
    anims.push(() => { for (let i = 0; i < n; i++){ const k = ((clock - shotT0) * .9 + i / n) % 1, q = curves[i % 2].getPoint(i % 4 < 2 ? k : 1 - k); p[i * 3] = q.x; p[i * 3 + 1] = q.y + Math.sin(i) * .1; p[i * 3 + 2] = q.z; } g.attributes.position.needsUpdate = true; cloud.rotation.y += .05; });
    camMove([0, 1, portrait() ? 22 : 16], [0, 1.5, portrait() ? 19 : 13], [0, 1.5, 0], 2.2); slam(line, {y: .18, k: .7}); },
  photos(line){ clearProps(); still(); morphTo(scatter(1.3), .6); tint(dim(STYLE.c[0], .25));
    PHOTOS.slice(0, 6).forEach((tex, k, arr) => { const a = (k - (arr.length - 1) / 2) * .5, w = 5.2, h = w * ((tex.image.height / tex.image.width) || .75);
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({map: tex, transparent: true, opacity: 0, side: THREE.DoubleSide}));
      m.position.set(Math.sin(a) * 14, Math.cos(k * 1.7) * 1.2, -Math.cos(a) * 14 + 14); m.lookAt(0, 0, 24); props.add(m);
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(w, h)), lineMat(STYLE.c[0], 1)); e.position.copy(m.position); e.rotation.copy(m.rotation); props.add(e);
      anims.push(() => { const t = clock - shotT0 - k * .12; m.material.opacity = Math.max(0, Math.min(.92, t * 3)) * (.85 + .15 * Math.sin(clock * 40 + k)); }); });
    camMove([-4, 1, portrait() ? 34 : 30], [4, 1, portrait() ? 30 : 26], [0, 0, 6], 2.2); slam(line, {y: .16, k: .7}); },
  terrain(line){ clearProps(); still(); morphTo(scatter(1.4), .6); tint(dim(STYLE.c[0], .25));
    const geo = new THREE.PlaneGeometry(30, 30, 50, 50); geo.rotateX(-Math.PI / 2); const base = Float32Array.from(geo.attributes.position.array);
    props.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color: C(STYLE.c[1]), wireframe: true, transparent: true, opacity: .5, blending: THREE.AdditiveBlending, depthWrite: false})));
    const beam = new THREE.Mesh(new THREE.CylinderGeometry(.12, .12, 20, 8), glowMat("#ffffff", .9)); props.add(beam);
    anims.push(() => { const p = geo.attributes.position, t = clock * 1.4; let best = -1, bx = 0, bz = 0;
      for (let i = 0; i < p.count; i++){ const x = base[i * 3], z = base[i * 3 + 2], y = 6 * Math.exp(-((x - 3) ** 2 + (z + 2) ** 2) / 40) + Math.sin(x * .4 + t) * .6 + Math.cos(z * .35 + t * .8) * .6; p.setY(i, y); if (y > best){ best = y; bx = x; bz = z; } }

  stat(k){ const st = D.stats || {}, list = [[st.steps_week, "STEPS THIS WEEK", STYLE.c[0]], [st.tasks_done_week, "TASKS CRUSHED", STYLE.c[1]], [st.memories, "MEMORIES KEPT", STYLE.c[2]], [st.places_explored, "PLACES EXPLORED", "#b06bff"]];
    const [v, label, c] = list[k % list.length]; clearProps(); SPIN = .6; morphTo(ringShape(portrait() ? 11 : 16), .35); tint((i, s) => hex(c).map(x => x * (.5 + s * .5)));

// ---------------------------------------------------------------- the edit: every cut on the beat
let CUES = [], playing = false, done = false, BEAT = .5, beat0 = 0, MARKS = null;
function edit(){
  const full = CUT === "full", photos = PHOTOS.length > 0;
  const montage = [["core", "I LISTEN."], ["city", "I LEARN."], ["sims", "I PLAN."], ["body", "I PROTECT."], ["team", "I'M NEVER ALONE."], ["link", "WHEREVER YOU GO."], [photos ? "photos" : "terrain", photos ? "YOUR STORY." : "I RUN THE NUMBERS."]];
  const VO = {core: "I listen.", city: "I learn.", sims: "I plan.", body: "I protect.", team: "And I never work alone.", link: "Wherever you go, I go.", photos: "This is your story.", terrain: "I run the numbers."};
  const lines = [], cues = [], at = (b, fn) => cues.push({b, fn});
  const step = full ? 4 : 2, intro = full ? 24 : 8;
  at(0, () => SHOTS.intro()); at(full ? 16 : 4, () => SHOTS.build()); at(intro - .5, () => { FX.fade = 1; FX.typed = null; });
  at(intro, () => { FX.fade = 0; SHOTS.drop(); }); if (full) lines.push([2, "JARVIS", "Good evening, Sir. Systems coming online."]);
  let b = intro + (full ? 8 : 4);
  montage.forEach(([s, txt]) => { const bb = b; at(bb, () => { unslam(); shotT0 = clock; SHOTS[s](txt); }); lines.push([bb + .25, "JARVIS", VO[s]]); b += step; });
  for (let k = 0; k < 4; k++){ const bb = b; at(bb, () => { shotT0 = clock; SHOTS.stat(k); }); b += 2; }
  const warpB = b; at(b, () => { shotT0 = clock; SHOTS.warp(); }); b += full ? 8 : 4;
  const slowB = b; at(b, () => { shotT0 = clock; SHOTS.slowmo("And when you need me most…"); }); lines.push([b + .5, "JARVIS", "And when you need me most..."]); b += full ? 8 : 4;
  const dropB = b; at(b, () => { shotT0 = clock; SHOTS.finale(); }); b += full ? 8 : 4;
  at(b, () => { shotT0 = clock; SHOTS.logo(); }); lines.push([b + 1, "JARVIS", DEDIC ? `I'm always online, Sir. ${DEDIC.replace(/^for\s+/i, "This one's for ")}.` : "I'm always online, Sir."]); b += full ? 14 : 10;
  at(b, () => { FX.fade = 1; FX.end = null; }); b += 2;
  at(b, () => SHOTS.sting()); lines.push([b + .5, "FRIDAY", "Boss, you watched the whole thing? Legend."]); b += 6;

function score(t0, m){
  const B = BEAT, S = STYLE, beatT = k => t0 + k * B;
  I.pad(beatT(0), S.chords[0], m.intro * B, .03);
  for (let k = 0; k < m.intro - 2; k += 2) I.heart(beatT(k));
  for (let k = 3; k < m.intro - 4; k += 6) I.ping(beatT(k), S.chords[0][3] * 2);
  I.riser(beatT(Math.max(0, m.intro - 8)), Math.min(8, m.intro) * B - .1); I.whoosh(beatT(m.intro - 1), B);
  I.braam(beatT(m.intro)); I.subdrop(beatT(m.intro));
  for (let k = m.intro; k < m.warpB; k++){
    const inBar = (k - m.intro) % 4, chord = Math.floor((k - m.intro) / 4) % 4, tt = beatT(k);
    I.kick(tt); if (inBar === 1 || inBar === 3){ I.snare(tt); if (STYLE_NAME === "hype") I.clap(tt); }
    I.hat(tt + B / 2, inBar === 3); if (STYLE_NAME !== "noir") I.hat(tt + B / 4);
    if (inBar === 0) I.bass(tt, S.roots[chord], B * 1.9); if (inBar === 2) I.bass(tt, S.roots[chord] * (STYLE_NAME === "noir" ? 1 : 1.5), B * 1.9);
    if (k >= m.intro + 8) for (let s = 0; s < 4; s++) I.arp(tt + s * B / 4, S.chords[chord][(k * 4 + s) % 4] * (s % 2 ? 1 : 2));
    if (inBar === 0) I.pad(tt, S.chords[chord], B * 4, .03);
    if ((k - m.intro) % 4 === 0 && k > m.intro) I.whoosh(tt - B * .4, B * .5);
  }
  const wl = m.slowB - m.warpB;
  for (let k = 0; k < wl * 4; k++){ const tt = beatT(m.warpB) + k * B / 4, f = k / (wl * 4); I.snare(tt, .25 + f * .6); if (k % 4 === 0) I.kick(tt, .8); }
  I.riser(beatT(m.warpB), wl * B);
  I.subdrop(beatT(m.slowB)); I.pad(beatT(m.slowB), S.chords[3], (m.dropB - m.slowB) * B, .05);
  for (let k = m.slowB + 1; k < m.dropB - 1; k += 2) I.heart(beatT(k));
  I.riser(beatT(m.dropB - 2), 2 * B - .05);
  I.braam(beatT(m.dropB), 1.4); I.impact(beatT(m.dropB) + .01, 1.2);
  const outEnd = m.end - 8;
  for (let k = m.dropB; k < outEnd; k++){ const inBar = (k - m.dropB) % 4, chord = Math.floor((k - m.dropB) / 4) % 4, tt = beatT(k);
    if (inBar === 0 || inBar === 2) I.kick(tt); if (inBar === 2) I.snare(tt, 1.1); I.hat(tt + B / 2);
    if (inBar === 0){ I.bass(tt, S.roots[chord], B * 3.8); I.pad(tt, S.chords[chord], B * 4, .05); } }
  I.pad(beatT(outEnd), S.chords[0], 6 * B, .05); I.ping(beatT(outEnd), S.chords[0][3] * 2); I.ping(beatT(m.end - 6), 2093);
}

// ---------------------------------------------------------------- loop
let last = performance.now();
function frame(nowMs){
  const real = Math.min(.05, Math.max(0, (nowMs - last) / 1000)); last = nowMs;
  const dt = real * FX.timeScale; clock += real;
  if (playing && AC){ const beat = (AC.currentTime - beat0) / BEAT; CUES.forEach(c => { if (!c.fired && beat >= c.b){ c.fired = true; c.fn(); } }); }
  if (FX.pending && clock >= FX.pending.at){ const f = FX.pending.fn; FX.pending = null; f(); }
  if (morph){ const k = Math.min(1, (clock - morph.t0) / morph.dur), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    for (let i = 0; i < NP * 3; i++) pos[i] = from[i] + (to[i] - from[i]) * e; if (k >= 1) morph = null; }
  else if (exploding){ const damp = Math.pow(.2, dt); for (let i = 0; i < NP * 3; i++){ pos[i] += vel[i] * dt; vel[i] *= damp; } }
  else { for (let i = 0; i < NP; i += 2){ const j = i * 3 + 1; pos[j] = to[j] + Math.sin(clock * 1.3 + seed[i] * 40) * .05; } }
  pg.attributes.position.needsUpdate = true;
  const ph = playing && AC ? (((AC.currentTime - beat0) / BEAT) % 1 + 1) % 1 : 0, pump = FX.timeScale < 1 ? 0 : Math.exp(-ph * 7);
  swarm.scale.setScalar(1 + pump * .035); pm.size = .28 + pump * .08; swarm.rotation.y += dt * SPIN;
  anims.forEach(f => f(dt));
  for (let i = waves.length - 1; i >= 0; i--){ const w = waves[i], k = (clock - w.t0) / .9; if (k >= 1){ scene.remove(w.m); w.m.geometry.dispose(); waves.splice(i, 1); continue; }
    w.m.scale.setScalar(1 + k * 40); w.m.material.opacity = (1 - k) * .9; w.m.lookAt(cam.position); }
  if (rig){
    if (rig.warp){ cam.position.z -= real * 46; cam.position.x = Math.sin(clock * 1.2) * 1.1; cam.lookAt(cam.position.x * .5, 0, cam.position.z - 30); }
    else { const k = Math.min(1, (clock - rig.t0) / rig.dur), e = 1 - Math.pow(1 - k, 2); cam.position.lerpVectors(rig.from, rig.to, e);
      cam.position.x += Math.sin(clock * 1.7) * rig.hand * .6; cam.position.y += Math.sin(clock * 2.3) * rig.hand * .4; cam.lookAt(rig.look); }
  }
  if (FX.shake > .01) cam.position.add(new THREE.Vector3((Math.random() - .5) * FX.shake * .5, (Math.random() - .5) * FX.shake * .5, 0));
  FX.flash *= Math.pow(.0004, real);   // a punchy white frame, gone in a blink FX.glitch *= Math.pow(.02, real); FX.shake *= Math.pow(.03, real);
  const U = POST.final.uniforms; U.time.value = clock; U.flash.value = Math.min(1, FX.flash); U.glitch.value = FX.glitch; U.fade.value = FX.fade;
  U.ca.value = .003 + pump * .006; U.strength.value = (STYLE_NAME === "noir" ? .85 : 1.2) + pump * .35; U.tint.value.setRGB(...(STYLE_NAME === "noir" ? [1, .96, .94] : [1, 1, 1]));
  render(); drawOverlay();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------------------------------------------------------- start, record, finish
let recorder = null, chunks = [];
async function begin(record){
  STYLE = STYLES[STYLE_NAME]; BEAT = 60 / STYLE.bpm; resize();
  if (!AC) audio(); await AC.resume(); DELAY.delayTime.value = BEAT * .75;
  DEDIC = $("#ded").value.trim();
  const ed = edit(); MARKS = ed.marks;
  $("#status").textContent = "Warming up JARVIS's voice…"; await loadVoice(ed.lines);
  try { await document.fonts.load("900 60px Orbitron"); } catch {}
  $("#start").classList.add("off"); $("#skip").style.display = "block";
  if (record){ try { const s = OUT.captureStream(30); REC_DEST.stream.getAudioTracks().forEach(t => s.addTrack(t));
      const type = ["video/mp4;codecs=avc1,mp4a", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"].find(t => window.MediaRecorder?.isTypeSupported?.(t));
      recorder = new MediaRecorder(s, {mimeType: type, videoBitsPerSecond: 10e6}); chunks = []; recorder.ondataavailable = e => e.data.size && chunks.push(e.data); recorder.start(500); } catch { recorder = null; } }
  resetFX(); CUES = ed.cues.map(c => ({...c, fired: false})); beat0 = AC.currentTime + .15; score(beat0, MARKS);
  playing = true; done = false; VOICE.forEach(v => sayAt(v, beat0 + v.beat * BEAT));
  try { navigator.vibrate?.([30, 60, 30]); } catch {}
}
async function finish(){
  if (done) return; done = true; playing = false; $("#skip").style.display = "none"; FX.sting = null; FX.fade = 1; FX.end = null; FX.slam = null; FX.counter = null;
  if (recorder){ const r = recorder; recorder = null; await new Promise(res => { r.onstop = res; r.stop(); });
    const blob = new Blob(chunks, {type: r.mimeType}); $("#status").textContent = "Saving your trailer…"; let msg = "";
    if (location.protocol !== "file:"){ try { const d = await (await fetch("/api/trailer/video", {method: "POST", headers: {"Content-Type": r.mimeType}, body: blob})).json();
        msg = d.sent ? "Saved, and sent to your phone on Telegram, Sir. Ready to post." : "Saved on the laptop (data/trailers)."; } catch {} }
    if (!msg && !N){ const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "jarvis-trailer." + (r.mimeType.includes("mp4") ? "mp4" : "webm"); a.click(); msg = "Downloaded."; }
    $("#status").textContent = msg || "Couldn't save this time, Sir.";
  } else $("#status").textContent = "";
  $("#play").textContent = "↻ PLAY AGAIN"; $("#start").classList.remove("off");
}
$("#play").onclick = () => begin(false);
$("#rec").onclick = () => begin(true);
$("#skip").onclick = () => { if (AC){ MASTER.gain.setValueAtTime(0, AC.currentTime); setTimeout(() => MASTER.gain.setValueAtTime(.9, AC.currentTime), 600); } try { speechSynthesis.cancel(); } catch {} finish(); };
document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => { STYLE_NAME = b.dataset.s; document.querySelectorAll("[data-s]").forEach(x => x.classList.toggle("on", x === b)); });
document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { CUT = b.dataset.c; document.querySelectorAll("[data-c]").forEach(x => x.classList.toggle("on", x === b)); resize(); });
$("#photosBtn").onclick = () => $("#photos").click();
$("#photos").onchange = async e => {
  PHOTOS = []; $("#thumbs").innerHTML = "";
  for (const f of [...e.target.files].slice(0, 6)){ const url = URL.createObjectURL(f), img = new Image(); img.src = url; try { await img.decode(); } catch { continue; }
    const c = document.createElement("canvas"), k = Math.min(1, 1024 / Math.max(img.width, img.height)); c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    PHOTOS.push(new THREE.CanvasTexture(c)); $("#thumbs").insertAdjacentHTML("beforeend", `<img src="${url}" alt="">`); }
  $("#photosBtn").textContent = PHOTOS.length ? `🖼 ${PHOTOS.length} PHOTO${PHOTOS.length > 1 ? "S" : ""} IN` : "🖼 ADD YOUR PHOTOS";
};
(async () => {
  try {
    if (location.protocol === "file:" && N?.soloPack){ const p = JSON.parse(N.soloPack()), h = p.holo || {};
      D = {...DEMO, owner: (p.owner && p.owner !== "Sir") ? p.owner : "SIR", team: (p.team || []).length ? p.team : DEMO.team, outline: h.outline || DEMO.outline,
           places: Object.entries(p.places || {}).map(([k, v]) => ({name: /^(home|hq|house)$/i.test(k) ? "HQ" : k.toUpperCase(), lat: v[0], lon: v[1]})),
           stats: {...DEMO.stats, steps_week: (h.steps?.week || []).reduce((a, b) => a + b, 0), memories: (p.memories || []).length, places_explored: (h.explored || []).length, tasks_done_week: 0}}; }
    else { const r = await fetch("/api/trailer"); if (r.ok) D = {...DEMO, ...(await r.json())}; }
    $("#status").textContent = `Starring ${D.owner === "SIR" ? "you" : D.owner}. Pick a style and press play.`;
  } catch { $("#status").textContent = "Ready."; }
  const q = new URLSearchParams(location.search);
  if (q.get("style") && STYLES[q.get("style")]) document.querySelector(`[data-s="${q.get("style")}"]`).click();
  if (q.get("cut") === "reel") document.querySelector('[data-c="reel"]').click();
  if (q.get("autoplay") === "1") setTimeout(() => $("#play").click(), 400);
})();
